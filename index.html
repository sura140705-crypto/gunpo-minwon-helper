<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>군포시 민원 서식 작성 도우미</title>
<meta name="description" content="군포시 민원실 서식 작성 도우미 — 여권·가족관계등록 신고서·증명서 발급. 어르신 친화, 무저장(메모리 전용).">
<!--
  군포시 민원 서식 작성 도우미 — 허브(메뉴) 페이지
  - 단일 HTML · 외부 서버/라이브러리/CDN/폰트/이미지 없음
  - 입력값을 다루지 않는 안내·이동 전용 페이지 (개별 도우미가 메모리 전용으로 처리)
  - 각 서식 도우미로 이동하는 카드 목록
-->
<!--DESIGN-TOKENS v1-->
<style>
/* ══════════════════════════════════════════════════════════════════════
   디자인 토큰 (2026.08.24 신설) — `docs/디자인검토/DESIGN_PHILOSOPHY.md` §21

   「새로운 서식을 만들 때 새로운 디자인을 발명하지 않는다」를 지키려면 값이 한 곳에
   있어야 한다. 종전에는 색·반경·간격·글자 크기가 **다섯 원본에 흩어져 하드코딩**돼
   있었다(engine/base.html · passport · marriage · divorce · index). 한 곳을 고치면
   나머지 넷이 조용히 갈라진다 — 초기화 코드가 아홉 곳에 복제된 것과 같은 뿌리다.

   ⚠️ 이 블록은 **5개 원본에 글자까지 똑같이** 들어간다.
      고칠 때는 `engine/base.html` 을 고치고 →
        `node tools/build-form.js <이름>` 으로 엔진 5종 재빌드
        `python tools/check-design-tokens.py --fix` 로 손작성 3종·허브 반영
      확인은 `python tools/check-design-tokens.py` (다르면 exit 1).

   ⛔ **인쇄물에 나가는 값을 이 블록에 얹지 마라.** 여기 있는 것은 전부 화면 전용이다.
      서식 위 값의 위치·크기·글꼴은 절대좌표라 `verify-print.py` 19쪽 0px 가 지킨다.
      예외는 `--sign-hl` 하나이고, 왜 예외인지 그 자리에 적어 두었다.

   ⚠️ **신설 시점에는 아무도 이 토큰을 쓰지 않는다.** 값이 지금 화면과 똑같도록
      맞춰 두었을 뿐이다(화면 무변경이 이 단계의 합격 조건이었다). 하드코딩을
      토큰으로 바꾸는 일은 영역별로 나누어 진행한다 — 한꺼번에 바꾸면 무엇이
      화면을 바꿨는지 짚을 수 없다.
   ══════════════════════════════════════════════════════════════════════ */
:root{

  /* ── Institution Accent ────────────────────────────────────────────
     기관 대표색. **값을 여기에 적지 않는다** — `--blue` 계열은 SITE-CONFIG 블록이
     `documentElement.style` 로 주입하는 이름이고, 그 네 이름은 계약이다.
     새 CSS 는 아래 별칭을 쓴다. 그래야 나중에 `--blue` 라는 이름을 버리더라도
     화면 쪽 코드를 건드리지 않는다.
     ⛔ `--blue`·`--blue-dark`·`--blue-light`·`--grad` 를 **이름째 바꾸지 마라.**
        SITE-CONFIG·환경설정 창(main.js)이 그 이름으로 값을 넣는다. */
  --accent:        var(--blue);
  --accent-strong: var(--blue-dark);
  --accent-soft:   var(--blue-light);
  /* --grad(135° 그라데이션) — DESIGN_PHILOSOPHY §1 DON'T 는 **큰 면적의 장식적**
     Gradient 를 금하는 것으로 읽는다(2026.08.24 결정 §4). 지금 쓰이는 곳은 상단 바
     아래 3px 띠처럼 좁은 Accent 뿐이라 **당장 걷어내지 않는다.** 단색화 여부는
     최종 Visual Design 단계에서 다시 판단한다. */

  /* ── Surface (§1 Quiet Paper Desk · §2 세 영역) ─────────────────────
     대표색과 **무관한** 따뜻한 무채색. 기관이 대표색을 무엇으로 바꾸든 이 값들은
     그대로여서 색을 갈아 끼워도 화면이 무너지지 않는다.
     세 면의 명도를 조금씩 달리해 **선을 긋지 않고도 영역이 갈리게** 한다. */
  --surface-work: #f7f6f3;   /* LEFT   질문하고 입력하는 곳 */
  --surface-zone: #e4e1db;   /* CENTER 서식이 놓이는 바닥 */
  --surface-rail: #f1f0ec;   /* RIGHT  Context Rail */
  --surface-head: #fbfaf7;   /* 상단 바 */
  --surface-cool: #f2f4f7;   /* 옛 배경색(허브·7종). 세 영역으로 옮기면 사라진다 */

  /* ── Paper (§2 Paper First) ────────────────────────────────────────
     종이 자체는 언제나 흰색이다. 그림자로만 바닥에서 띄운다. */
  --paper:        #fff;
  --paper-shadow: 0 2px 6px rgba(0,0,0,.06), 0 14px 34px rgba(0,0,0,.10);

  /* ── Ink (§16 Typography is the Voice) ─────────────────────────────
     ⚠️ `--ink-muted` 를 더 옅게 하지 마라. §15 「가독성을 해칠 정도로 대비를
        낮추지 않는다」. 여권은 이미 한 번 진하게 올렸다(#5b626c → #495059). */
  --ink:       #1a1c1f;
  --ink-muted: #5b626c;

  /* ── Border ────────────────────────────────────────────────────────*/
  --border:        #d2cfc9;              /* 따뜻한 기본선 */
  --border-strong: #b9b6b0;              /* 입력칸·카드 테두리 */
  --border-cool:   #d5d9df;              /* 옛 회색선(허브·7종) */
  --hair:          rgba(27,95,192,.16);  /* 기하학적 포인트 선 */
  /* ⚠️ `--hair` 는 기본 파랑이 **박혀 있다.** 기관이 대표색을 초록으로 바꿔도
        이 선만 파랑으로 남는다 — 알려진 결함이고, 대표색에서 계산하도록
        SITE-CONFIG 에서 함께 주입하는 것이 옳다. 다음 단계로 미뤄 둔다. */

  /* ── Current Focus (§5 Show Where It Goes) ─────────────────────────
     **지금 작성 중인 Paper 위치.** 화면 전용이고, 기관 대표색에서 파생한 저채도다.
     ⛔ 노랑/Amber 로 바꾸지 마라. 그 색은 아래 **Print Marker** 의 것이고,
        한 색이 「지금 적는 칸」과 「여기 서명하세요」 두 뜻을 갖게 된다.
        (DESIGN_PHILOSOPHY §15 는 Muted Amber 를 제안했으나 이 충돌 때문에
         대표색 파생을 유지하기로 했다 — 2026.08.24 결정 §1.)
     ⚠️ 대표색에서 파생하므로 기관이 색을 바꾸면 Focus 도 따라온다. */
  --focus-face: var(--blue-light);
  --focus-line: var(--blue);

  /* ── Print Marker ──────────────────────────────────────────────────
     **출력 후 시민이 직접 서명·날인·기재할 위치.** Current Focus 와 섞지 마라 —
     이쪽은 사람이 펜을 댈 자리를 종이 위에서 가리키는 것이다.
     ⛔⛔ 이 토큰 하나만 **인쇄물이다.** 색·투명도·좌표를 바꾸면 인쇄 결과가 달라져
        `verify-print.py` 기준선을 갱신해야 한다. */
  --marker-sign: rgba(255,232,0,.55);

  /* ── Warning (§11 Privacy without Fear) ────────────────────────────
     > Warning color is semantic, not decorative.
     ⚠️ 빨강은 **실제 오류·위험·즉각적인 주의**에만 쓴다. 개인정보 안내처럼
        「중요하지만 위험은 아닌」 문장은 아래 `--notice-*`(갈색 계열)를 쓴다.
        지금 화면에는 이 규칙을 어긴 곳이 남아 있다(허브 빨간 띠, 인쇄 전 안내
        빨간 상자, 아무것도 틀리지 않았는데 뜨는 `.step-warn`). 다음 단계 과제다. */
  --warn:      #a12727;
  --warn-face: #fdecec;
  --warn-line: #f5b5b5;
  --notice:      #7a5600;   /* 중요하지만 위험이 아닌 안내 — 짙은 갈색 */
  --notice-face: #fff8e6;
  --notice-line: #ffe19a;

  /* ── Radius ────────────────────────────────────────────────────────
     여권 한 파일에 반경이 13가지 흩어져 있던 것을 아래 여섯 단계로 모았다
     (2026.08.24). 새 서식은 이 여섯 개 밖의 값을 쓰지 않는다.

     ⛔ **인쇄되는 반경 둘은 토큰을 쓰지 않는다** — 값이 박혀 있어야 한다.
          `.ovhi`     4px  Print Marker(서명 자리)
          `.csign-hl` 3px  위임장·동의서 서명 형광
        토큰으로 바꿔 두면 나중에 아래 값을 만질 때 **인쇄물이 조용히 달라진다.**
     ⚠️ 제목 왼쪽 2px 장식 막대도 뺐다 — 폭이 3px 남짓이라 `--r-xs`(4px)를 주면
        알약이 된다. 스케일에 넣기엔 너무 작다. */
  --r-xs:   4px;
  --r-sm:   8px;
  --r-md:  10px;    /* 가장 많이 쓰이는 값 */
  --r-lg:  12px;
  --r-xl:  18px;
  --r-pill: 999px;

  /* ── Shadow (§1 DON'T 강한 그림자) ─────────────────────────────────*/
  --shadow-lift:  0 4px 20px rgba(0,0,0,.4);
  --shadow-modal: 0 20px 60px rgba(0,0,0,.35);

  /* ── Spacing ───────────────────────────────────────────────────────*/
  --sp-1:  4px;
  --sp-2:  8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 22px;
  --sp-6: 30px;

  /* ── Motion (§17 Interaction) ──────────────────────────────────────
     「움직임은 상태를 설명할 때만」을 지키려면 값이 한 곳에 있어야 한다.
     종전에는 5원본 8곳에 박혀 있었고 종류가 벌써 다섯이었다(.12·.15·.2·.22·.34s).
     easing 은 대부분 **방치**돼 브라우저 기본값(ease)으로 굴러갔다 — Radius 13가지와 같은 뿌리다.

     ⚠️ **아래 값은 지금 화면을 그대로 옮긴 것이지, 정해진 값이 아니다.**
        `docs/디자인검토/2026.08.25-의뢰서-모션과-시각.md` 로 밖에 물어 둔 상태이고,
        답이 오면 **이 여섯 줄만** 갈아 끼운다. 그것이 이 블록을 만든 이유다.

     ⛔ 인쇄물에는 모션이 없다. 이 값들은 전부 화면 전용이다.
     ⚠️ 아래 `@media (prefers-reduced-motion: reduce)` 가 이것들을 통째로 끈다.
        ⛔ 다만 **JS 로 도는 것(허브 시연)은 CSS 로 안 꺼진다** — `matchMedia` 로 따로 본다. */
  --dur-quick: 120ms;   /* 눌린 표시·hover — 즉답으로 느껴져야 한다 */
  --dur-base:  220ms;   /* 펼침·접힘·나타남 */
  --dur-calm:  340ms;   /* 종이 갈아끼우기처럼 느긋한 것 */
  --ease-out:  cubic-bezier(.22,.61,.36,1);   /* 들어오는 것 — 빨리 나와 천천히 멎는다 */
  --ease-in:   cubic-bezier(.55,.06,.68,.19); /* 나가는 것 */
  --ease-move: cubic-bezier(.4,0,.2,1);       /* 자리를 옮기는 것 */

  /* ── Typography (§16) ──────────────────────────────────────────────
     글꼴은 하나만 쓴다. 관공서 PC 에 반드시 있는 것이어야 하고, 오프라인
     설치본이라 웹폰트를 받을 수 없다. */
  --ff: "Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
  --fs-question: 34px;    /* 시민에게 말하는 큰 질문 */
  --fs-lead:     21px;    /* 입력칸에 치는 글자 */
  --fs-label:    18px;    /* 항목 라벨 */
  --fs-card:     20px;    /* 선택 카드 제목 */
  --fs-card-sub: 15px;    /* 선택 카드 설명 */
  --fs-body:     17px;    /* 본문 기본 */
  --fs-help:     17px;    /* 「왜 묻는지」 */
  --fs-sum:    16.5px;    /* 최종 확인 요약 줄 */
  --fs-small:  13.5px;    /* 행정적 보조 설명 */
  /* Context Rail(§10)은 구조와 폭을 고정하고 **글자만** 크게 보기를 따른다 */
  --fs-rail-num:   33px;  /* 진행 큰 숫자 */
  --fs-rail-head:  15px;  /* 「준비하셨나요?」 같은 머리 */
  --fs-rail-item:13.5px;  /* 목록 항목 */
  --fs-rail-note:12.5px;  /* 안심 안내 본문 */
  --fw-bold:   700;
  --fw-heavy:  800;
  --ls-tight: -.035em;    /* 큰 질문에만 */

  /* ── Touch target — Input-Agnostic, Touch-Friendly ─────────────────
     터치·마우스·물리키보드에서 **모두** 쓸 수 있어야 한다(2026.08.24 결정 §2).
     ⚠️ **크기는 터치 기준을 유지한다.** 큰 표적은 마우스에서도 문제가 없지만
        그 반대는 성립하지 않는다.
     ⛔ hover 는 보조 효과로만 쓴다. **hover 에만 의존하는 정보·기능은 금지.** */
  --touch-card:  132px;   /* 큰 선택 카드 최소 높이 */
  --touch-field:  64px;   /* 글자 입력칸 높이 */
  --touch-min:    48px;   /* 그 밖의 누를 수 있는 것의 최소 변 */
  --btn-h:        62px;   /* [이전]·[다음] 높이 */

  /* ── Layout (§2 LEFT / CENTER / RIGHT) ─────────────────────────────*/
  --topbar-h:      74px;
  --rail-w:       252px;
  --rail-w-narrow:214px;  /* 1600px 이하 */
  --question-max: 640px;  /* 질문 한 줄이 길어지지 않게 */
  --cards-max:    700px;
  /* 세 영역의 가로 배분. **1920×1080 실물을 보고 미세조정**할 수 있게 토큰으로 뺐다.
     ⛔ 비율만 숫자로 빼서 `calc(var(--x)*1fr)` 로 쓰지 마라 — **`fr` 은 `calc()` 안에서
        쓸 수 없다.** 선언 전체가 무효가 되어 3단이 한 줄로 무너진다(2026.08.24 에 실제로
        그렇게 깨졌고 갈무리 용량이 절반으로 줄어 들통났다). 트랙 목록을 통째로 담는다. */
  /* ⚠️ 2026.08.24 — 고정폭 RAIL 을 버리고 **비율**로 바꿨다. 종전 값(1 : 1.08 : 252px)은
     1920 에서 794 : 858 : 252 = 약 3 : 3 : 1 이 되어 **질문면이 너무 넓고 종이가 좁았다.**
     이제 세 칸 전부 `fr` 이라 화면이 커지든 작아지든 비율이 유지된다.
       일반 보기  2 : 3 : 1   → 1920 에서 640 : 960 : 320
       크게 보기  5 : 5 : 2   → 1920 에서 800 : 800 : 320  (아래 html.big)
     RAIL 은 두 경우 모두 화면의 1/6 이라 폭이 변하지 않는다 — 「크게 보기에서 RAIL 은
     구조와 폭을 그대로 두고 글자만 키운다」(동결 §3-3)가 이렇게 지켜진다. */
  --cols:             minmax(0,2fr) minmax(0,3fr) minmax(0,1fr);
  /* 좁은 화면에서도 비율이 같다 — 고정폭이 아니라 `fr` 이므로 저절로 줄어든다.
     이름은 남겨 둔다(각 화면의 미디어 쿼리가 이 이름으로 참조한다). */
  --cols-narrow:      minmax(0,2fr) minmax(0,3fr) minmax(0,1fr);
  --cols-narrow-left: minmax(0,3fr) minmax(0,2fr) minmax(0,1fr);
}

/* ── 크게 보기 (§13) — Responsive Layout Mode ─────────────────────────
   ⛔ **전체 화면 Zoom 이 아니다.** Paper 를 통째로 확대하는 기능도 아니다.
      목적은 질문·입력·조작 UI 의 읽기와 조작 편의이고, CENTER Paper 는
      **바뀐 영역 안에서 가능한 최대 크기**를 유지한다(fit-to-area).
   ⚠️ 그래서 크게 보기를 켜면 **Paper 는 오히려 작아진다**(1920 기준 794→667px).
      **버그가 아니라 받아들인 결과다**(2026.08.24 결정 §6-1). 서식을 크게 보는 길은
      Paper 확대·스크롤과 [미리보기]로 따로 있다. 되돌리려면 그 결정을 먼저 고쳐라.
      비율 조정이 필요하면 **아래 `--cols` 계열만** 만진다 — 그것이 의도된 조정 경로다.
   ⚠️ RIGHT Context Rail 은 **구조와 폭을 그대로 두고 글자만** 키운다.
      자유 Drag/Resize 는 만들지 않는다.
   ⚠️ 아래는 전부 토큰이다 — 실물 화면을 보고 이 값만 만지면 된다. */
html.big{
  --fs-question:  40px;
  --fs-lead:      24px;
  --fs-label:     21px;
  --fs-card:      23px;
  --fs-card-sub:  17px;
  --fs-body:      19px;
  --fs-help:      19px;
  --fs-sum:     18.5px;
  --fs-small:     15px;
  --fs-rail-num:  38px;
  --fs-rail-head: 17px;
  --fs-rail-item:15.5px;
  --fs-rail-note: 14px;
  --touch-card:  150px;
  --touch-field:  72px;
  --touch-min:    56px;
  --btn-h:        72px;
  --question-max:780px;
  --cards-max:   820px;
  /* LEFT 를 넓힌다 — CENTER Paper 는 남은 폭에 스스로 맞춰 줄어든다(fit-to-area).
     RIGHT 는 폭 그대로다(글자만 커진다). */
  --cols:             minmax(0,5fr) minmax(0,5fr) minmax(0,2fr);
  --cols-narrow:      minmax(0,5fr) minmax(0,5fr) minmax(0,2fr);
  --cols-narrow-left: minmax(0,5fr) minmax(0,5fr) minmax(0,2fr);
}

/* ── 공통 UI 규칙 ─────────────────────────────────────────────────────
   9개 화면이 함께 지켜야 하는 것. 값이 아니라 규칙이라 `:root` 밖에 둔다. */

/* §17 Interaction — 움직임은 상태를 설명할 때만. 줄여 달라고 한 사용자에게는 끈다.
   ⚠️ JS 의 `scrollIntoView({behavior:"smooth"})` 는 CSS 로 꺼지지 않는다.
      그쪽은 각 서식이 `matchMedia` 로 따로 본다. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
}

/* 개인정보 덮개·안내 모달은 **화면 전용**이다. 인쇄 CSS 가 숨기지 않으면 실수로
   인쇄될 때 새까만 페이지가 나간다 — 덮개를 완전 불투명으로 올린 2026.08.24 에
   함께 막았다(그전에는 `.985` 라 티가 덜 났을 뿐 같은 문제였다). */
@media print{ #idleGuard,#printGuard,#printNotice{display:none !important;} }
</style>
<!--/DESIGN-TOKENS-->
<style>
  :root{
    /* 대표색 3종 + 그라데이션. SITE-CONFIG 가 이 이름으로 값을 넣는다.
       ⛔ 네 이름을 바꾸지 마라. */
    --blue:#1b5fc0; --blue-dark:#164e9e; --blue-light:#eaf1fb;
    --grad:linear-gradient(135deg,hsl(215,75%,52%) 0%,hsl(215,75%,43%) 52%,hsl(215,79%,32%) 100%);
    --line:#d5d9df; --bg:#f2f4f7; --muted:#5b626c; --ink:#1a1c1f;

       격자용이라 8개를 세로로 세우면 화면을 넘는다. 폭이 700px 가까이 되므로
       표적 넓이는 충분하다(터치 최소 변 `--touch-min` 48px 을 크게 넘는다). */
    --row-h:66px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;background:var(--surface-zone);color:var(--ink);
    font-family:var(--ff);font-size:var(--fs-body);line-height:1.55;
  }
  html.big{ --row-h:80px; }

  /* ═══════════════════════════════════════════════════════════════════
     MAIN — Writing 과 **같은 세 영역**(`--cols`) 을 쓴다.

     Start 화면을 두지 않기로 했으므로(2026.08.24) MAIN 다음이 곧 Writing 이다.
     둘의 기하가 같으면 페이지가 바뀌어도 화면이 움직이지 않는다 —
     ASK 는 질문·목록에서 질문·입력으로, PAPER 는 빈 서식에서 채워지는 서식으로
     내용만 바뀐다.

     ⚠️ Stitch 시안에서 가져온 것은 **비례·여백·정렬·ASK↔PAPER 시각 관계**다.
     ⛔ hover 에만 의존하는 정보를 만들지 않는다 — 첫 서식이 **처음부터** 떠 있고
        hover·포커스는 그것을 바꿀 뿐이다. 터치에서도 종이가 늘 보인다.

     ⚠️ **대기 화면을 따로 두지 않는다**(2026.08.25). 아무도 안 건드리면 이 화면이
        스스로 카드를 짚어 보이는 **시연**을 돌 뿐이다 — 아래 「시연」 절을 함께 보라.

  /* ── BAR ─────────────────────────────────────────────────────────────*/

    position:sticky;top:0;z-index:20;

  .topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
    background:var(--grad);}
  .brand{display:flex;align-items:center;gap:13px;min-width:0;}
  .brand-tx{min-width:0;}
  .brand b{display:block;font-size:17px;color:var(--blue-dark);letter-spacing:-.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand h1{margin:0;font-size:13px;font-weight:400;color:var(--ink-muted);

  .actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;

  .btn{font-family:inherit;font-size:15.5px;font-weight:var(--fw-bold);

  .btn:hover{background:var(--blue-light);}

  .topbar .btn{font-size:14.5px;padding:9px 12px;white-space:nowrap;}

  .layout{display:grid;grid-template-columns:var(--cols);}
  @media screen and (min-width:861px){

    .layout{flex:1 1 auto;min-height:0;}

  }
  .task-col{display:flex;flex-direction:column;min-width:0;overflow:auto;
    background:var(--surface-work);padding:30px 34px 24px;}
  /* 종이는 **세로에 맞춰** 한 페이지가 통째로 보인다(잘리지 않는다).
     ⚠️ `min-height:0` 이 없으면 flex 자식이 안 줄어들어 그림이 넘친다. */
  .form-col{min-width:0;overflow:hidden;background:var(--surface-zone);
    padding:22px 22px 10px;position:relative;
    display:flex;flex-direction:column;min-height:0;}
  .paper-fit{flex:1 1 auto;min-height:0;display:flex;
    align-items:center;justify-content:center;}
  /* 실제 서식 1쪽. ⛔ 인쇄용이 아니라 **미리보기용 축소본**이다
     (`tools/make-form-previews.py`). 인쇄물은 각 서식이 따로 갖고 있다.
     ⚠️ 그림을 `.img-hold` 로 감싼 것은 **베일을 그림 위에만** 덮기 위해서다 —
        감싸지 않고 `.paper-fit` 에 덮으면 종이 둘레의 바닥까지 밝아진다(실제로 겪었다).
     ⚠️ 크기는 실루엣(`.gp-sil`)과 **같은 식**으로 정한다. 두 상태가 같은 자리·같은
        크기여야 고를 때 「바뀌는」 것으로 읽힌다. */
  .img-hold{position:relative;width:min(210mm,100%);margin:0 auto;aspect-ratio:210/297;}
  .img-hold{width:min(210mm,100%,calc(100cqh * 210 / 297));}
  .gp-img{display:block;width:100%;height:100%;
    object-fit:contain;background:var(--paper);box-shadow:var(--paper-shadow);}
  /* 서식이 놓인 자리를 가리키는 모서리 선 — 여권과 같은 표시 */
  .form-col::before{content:"";position:absolute;left:25px;top:25px;width:94px;height:94px;
    border-left:1px solid var(--hair);border-top:1px solid var(--hair);pointer-events:none;}
  .rail-col{min-width:0;background:var(--surface-rail);}

  /* ── ASK ─────────────────────────────────────────────────────────────*/
  .ask-q{margin:0 0 6px;font-size:var(--fs-question);font-weight:var(--fw-heavy);
    line-height:1.28;letter-spacing:var(--ls-tight);}
  .ask-sub{margin:0 0 20px;font-size:var(--fs-help);color:var(--ink-muted);}

  /* 목록 카드 — **큰 글씨 = 시민이 하려는 일 / 작은 글씨 = 행정명칭**(철학 §3) */
  .cards{display:grid;gap:7px;margin:0 0 14px;}
  .card{display:flex;align-items:center;gap:10px;width:100%;
    min-height:var(--row-h);padding:10px 14px;background:var(--paper);
    border:1.5px solid var(--border-strong);border-radius:var(--r-lg);
    text-align:left;cursor:pointer;font-family:inherit;color:inherit;
    transition:border-color var(--dur-quick) var(--ease-out),
               background var(--dur-quick) var(--ease-out);}
  .card:hover,.card:focus-visible{border-color:var(--blue);background:var(--blue-light);}
  /* 지금 오른쪽에 떠 있는 서식 — hover 가 없는 터치에서도 **무엇이 보이는지** 알린다 */
  .card.picked{border-color:var(--blue);background:var(--blue-light);
    box-shadow:inset 3px 0 0 var(--blue);}
  /* ⚠️ 아이콘은 **보조 표시**다. 크면 목록이 둔해 보이고 시민의 말(큰 글씨)과
     주인 자리를 다툰다. 26px → 20px 로 내렸다(2026.08.24). */
  /* 아이콘은 보조 표시다. 20 → 14px(30% 더). 목록이 조밀해지고 시민의 말이 산다. */
  .card-ic{font-size:14px;line-height:1;flex:0 0 auto;width:17px;text-align:center;
    opacity:.85;}
  .card-tx{display:flex;flex-direction:column;gap:3px;min-width:0;}
  /* 목록은 여권의 두 칸 격자 카드보다 한 치수 작다 — 8개를 세로로 훑는 자리다.
     ⚠️ 크게 보기에서는 토큰이 커지므로 여기서도 함께 커진다. */
  .card-label{font-size:calc(var(--fs-card) - 2px);font-weight:var(--fw-heavy);
    color:var(--ink);line-height:1.25;letter-spacing:-.02em;}
  .card-formal{font-size:calc(var(--fs-card-sub) - 1px);color:var(--ink-muted);line-height:1.4;}

  /* Human Handoff (철학 §8) — 여기 없으면 시민이 갇힌다 */
  .card-sub{display:block;width:100%;margin:auto 0 0;padding:14px;
    font-family:inherit;font-size:15px;font-weight:var(--fw-bold);
    color:var(--ink-muted);background:var(--surface-work);
    border:1.5px dashed var(--border);border-radius:var(--r-lg);cursor:pointer;}
  .card-sub:hover{border-color:var(--blue);color:var(--blue-dark);background:var(--paper);}
  .staff-note{margin:10px 0 0;padding:13px 15px;font-size:15px;line-height:1.6;

    border:1px solid var(--notice-line);border-radius:var(--r-md);}
  .staff-note:empty{display:none;}

  /* ── PAPER — 고른 서식의 빈 신청서 ───────────────────────────────────
     ⛔ 8종 실제 서식 배경을 허브에 싣지 않는다(범용·저사양 원칙 §19).
        같은 컴포넌트가 제목과 항목만 바꿔 그린다.
     ⚠️ 실제 개인정보가 입력된 것처럼 보이게 하지 않는다 — 칸은 비어 있다. */
  .gpaper{width:min(210mm,100%);margin:0 auto;background:var(--paper);
    box-shadow:var(--paper-shadow);padding:34px 40px 38px;
    aspect-ratio:210/297;max-height:100%;}
  .gp-title{text-align:center;font-size:23px;font-weight:var(--fw-heavy);
    letter-spacing:.14em;color:var(--ink);}
  .gp-rule{height:2px;background:var(--ink);margin:16px 0 26px;}
  .gp-row{display:grid;grid-template-columns:132px minmax(0,1fr);gap:18px;
    align-items:center;padding:11px 0;border-bottom:1px solid var(--border);}
  .gp-k{font-size:15px;color:var(--ink-muted);}
  .gp-v{height:30px;border-radius:2px;background:var(--surface-work);}
  /* 서명란 — 한 줄로 둔다. 접히면 종이가 아니라 표처럼 읽힌다. */
  .gp-sign{display:flex;justify-content:flex-end;align-items:flex-end;gap:10px;
    margin-top:40px;white-space:nowrap;}
  .gp-sign span{font-size:14.5px;color:var(--ink-muted);}
  .gp-sign i{display:inline-block;font-style:normal;
    border-bottom:1px solid var(--ink);width:150px;height:22px;}
  .gp-note{flex:0 0 auto;margin:10px auto 0;width:min(210mm,100%);font-size:12.5px;
    color:var(--ink-muted);text-align:center;}

  /* ── RAIL ────────────────────────────────────────────────────────────*/
  .rail{display:flex;flex-direction:column;height:100%;min-height:0;overflow:auto;
    padding:26px 20px 20px;}
  .rail-info{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;}

  .rail-item .check{color:#b7b5af;font-weight:900;}
  .rail-item small{display:block;color:var(--ink-muted);font-size:11.5px;
    margin-top:2px;font-weight:400;}
  .rail-safe{margin-top:auto;border-top:1px solid var(--border);padding-top:16px;}
  .rail-safe .rail-head{font-size:var(--fs-rail-item);margin-bottom:7px;}
  .rail-safe p{font-size:var(--fs-rail-note);line-height:1.55;color:#5f6667;margin:6px 0;}
  .screen-notice{flex:0 0 auto;border-top:1px solid var(--border);
    margin-top:16px;padding-top:14px;}
  .screen-notice h3{margin:0 0 7px;font-size:12.5px;font-weight:900;color:var(--ink-muted);}
  .screen-notice ul{margin:0;padding-left:16px;}
  .screen-notice li{font-size:12px;color:#6a706d;line-height:1.6;}

  /* ---------------------------------------------------------------------
     빈 상태 · 카드 펼침 · 시연 (2026.08.25)

     ⚠️ 대기 화면을 **따로 두지 않는다.** 이 화면 하나가 대기도 하고 선택도 한다 —
        아무도 안 건드리면 **시연**이 카드를 하나씩 짚어 가운데 종이를 바꾸고,
        마우스가 움직이거나 아무 키나 누르면 시연이 멈추고 **기본 상태**로 돌아간다.
        별도 화면이 없으니 「깨어날 때 화면이 갈린다」는 느낌 자체가 생기지 않는다.
     ⛔ 카드를 누른다고 **바로 넘어가지 않는다.** 그 카드가 아래로 펼쳐져 설명과
        [작성 시작]을 내고, 그것을 눌러야 간다 — 잘못 누른 사람이 되돌아올 길이 생긴다.
     --------------------------------------------------------------------- */

  /* ══ 종이 자리의 네 단 (2026.08.25) ═════════════════════════════════════
     ⛔ **실제 서식은 「고른 것」에만 쓴다.** 종전에는 시연·hover·고름이 **셋 다**
        실제 서식을 띄워서, 눌러도 화면이 그대로인 것처럼 보였고(구별 안 됨)
        빽빽한 정부 서식이 2.6초마다 바뀌어 부담스러웠다.

       ① 아무것도 안 고름  빈 윤곽 + 「서식을 골라 주세요」
       ② 시연             실루엣 — 이름 + 항목 줄이 **하나씩 그어진다**
       ③ hover            실루엣 — 정지. 줄은 비어 있다
       ④ 고름             **실제 서식**, 살짝 흐리게 — 아직 내 것이 아니다
       ⑤ 작성(Writing)    실제 서식, 또렷 ← 페이지가 바뀌는 순간 선명해진다

     **선명도가 곧 확정의 단계다.** ④→⑤ 는 기하가 같아 화면이 안 움직이는 전환인데,
     종이가 또렷해지는 것이 그 순간을 말해 준다.
     ═══════════════════════════════════════════════════════════════════════ */

  /* ⛔ `[hidden]` 은 브라우저 기본 규칙이라 **클래스의 `display` 에 진다.**
     아래는 `display` 를 직접 주므로 숨김 규칙을 같이 적어야 한다 —
     빠뜨리면 `hidden=true` 로 감춘 것이 화면에 그대로 남는다(실제로 겪었다). */
  .gp-empty[hidden],.img-hold[hidden],.gp-sil[hidden]{display:none;}

  /* ── ① 빈 자리 ──
     ⚠️ hover 가 없는 터치에서 빈 화면이 되지 않게 **이 자리가 대신 말을 건다.** */
  .gp-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;height:100%;color:var(--ink-muted);text-align:center;}
  .gp-empty b{display:block;font-size:var(--fs-lead);font-weight:var(--fw-bold);color:var(--ink);}
  .gp-empty small{display:block;margin-top:5px;font-size:var(--fs-small);}
  /* 종이 윤곽만 그려 둔다 — 「여기에 종이가 놓입니다」를 보이는 것으로 말한다 */
  .gp-empty .ghost{width:min(52%,300px);aspect-ratio:210/297;border-radius:2px;
    border:2px dashed var(--border);}

  /* ── ②③ 실루엣 ──
     실제 서식이 **아니다.** 이름과 항목 수만 가진 종이 모양이다.
     ⛔ 그림을 쓰지 않으므로 무게가 없다 — 2.6초마다 바뀌어도 부담되지 않는다.
     ⚠️ 크기는 실제 서식과 **같은 자리·같은 비율**이어야 한다. 그래야 고를 때
        실루엣이 실제 서식으로 **바뀌는** 것으로 읽힌다(딴 것이 나타나는 게 아니다). */
  /* ⚠️ **폭 하나로 크기를 정한다.** `width` + `max-height` 를 같이 주면 A4 비율이
     깨진다(2026.08.25 에 겪었다). 재는 상자는 `.paper-fit` 이다 — 아래 참조.
     ⚠️ 컨테이너 질의를 모르는 브라우저에서는 이 선언이 무시되고 `min(210mm,100%)`
        로 물러난다. 종이가 조금 클 뿐 화면은 깨지지 않는다. */
  .gp-sil{width:min(210mm,100%);margin:0 auto;background:var(--paper);
    box-shadow:var(--paper-shadow);aspect-ratio:210/297;
    display:flex;flex-direction:column;padding:6.5% 8% 7%;
    transition:opacity var(--dur-calm) var(--ease-out);}
  .gp-sil{width:min(210mm,100%,calc(100cqh * 210 / 297));}
  .sil-name{font-size:clamp(15px,2.4cqh,23px);font-weight:var(--fw-heavy);
    letter-spacing:.06em;color:var(--ink);text-align:center;}
  .sil-rule{height:2px;background:var(--border-strong);margin:4% 0 7%;}
  /* ⛔ 줄 사이를 `%` 로 벌리지 마라. 이 상자는 높이가 **내용에서 나오므로** 백분율
     간격이 0 으로 접힌다 — 줄이 위에 뭉쳐 바코드처럼 보인다(2026.08.25 에 겪었다).
     종이 높이를 재는 `cqh` 로 벌린다(재는 상자는 `.paper-fit`). */
  .sil-rows{display:flex;flex-direction:column;gap:clamp(10px,4.2cqh,44px);}
  /* 한 줄 = 한 항목. 비었을 때는 옅은 밑줄, 그어지면 획이 찬다. */
  .sil-row{height:clamp(8px,1.25cqh,13px);border-radius:2px;background:var(--surface-work);
    position:relative;overflow:hidden;}
  .sil-row::after{content:"";position:absolute;inset:0;width:0;border-radius:2px;opacity:.42;
    background:repeating-linear-gradient(90deg,var(--ink-muted) 0 12px,transparent 12px 21px);
    transition:width var(--dur-calm) var(--ease-out);}
  .sil-row.wrote::after{width:var(--w,62%);}
  /* 아래쪽 서명 줄. ⚠️ 이것이 없으면 종이의 아래 절반이 통째로 비어 「빈 종이」로 읽히고,
     고른 순간 나오는 **빽빽한 실제 서식**과 무게가 너무 달라 다른 종이처럼 보인다.
     ⛔ 「서명하세요」 표시가 아니다 — 인쇄물의 `--marker-sign` 과 아무 관계가 없다. */
  .sil-sign{margin-top:auto;margin-bottom:7%;display:flex;justify-content:flex-end;}
  .sil-sign span{display:block;width:40%;height:clamp(8px,1.25cqh,13px);
    border-radius:2px;background:var(--surface-work);}
  .sil-foot{font-size:clamp(11px,1.6cqh,14px);
    color:var(--ink-muted);text-align:center;}

  /* ── ④ 고른 서식 — 실제 서식이지만 **아직 흐리다** ──
     ⛔ `filter:blur()` 를 쓰지 마라. 700×990 그림에 blur 는 재사용 사무용 PC 에서
        부담이다(§19 저사양). 흰 베일 한 겹이면 합성만으로 끝난다.
     ⚠️ 「흐림」은 화면 전용이다. 인쇄에는 이 겹이 나가지 않는다 — 허브는 인쇄하지 않는다. */
  .form-col{--veil:0;}
  /* `cqh` 를 쓰는 실루엣·그림이 이 상자의 높이를 잰다. 「같은 자리·같은 비율」이 되려면
     둘이 같은 칸에서 재야 한다. */
  .paper-fit{position:relative;container-type:size;}
  /* ⛔ 베일은 **그림 위에만** 덮는다(`.img-hold`). `.paper-fit` 에 덮으면 종이가 아니라
     구역 전체가 밝아져 바닥에 밝은 사각형이 생긴다. */
  .img-hold::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:var(--paper);opacity:var(--veil);
    transition:opacity var(--dur-calm) var(--ease-out);}
  .picked .form-col{--veil:.42;}

  /* -- 카드 펼침 --
     ⚠️ 카드는 `<button>` 이라 그 **안에** [작성 시작] 단추를 넣을 수 없다
        (단추 안의 단추는 HTML 위반이고 터치에서 엉뚱한 것이 눌린다).
        `.card-wrap` 으로 감싸고 펼침판을 **형제로** 둔다. */
  .card-wrap{display:block;}
  /* 0fr -> 1fr 은 내용 높이를 재지 않고도 부드럽게 열린다.
     ⛔ `max-height` 추측값을 쓰지 마라 — 준비물이 긴 여권에서 내용이 잘린다. */
  .card-open{display:grid;grid-template-rows:0fr;
    transition:grid-template-rows var(--dur-base) var(--ease-move);}
  .card-open > div{overflow:hidden;}
  .card-wrap.open .card-open{grid-template-rows:1fr;}
  .card-body{padding:14px 16px 16px;margin:0 0 7px;
    background:var(--paper);border:1.5px solid var(--blue);border-top:0;
    border-radius:0 0 var(--r-lg) var(--r-lg);}
  .card-wrap.open .card{border-color:var(--blue);background:var(--blue-light);
    border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:inset 3px 0 0 var(--blue);}
  /* ⚠️ 설명이 카드 제목(`--fs-card` - 2)만 해지면 위계가 죽는다. 카드 안의 보조
     글자 크기(`--fs-card-sub`)를 쓴다 — 크게 보기에서도 함께 커진다. */
  .card-desc{margin:0;font-size:var(--fs-card-sub);line-height:1.6;color:var(--ink-muted);}
  .card-scale{margin:9px 0 0;font-size:var(--fs-small);color:var(--ink-muted);}
  .card-ready{margin:11px 0 0;padding:0;list-style:none;}
  .card-ready li{font-size:var(--fs-small);line-height:1.6;color:var(--ink-muted);}
  .card-ready b{color:var(--ink);font-weight:var(--fw-bold);}
  .card-go{display:block;width:100%;margin:14px 0 0;min-height:var(--touch-min);
    font-family:inherit;font-size:var(--fs-label);font-weight:var(--fw-heavy);
    color:#fff;background:var(--blue);border:0;border-radius:var(--r-md);
    padding:13px 16px;cursor:pointer;}
  .card-go:hover{background:var(--blue-dark);}

  /* -- 시연 --
     ⛔ 시연이 짚는 카드에 `.picked` 를 쓰지 않는다. 그러면 시연이 끝난 뒤에도
        시민이 고른 것처럼 남는다 — 고르지도 않은 것이 골라져 있으면 안 된다.
     ⚠️ 목록 **높이는 고정**이다. 시연이 펼침판까지 열면 아래 카드들이 밀려내려가
        목록 전체가 출렁인다. 움직이는 것은 **강조 하나와 가운데 종이**뿐이다. */
  .card.demo-on{border-color:var(--blue);background:var(--blue-light);
    box-shadow:inset 3px 0 0 var(--blue);}
  .demo .card,.demo .card-sub{cursor:default;}
  /* 시연 중에만 나오는 말. 장치를 전제하지 않는다(철학 §19·§22) */
  .demo-cta{display:none;}
  .demo .demo-cta{display:block;margin:12px auto 0;width:min(210mm,100%);
    font-size:var(--fs-lead);font-weight:var(--fw-bold);color:var(--accent-strong);
    text-align:center;}
  /* 종이가 바뀔 때 튀지 않게 — 짧은 어둠이 아니라 가만한 갈아끼우기다.
     ⚠️ `prefers-reduced-motion` 에서는 공통 토큰 블록이 이 전환을 끈다. */
  .gp-img,.gpaper{transition:opacity var(--dur-calm) var(--ease-out);}
  /* ⚠️ 실루엣도 함께 뺀다 — 시연은 1.8초마다 실루엣끼리 갈아끼우므로, 여기서 빠지면
     시연에서만 종이가 툭툭 바뀐다(가장 오래 보이는 화면인데). */
  .form-col.swap .gp-img,.form-col.swap .gpaper,.form-col.swap .gp-sil{opacity:0;}

  :focus-visible{outline:3px solid var(--blue);outline-offset:2px;}

  @media screen and (max-width:1600px){ .layout{grid-template-columns:var(--cols-narrow);} }

  /* 세로 화면(1080×1920 키오스크) — 질문·목록 위 / 종이 아래.
     RAIL 은 머리맡 가로 띠로 접는다(동결 ⑧).
     ⚠️ 폭으로만 재면 1080 은 걸리지 않는다 — 여권과 같은 **화면비**로 잰다. */
  @media screen and (max-width:860px), screen and (max-aspect-ratio:9/10){
    /* ⚠️ 행을 `auto auto 1fr` 로 못 박는다. 안 그러면 세 칸이 다 내용 높이로 자라
       화면 아래로 넘치고, 키오스크는 스크롤을 모르는 사람이 많아 **종이가 잘린 채**
       끝난다. 남는 높이를 종이가 가져가야 `cqh` 로 재는 종이가 화면 안에 들어온다. */
    .layout{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;}
    .rail-col{order:1;} .task-col{order:2;} .form-col{order:3;}
    .rail{flex-direction:row;align-items:flex-start;gap:24px;
      padding:12px 20px;overflow-x:auto;}
    .rail-info{flex-direction:row;gap:24px;}
    .rail-safe{margin-top:0;border-top:0;padding-top:0;}
    .screen-notice{display:none;}
    .task-col{padding:22px 20px 16px;}
    .form-col{padding:16px 20px 24px;}
    .form-col::before{display:none;}
    .card-sub{margin-top:12px;}
  }

   취급 서식·업무 정책)을 키오스크 환경설정 창(Ctrl+Shift+S)에서 받는다.
   preload 가 `window.__kioskCfg` 를 **이 스크립트보다 먼저** 심어 준다.
   웹(GitHub Pages) 배포본에는 preload 가 없어 설정도 없다 — 그때는 아래가
   아무것도 하지 않고 서식에 적힌 기본값이 그대로 쓰인다.

   ⛔ **인쇄물은 건드리지 않는다.** 여기서 바꾸는 것은 `.topbar`(인쇄 CSS 가 숨긴다)와
      화면 전용 색 변수·로고뿐이다. 인쇄에 나가는 값을 이 통로에 얹지 마라 —
      그 순간 `verify-print.py` 19쪽 0px 안전망이 무너진다.
   ⚠️ 이 블록은 **8종 + 허브에 똑같이** 들어간다. 고칠 때는 `engine/base.html` 을 고쳐
      5종을 재빌드하고, 손작성 3종(passport·marriage·divorce)과 `index.html` 에 같은
      내용을 손수 반영한다(AGENTS.md §1). `sync-kiosk.sh --check` 는 루트↔키오스크
      드리프트만 본다 — **이 블록끼리의 드리프트는 잡아 주지 못한다.**
   ==================================================================== */
(function(){
  "use strict";
  var C=(typeof window!=="undefined" && window.__kioskCfg) || {};

  /* 서식 스크립트가 쓰는 창구. 기본값은 **서식이 갖고 있고** 설정은 덮어쓰기만 한다
     (기본값을 설정 쪽에도 적으면 두 벌이 되어 갈라진다). */

    cfg:C,
    org:function(def){ var o={},k; for(k in def) o[k]=def[k];

    policy:function(def){ var o={},k; for(k in def) o[k]=def[k];
      if(C.policy) for(k in C.policy) if(typeof C.policy[k]==="boolean") o[k]=C.policy[k];
      return o; },
    formOn:function(key){ return !(C.forms && C.forms[key]===false); },
    hasKeyboard:C.hasKeyboard!==false
  };

  /* ── 대표색 하나에서 명암·그라데이션을 만든다 ─────────────────────────
     기관마다 대표색이 있다. 색을 여러 개 받으면 조합이 어긋나 촌스러워지므로

        옅은 배경이 읽히지 않는다. 고른 색과 화면 색이 조금 다를 수 있다는 뜻이고,
        환경설정 창이 조정된 결과를 미리 보여 준다. */
  function toHsl(hex){
    var r=parseInt(hex.substr(1,2),16)/255, g=parseInt(hex.substr(3,2),16)/255, b=parseInt(hex.substr(5,2),16)/255;
    var mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, h=0, l=(mx+mn)/2;
    var s=d===0?0:d/(1-Math.abs(2*l-1));
    if(d!==0){
      if(mx===r) h=60*(((g-b)/d)%6);
      else if(mx===g) h=60*((b-r)/d+2);
      else h=60*((r-g)/d+4);
    }

    var t=toHsl(hex.toLowerCase()), H=t[0], S=Math.max(8,t[1]), L=Math.min(55,Math.max(30,t[2]));
    var c=function(s,l){ return "hsl("+H+","+s+"%,"+l+"%)"; };
    var base=c(S,L), dark=c(Math.min(100,S+4),Math.max(18,L-11)), lite=c(Math.min(90,S),95);
    var st=document.documentElement.style;
    st.setProperty("--blue",base);
    st.setProperty("--blue-dark",dark);
    st.setProperty("--blue-light",lite);
    st.setProperty("--grad","linear-gradient(135deg,"+c(S,Math.min(70,L+9))+" 0%,"+base+" 52%,"+dark+" 100%)");

    st.setProperty("--hair","hsla("+H+","+S+"%,"+L+"%,.16)");

  }

     쓰지 않기로 했으므로(2026.08.13 결정), 대신 **도움을 청하라고 눈에 보이게** 알린다.

      var bar=document.querySelector(".topbar"); if(!bar) return;
      var n=document.createElement("div");

      n.style.cssText="flex:1 0 100%;order:9;font-size:13.5px;font-weight:700;color:#8a4b00;"+
        "background:#fff7e6;border:1px solid #ffdf9e;border-radius:8px;padding:7px 10px;";
      n.textContent="글자를 적는 칸에서 입력이 어려우시면 창구 직원에게 말씀해 주세요.";

<script>

/* 지자체 교체용 설정 — 아래가 기본값이고, 키오스크 환경설정에 값이 들어 있으면

   `__site` 가 없으므로 아래 값이 그대로 쓰인다. */
var ORG_CONFIG = {
  orgName:"경기도 군포시", officeName:"군포시청 민원실"

if(window.__site) ORG_CONFIG = window.__site.org(ORG_CONFIG);

/* 취급 서식 필터. 설정이 없으면(웹 배포본) 전부 켜진 것으로 본다. */
function formOn(key){
  if(!key) return true;
  return window.__site ? window.__site.formOn(key) : true;
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function formatDate(d){
  var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  var w=["일","월","화","수","목","금","토"][d.getDay()];
  return y+"년 "+m+"월 "+day+"일 ("+w+")";
}

/* 그 기관이 취급하는 서식만. **그리는 쪽과 누른 것을 읽는 쪽이 같은 목록을 봐야 한다.** */

  return FORM_CATALOG.filter(function(f){ return formOn(f.key); });
}

/* -- 지금 오른쪽에 떠 있는 서식 -------------------------------------------
   ⚠️ **처음에는 아무것도 고르지 않은 상태다**(2026.08.25). 종전에는 첫 서식이 이미
      `picked` 로 떠 있었다 — hover 없는 터치에서 종이가 안 보이는 것을 막으려던
      것인데, 시민이 고르지도 않은 것이 골라져 있는 셈이라 헷갈렸다.
      그 자리는 이제 `#gpEmpty`(「서식을 골라 주세요」)가 맡는다.
   ⛔ hover 에만 의존하지 않는 원칙은 그대로다(2026.08.24 결정 §2) — hover 는
      미리보기를 잠깐 바꿀 뿐이고, **누르는 것만이 선택**이다. */
var picked = null;

function el(id){ return document.getElementById(id); }

/* ══ 종이 자리 — 네 단 (2026.08.25) ══════════════════════════════════════
   `mode` 로 갈린다. ⛔ **실제 서식은 `"picked"` 에만 쓴다.**
     "empty"  아무것도 안 고름 → 빈 윤곽 + 「서식을 골라 주세요」
     "silent" 시연·hover      → 실루엣(이름 + 항목 줄). 실제 서식이 아니다
     "picked" 고름            → 실제 서식, 흰 베일 한 겹으로 **살짝 흐리게**
   ⚠️ 그림이 없는 서식이 생기면 항목만 적힌 대체 종이로 물러난다 — 빈 화면을 내지 않는다.
   ═══════════════════════════════════════════════════════════════════════ */
function renderPaper(f, mode){
  var img=el("gpimg"), hold=el("gpHold"), pap=el("gpaper"),
      sil=el("gpSil"), empty=el("gpEmpty"), note=el("gpNote");
  var root=document.documentElement;
  hold.hidden=true; pap.hidden=true; sil.hidden=true; empty.hidden=true;
  root.classList.toggle("picked", mode==="picked");

  if(!f || mode==="empty"){
    img.removeAttribute("src"); img.alt="";
    empty.hidden=false; note.textContent="";
    return;
  }
  if(mode==="silent"){                       // 시연·hover — 실루엣
    img.removeAttribute("src"); img.alt="";
    sil.hidden=false;
    sil.innerHTML = silHtml(f);
    /* 「무엇을·얼마나」만 적는다. ⚠️ 없는 것을 지어내지 않는다 —
       `scale` 이 비면 그 줄을 내지 않는다(지금은 여권만 채워져 있다). */
    note.textContent = "";
    return;
  }
  // mode === "picked" — 실제 서식
  var src=(typeof FORM_IMAGES!=="undefined") ? FORM_IMAGES[f.key] : null;
  note.textContent = src ? "이 서식을 작성합니다. [작성 시작]을 누르면 또렷해집니다."
                         : "미리보기입니다. 실제 서식과 항목·배치가 다를 수 있습니다.";
  if(src){
    hold.hidden=false;
    img.src=src; img.alt=f.formal+" 미리보기";
    return;
  }
  img.removeAttribute("src"); pap.hidden=false;
  var rows=(f.preview&&f.preview.fields||[]).map(function(k){
    return '<div class="gp-row"><span class="gp-k">'+esc(k)+'</span><span class="gp-v"></span></div>';
  }).join("");
  pap.innerHTML =
    '<div class="gp-title">'+esc(f.formal)+'</div><div class="gp-rule"></div>'+rows+
    '<div class="gp-sign"><span></span><span>신청인 <i></i> (서명 또는 인)</span></div>';
}

/* 실루엣 한 장. ⛔ 실제 서식의 칸 이름을 베끼지 않는다 — **줄 수와 길이만** 쓴다.
   길이를 서로 다르게 두는 것은 「글자가 적힌 종이」로 읽히게 하기 위한 것이고,
   길이는 서식 이름에서 계산해 **같은 서식이면 늘 같게** 만든다(찍을 때마다 달라지지 않는다). */
var SIL_W = [34,52,46,72,41,58,66,38];
function silHtml(f){
  var n = (f.preview && f.preview.fields || []).length || 5;
  var seed = f.key.length;
  var rows = "";
  for(var i=0;i<n;i++){
    rows += '<div class="sil-row" style="--w:'+SIL_W[(i+seed)%SIL_W.length]+'%"></div>';
  }
  var foot = (f.scale && f.scale.steps)
    ? "약 "+f.scale.steps+"가지 · "+f.scale.minutes+"분쯤"
    : "질문에 답하면 채워집니다";
  return '<div class="sil-name">'+esc(f.formal)+'</div><div class="sil-rule"></div>'+
         '<div class="sil-rows">'+rows+'</div>'+
         '<div class="sil-sign"><span></span></div>'+
         '<div class="sil-foot">'+esc(foot)+'</div>';
}

/* 실루엣의 줄이 하나씩 그어진다 — 시연에서만. hover 는 정지된 실루엣이다.
   ⚠️ `prefers-reduced-motion` 이면 아예 돌지 않는다(시연 자체가 안 돈다). */
var silTimers=[];
function silStop(){ for(var i=0;i<silTimers.length;i++) clearTimeout(silTimers[i]); silTimers=[]; }
function silWrite(){
  silStop();
  var rows=document.querySelectorAll("#gpSil .sil-row");
  for(var i=0;i<rows.length;i++) rows[i].classList.remove("wrote");
  /* 한 카드에 머무는 동안 다 그어져야 한다 — 마지막 줄이 끝나고 조금 남게 나눈다. */
  var gap=Math.max(150, Math.floor((DEMO_STEP_MS-500)/Math.max(rows.length,1)));
  for(var j=0;j<rows.length;j++) (function(j){
    silTimers.push(setTimeout(function(){ rows[j].classList.add("wrote"); }, 120+j*gap));
  })(j);
}

/* 종이를 갈아 끼운다. 잠깐 흐려졌다가 새 종이로 돌아온다 — 툭 바뀌면 시선이 튄다.
   ⚠️ 시연이 카드를 짚어 갈 때 이 전환이 「누군가 조작하고 있다」를 만든다.
   ⚠️ `prefers-reduced-motion` 에서는 공통 토큰 블록이 전환을 꺼 즉시 바뀐다. */
var swapTimer=null;
function showPaper(key, mode){
  var col=document.querySelector(".form-col");
  clearTimeout(swapTimer); silStop();
  col.classList.add("swap");
  swapTimer=setTimeout(function(){
    renderPaper(formByKey(key), key ? (mode||"picked") : "empty");
    col.classList.remove("swap");
    if(mode==="silent" && demoing()) silWrite();
  }, 170);
}

/* -- 카드를 누르면 그 자리에서 펼쳐진다 -----------------------------------
   ⛔ **바로 넘어가지 않는다.** 누름 한 번에 페이지가 바뀌면 잘못 누른 사람이
      되돌아올 길이 없다. 설명을 읽고 [작성 시작]을 눌러야 간다.
   ⚠️ 한 번에 하나만 열린다. 다른 카드를 누르면 그쪽으로 옮겨간다. */
function openCard(key){
  var same = (picked===key);
  picked = same ? null : key;
  [].forEach.call(document.querySelectorAll(".card-wrap"),function(w){
    var on = w.getAttribute("data-key")===picked;
    w.classList.toggle("open", on);
    w.querySelector(".card").setAttribute("aria-expanded", on?"true":"false");
  });
  showPaper(picked, "picked");
  if(picked){
    /* ⚠️ 펼친 카드를 **목록 맨 위로** 올린다. `nearest` 로는 아래 카드가 밀려나는 것이
       그대로 보이고 펼침판이 화면 밖으로 나갈 수 있다 — `start` 면 밀림이 안 보인다. */
    var w=document.querySelector('.card-wrap[data-key="'+picked+'"]');
    if(w) w.scrollIntoView({block:"start",behavior:calmMotion()?"auto":"smooth"});
  }
}

/* 펼침판의 내용. ⚠️ **없는 것을 지어내지 않는다** — `ready`·`scale` 이 비어 있으면
   그 줄을 아예 내지 않는다. 지금은 여권만 채워져 있다. */
function cardBody(f){
  var h='<p class="card-desc">'+esc(f.desc||"")+'</p>';
  if(f.scale && f.scale.steps)
    h+='<p class="card-scale">약 '+f.scale.steps+'가지를 여쭤봅니다 · '
      +f.scale.minutes+'분쯤 걸립니다</p>';
  if(f.ready && f.ready.length){
    h+='<ul class="card-ready">';
    for(var i=0;i<f.ready.length;i++){
      var r=f.ready[i];
      h+='<li>'+(r.opt?"·":"✓")+' <b>'+esc(r.t)+'</b>'+(r.s?" — "+esc(r.s):"")+'</li>';
    }
    h+='</ul>';
  }
  return h+'<button type="button" class="card-go" data-go="'+esc(f.key)+'">작성 시작 →</button>';
}

function cardHtml(f){
  var id="open_"+f.key;
  return '<div class="card-wrap" role="listitem" data-key="'+esc(f.key)+'">'

    +   '<span class="card-ic" aria-hidden="true">'+f.icon+'</span>'

    +     '<span class="card-label">'+esc(f.citizen)+'</span>'

    +   '</span>'
    + '</button>'
    + '<div class="card-open" id="'+id+'"><div><div class="card-body">'
    +   cardBody(f)
    + '</div></div></div>'
    + '</div>';
}

function renderCards(){
  el("cards").innerHTML = visibleForms().map(cardHtml).join("");
}

/* RAIL — MAIN 상태. 아래 「안심하고 작성하세요」는 바닥 고정이다(동결 §7). */
function renderRailInfo(){
  var help=[["1","왜 묻는지 알려 드립니다","그 칸이 왜 필요한지 함께 적어 둡니다."],
            ["2","쉬운 말로 여쭤봅니다","서식의 용어 대신 평소 쓰는 말로 묻습니다."],
            ["3","적히는 자리를 보여 드립니다","답하시면 옆의 실제 신청서 그 칸에 바로 나타납니다."]];
  document.getElementById("railInfo").innerHTML =
    '<div class="rail-sec"><div class="rail-head">이렇게 도와드립니다</div><div class="rail-items">'+
    help.map(function(r){ return '<div class="rail-item"><span class="check">'+r[0]+'</span><div>'+
      esc(r[1])+'<small>'+esc(r[2])+'</small></div></div>'; }).join("")+
    '</div></div>'+
    /* 종전에는 이 내용이 화면 상단의 **빨간 띠**였다. 개인정보 안내는 중요하지만
       위험이 아니다 — Red 는 실제 오류·진행불가·임박한 파괴적 상태에만(철학 §11). */
    '<div class="rail-safe"><div class="rail-head">안심하고 작성하세요</div>'+
    '<p>적으신 내용은 이 화면에서만 쓰이고 어디에도 저장·전송되지 않습니다.</p>'+
    '<p>작성이 끝나면 종이로 인쇄해 창구에 내시면 됩니다. 접수·전송은 하지 않습니다.</p>'+
    '<p>출력물에는 개인정보가 들어 있습니다. <b>본인이 직접 수령·관리</b>해 주세요.</p>'+
    '<p>공용 PC 입니다. 사용 후에는 창을 닫아 개인정보가 남지 않게 해 주세요.</p></div>';
}

/* ==========================================================================
   시연 — 대기 화면을 대신한다 (철학 §22)

   「대기화면은 광고판이 아니라 사용해도 된다는 신호다.」

   ⛔ **별도 화면을 만들지 않는다**(2026.08.25). 아무도 안 건드리면 이 화면이
      스스로 카드를 하나씩 짚어 가운데 종이를 바꾼다 — 누군가 쓰고 있는 것처럼 보인다.
      깨어날 때 화면이 갈리지 않으니 「다른 제품으로 바뀐 것 같다」가 아예 생기지 않는다.
   ⛔ 캐러셀·시정홍보·빠른 pulse 를 쓰지 않는다. 움직이는 것은 **강조 하나와 종이**뿐이다.
   ⚠️ 서식 8종은 무동작·인쇄 후 이 파일로 돌아온다. 그 끝이 곧 이 시연이다.
   ========================================================================== */

var DEMO_STEP_MS = 1800;   // 카드 한 장에 머무는 시간. 8종이면 한 바퀴 14.4초
var DEMO_GUARD_MS = 400;   // 시연이 막 시작한 직후의 합성 mousemove 를 무시하는 시간

/* 아무 조작이 없을 때 시연으로 돌아가는 시간. 키오스크 환경설정 값이 있으면 그것을 쓴다
   (서식 8종의 초기화 대기와 같은 값 — 창구에서 두 가지를 따로 맞출 일이 없게 한다).
   ⚠️ 허브에는 지울 개인정보가 없다. 이 시계는 **보호가 아니라 대기로 돌아가기 위한 것**이라
      8종과 달리 30초 경고를 띄우지 않는다 — 잃을 것이 없는데 경고하면 소음이다. */
var DEMO_BACK_MS = (function(){
  var c = (typeof window!=="undefined" && window.__kioskCfg) || {};
  return (typeof c.idleMs==="number" && c.idleMs>0) ? c.idleMs : 3*60*1000;
})();

var demoTimer=null, backTimer=null, demoAt=0, lastArm=0;

/* ⚠️ CSS 의 `prefers-reduced-motion` 규칙은 transition/animation 만 끈다.
      **JS 로 도는 시연은 여기서 직접 갈라야 한다**(여권 `calmScroll()` 과 같은 방식). */
function calmMotion(){
  try{ return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
  catch(e){ return false; }
}

function demoing(){ return document.documentElement.classList.contains("demo"); }

function demoMark(key){
  [].forEach.call(document.querySelectorAll(".card"),function(n){
    n.classList.toggle("demo-on", n.getAttribute("data-key")===key);
  });
}

function startDemo(){
  clearTimeout(backTimer); backTimer=null;
  /* 시연은 **보여 주기만** 한다 — 열려 있던 것을 닫고 기본 상태에서 시작한다 */
  if(picked) openCard(picked);
  if(calmMotion()) return;      // 줄여 달라고 한 사용자에게는 아예 돌리지 않는다
  var forms=visibleForms(); if(!forms.length) return;
  document.documentElement.classList.add("demo");
  demoAt=+new Date();
  var i=-1;
  (function step(){
    i=(i+1)%forms.length;
    demoMark(forms[i].key);
    showPaper(forms[i].key, "silent");   // ⛔ 실제 서식이 아니다
    demoTimer=setTimeout(step, DEMO_STEP_MS);
  })();
}

/* 시연을 끝내고 **기본 상태**로 — 아무것도 골라지지 않고 종이 자리는 비어 있다.
   ⛔ 시연이 짚던 것을 골라진 것으로 넘겨주지 않는다. 시민이 고른 것이 아니다. */
function stopDemo(){
  clearTimeout(demoTimer); demoTimer=null; silStop();
  if(!demoing()) return;
  document.documentElement.classList.remove("demo");
  demoMark(null);
  renderPaper(null,"empty");          // 전환 없이 즉시 빈 자리로
  document.querySelector(".form-col").classList.remove("swap");
}

function armDemo(){
  clearTimeout(backTimer);
  backTimer=setTimeout(startDemo, DEMO_BACK_MS);
}

function chooseForm(key){
  var f=formByKey(key);
  if(f && f.href) location.href=f.href;
}

function bindEvents(){
  /* 시연을 끄는 것 — 마우스가 **움직이기만 해도** 끈다. 키·터치·휠도 마찬가지다.
     장치를 전제하지 않는다(철학 §19).
     ⚠️ 캡처 단계에서 받는다. 시연을 끄는 그 한 번은 **선택이 아니다** —
        그래서 시연 중이면 아래 클릭 처리로 내려가지 않게 여기서 막는다.
     ⚠️ 시연이 막 시작하면 커서 아래 요소가 바뀌어 브라우저가 mousemove 를 합성한다.
        그것에 즉시 꺼지지 않도록 처음 `DEMO_GUARD_MS` 동안은 움직임만 무시한다. */
  ["pointermove","pointerdown","keydown","wheel","touchstart"].forEach(function(t){
    document.addEventListener(t, function(e){
      var now=+new Date();
      if(demoing()){
        if(t==="pointermove" && now-demoAt < DEMO_GUARD_MS) return;
        stopDemo();
        armDemo();
        if(t==="pointerdown" || t==="touchstart"){ e.stopPropagation(); e.preventDefault(); }
        return;
      }
      /* 시연 중이 아니면 무동작 시계만 되감는다.
         ⚠️ mousemove 는 초당 수십 번 온다 — 1초에 한 번만 되감는다. */
      if(now-lastArm < 1000) return;
      lastArm=now; armDemo();
    }, true);
  });

  var list=el("cards");
  list.addEventListener("click", function(e){
    var go=e.target.closest("[data-go]");
    if(go){ chooseForm(go.getAttribute("data-go")); return; }   // [작성 시작]만 이동한다
    var b=e.target.closest(".card");
    if(b) openCard(b.getAttribute("data-key"));                 // 카드는 펼치기만 한다
  });
  /* hover·포커스는 **보조**다. 미리보기만 잠깐 바꾸고, 벗어나면 고른 것으로 돌아온다.
     ⚠️ 펼쳐 놓은 카드가 있으면 그것을 이긴다 — 열어 둔 것을 hover 가 가려서는 안 된다. */
  /* hover·포커스는 **실루엣**만 띄운다(2026.08.25). 종전에는 실제 서식을 띄워
     눌러도 화면이 그대로인 것처럼 보였다 — 누름이 아무 일도 안 한 것처럼 읽혔다. */
  list.addEventListener("mouseover", function(e){
    if(picked || demoing()) return;
    var b=e.target.closest(".card"); if(b) showPaper(b.getAttribute("data-key"), "silent");
  });
  list.addEventListener("mouseleave", function(){
    if(picked || demoing()) return;
    showPaper(null, "empty");
  });
  list.addEventListener("focusin", function(e){
    if(picked || demoing()) return;
    var b=e.target.closest(".card"); if(b) showPaper(b.getAttribute("data-key"), "silent");
  });

  el("btnStaff").addEventListener("click", function(){
    var n=el("staffNote");
    n.innerHTML = n.innerHTML ? "" :
      "<b>창구 직원에게 말씀해 주세요.</b><br>"+
      "어떤 서식이 필요한지 함께 찾아 드립니다. "+
      esc(ORG_CONFIG.officeName||"")+" 창구로 오시면 됩니다.";
  });
  /* 크게 보기 — `html.big` 이 디자인 토큰만 갈아 끼운다. 전체 화면 Zoom 이 아니다(§13). */
  document.getElementById("btnBig").addEventListener("click", function(){
    var on=document.documentElement.classList.toggle("big");
    this.setAttribute("aria-pressed", on?"true":"false");
    this.textContent = on ? "🔍 일반 보기로" : "🔍 크게 보기";
  });
}

function init(){
  el("orgName").textContent = ORG_CONFIG.orgName;
  el("today").textContent = formatDate(new Date());
  renderCards();
  renderRailInfo();
  bindEvents();
  renderPaper(null,"empty");   // 아무것도 고르지 않은 기본 상태 — 「서식을 골라 주세요」
  /* ⚠️ 화면을 **다 그려 둔 뒤** 시연을 얹는다. 시연이 꺼질 때 그릴 것이 남아 있으면
     전환이 「화면 교체」로 읽힌다. 여기서는 지울 것만 남아 있으면 된다. */
  startDemo();
}
init();
</script>
</body>
</html>

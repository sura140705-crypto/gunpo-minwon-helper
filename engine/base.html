<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>민원 서식 작성 미리보기 도우미</title>
<!--
  ⚠️ 이 파일은 build-form.js 생성물입니다. 직접 수정하지 마세요.
     소스: engine/base.html + engine/engine.js + forms/<이름>.config.js
     재생성: node tools/build-form.js <이름>
  - 단일 HTML 파일 · 외부 서버/라이브러리/CDN/폰트/이미지 없음
  - 입력값은 브라우저 메모리에서만 처리 · 저장(localStorage 등) 안 함 · 새로고침 시 소멸
  - 좌: 실제 서식 이미지 위에 값 오버레이 (실시간 반영) / 우: 단계별 간단 입력
  - 작성 보조·미리보기용 (공식 접수 가능 여부 미보장)
-->
<!--DESIGN-TOKENS v1-->
<style>
/* ══════════════════════════════════════════════════════════════════════
   디자인 토큰 (2026.08.24 신설) — `docs/디자인검토/DESIGN_PHILOSOPHY.md` §21

   「새로운 서식을 만들 때 새로운 디자인을 발명하지 않는다」를 지키려면 값이 한 곳에
   있어야 한다. 종전에는 색·반경·간격·글자 크기가 **다섯 원본에 흩어져 하드코딩**돼
   있었다(engine/base.html · passport · marriage · divorce · index). 한 곳을 고치면
   나머지 넷이 조용히 갈라진다 — 초기화 코드가 아홉 곳에 복제된 것과 같은 뿌리다.

   ⚠️ 이 블록은 **5개 원본에 글자까지 똑같이** 들어간다.
      고칠 때는 `engine/base.html` 을 고치고 →
        `node tools/build-form.js <이름>` 으로 엔진 5종 재빌드
        `python tools/check-design-tokens.py --fix` 로 손작성 3종·허브 반영
      확인은 `python tools/check-design-tokens.py` (다르면 exit 1).

   ⛔ **인쇄물에 나가는 값을 이 블록에 얹지 마라.** 여기 있는 것은 전부 화면 전용이다.
      서식 위 값의 위치·크기·글꼴은 절대좌표라 `verify-print.py` 19쪽 0px 가 지킨다.
      예외는 `--sign-hl` 하나이고, 왜 예외인지 그 자리에 적어 두었다.

   ⚠️ **신설 시점에는 아무도 이 토큰을 쓰지 않는다.** 값이 지금 화면과 똑같도록
      맞춰 두었을 뿐이다(화면 무변경이 이 단계의 합격 조건이었다). 하드코딩을
      토큰으로 바꾸는 일은 영역별로 나누어 진행한다 — 한꺼번에 바꾸면 무엇이
      화면을 바꿨는지 짚을 수 없다.
   ══════════════════════════════════════════════════════════════════════ */
:root{

  /* ── Institution Accent ────────────────────────────────────────────
     기관 대표색. **값을 여기에 적지 않는다** — `--blue` 계열은 SITE-CONFIG 블록이
     `documentElement.style` 로 주입하는 이름이고, 그 네 이름은 계약이다.
     새 CSS 는 아래 별칭을 쓴다. 그래야 나중에 `--blue` 라는 이름을 버리더라도
     화면 쪽 코드를 건드리지 않는다.
     ⛔ `--blue`·`--blue-dark`·`--blue-light`·`--grad` 를 **이름째 바꾸지 마라.**
        SITE-CONFIG·환경설정 창(main.js)이 그 이름으로 값을 넣는다. */
  --accent:        var(--blue);
  --accent-strong: var(--blue-dark);
  --accent-soft:   var(--blue-light);
  /* --grad(135° 그라데이션) — DESIGN_PHILOSOPHY §1 DON'T 는 **큰 면적의 장식적**
     Gradient 를 금하는 것으로 읽는다(2026.08.24 결정 §4). 지금 쓰이는 곳은 상단 바
     아래 3px 띠처럼 좁은 Accent 뿐이라 **당장 걷어내지 않는다.** 단색화 여부는
     최종 Visual Design 단계에서 다시 판단한다. */

  /* ── Surface (§1 Quiet Paper Desk · §2 세 영역) ─────────────────────
     대표색과 **무관한** 따뜻한 무채색. 기관이 대표색을 무엇으로 바꾸든 이 값들은
     그대로여서 색을 갈아 끼워도 화면이 무너지지 않는다.
     세 면의 명도를 조금씩 달리해 **선을 긋지 않고도 영역이 갈리게** 한다. */
  --surface-work: #f7f6f3;   /* LEFT   질문하고 입력하는 곳 */
  --surface-zone: #e4e1db;   /* CENTER 서식이 놓이는 바닥 */
  --surface-rail: #f1f0ec;   /* RIGHT  Context Rail */
  --surface-head: #fbfaf7;   /* 상단 바 */
  --surface-cool: #f2f4f7;   /* 옛 배경색(허브·7종). 세 영역으로 옮기면 사라진다 */

  /* ── Paper (§2 Paper First) ────────────────────────────────────────
     종이 자체는 언제나 흰색이다. 그림자로만 바닥에서 띄운다. */
  --paper:        #fff;
  --paper-shadow: 0 2px 6px rgba(0,0,0,.06), 0 14px 34px rgba(0,0,0,.10);

  /* ── Ink (§16 Typography is the Voice) ─────────────────────────────
     ⚠️ `--ink-muted` 를 더 옅게 하지 마라. §15 「가독성을 해칠 정도로 대비를
        낮추지 않는다」. 여권은 이미 한 번 진하게 올렸다(#5b626c → #495059). */
  --ink:       #1a1c1f;
  --ink-muted: #5b626c;

  /* ── Border ────────────────────────────────────────────────────────*/
  --border:        #d2cfc9;              /* 따뜻한 기본선 */
  --border-strong: #b9b6b0;              /* 입력칸·카드 테두리 */
  --border-cool:   #d5d9df;              /* 옛 회색선(허브·7종) */
  --hair:          rgba(27,95,192,.16);  /* 기하학적 포인트 선 */
  /* ⚠️ `--hair` 는 기본 파랑이 **박혀 있다.** 기관이 대표색을 초록으로 바꿔도
        이 선만 파랑으로 남는다 — 알려진 결함이고, 대표색에서 계산하도록
        SITE-CONFIG 에서 함께 주입하는 것이 옳다. 다음 단계로 미뤄 둔다. */

  /* ── Current Focus (§5 Show Where It Goes) ─────────────────────────
     **지금 작성 중인 Paper 위치.** 화면 전용이고, 기관 대표색에서 파생한 저채도다.
     ⛔ 노랑/Amber 로 바꾸지 마라. 그 색은 아래 **Print Marker** 의 것이고,
        한 색이 「지금 적는 칸」과 「여기 서명하세요」 두 뜻을 갖게 된다.
        (DESIGN_PHILOSOPHY §15 는 Muted Amber 를 제안했으나 이 충돌 때문에
         대표색 파생을 유지하기로 했다 — 2026.08.24 결정 §1.)
     ⚠️ 대표색에서 파생하므로 기관이 색을 바꾸면 Focus 도 따라온다. */
  --focus-face: var(--blue-light);
  --focus-line: var(--blue);

  /* ── Print Marker ──────────────────────────────────────────────────
     **출력 후 시민이 직접 서명·날인·기재할 위치.** Current Focus 와 섞지 마라 —
     이쪽은 사람이 펜을 댈 자리를 종이 위에서 가리키는 것이다.
     ⛔⛔ 이 토큰 하나만 **인쇄물이다.** 색·투명도·좌표를 바꾸면 인쇄 결과가 달라져
        `verify-print.py` 기준선을 갱신해야 한다. */
  --marker-sign: rgba(255,232,0,.55);

  /* ── Warning (§11 Privacy without Fear) ────────────────────────────
     > Warning color is semantic, not decorative.
     ⚠️ 빨강은 **실제 오류·위험·즉각적인 주의**에만 쓴다. 개인정보 안내처럼
        「중요하지만 위험은 아닌」 문장은 아래 `--notice-*`(갈색 계열)를 쓴다.
        지금 화면에는 이 규칙을 어긴 곳이 남아 있다(허브 빨간 띠, 인쇄 전 안내
        빨간 상자, 아무것도 틀리지 않았는데 뜨는 `.step-warn`). 다음 단계 과제다. */
  --warn:      #a12727;
  --warn-face: #fdecec;
  --warn-line: #f5b5b5;
  --notice:      #7a5600;   /* 중요하지만 위험이 아닌 안내 — 짙은 갈색 */
  --notice-face: #fff8e6;
  --notice-line: #ffe19a;

  /* ── Radius ────────────────────────────────────────────────────────
     여권 한 파일에 반경이 13가지 흩어져 있던 것을 아래 여섯 단계로 모았다
     (2026.08.24). 새 서식은 이 여섯 개 밖의 값을 쓰지 않는다.

     ⛔ **인쇄되는 반경 둘은 토큰을 쓰지 않는다** — 값이 박혀 있어야 한다.
          `.ovhi`     4px  Print Marker(서명 자리)
          `.csign-hl` 3px  위임장·동의서 서명 형광
        토큰으로 바꿔 두면 나중에 아래 값을 만질 때 **인쇄물이 조용히 달라진다.**
     ⚠️ 제목 왼쪽 2px 장식 막대도 뺐다 — 폭이 3px 남짓이라 `--r-xs`(4px)를 주면
        알약이 된다. 스케일에 넣기엔 너무 작다. */
  --r-xs:   4px;
  --r-sm:   8px;
  --r-md:  10px;    /* 가장 많이 쓰이는 값 */
  --r-lg:  12px;
  --r-xl:  18px;
  --r-pill: 999px;

  /* ── Shadow (§1 DON'T 강한 그림자) ─────────────────────────────────*/
  --shadow-lift:  0 4px 20px rgba(0,0,0,.4);
  --shadow-modal: 0 20px 60px rgba(0,0,0,.35);

  /* ── Spacing ───────────────────────────────────────────────────────*/
  --sp-1:  4px;
  --sp-2:  8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 22px;
  --sp-6: 30px;

  /* ── Typography (§16) ──────────────────────────────────────────────
     글꼴은 하나만 쓴다. 관공서 PC 에 반드시 있는 것이어야 하고, 오프라인
     설치본이라 웹폰트를 받을 수 없다. */
  --ff: "Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
  --fs-question: 34px;    /* 시민에게 말하는 큰 질문 */
  --fs-lead:     21px;    /* 입력칸에 치는 글자 */
  --fs-label:    18px;    /* 항목 라벨 */
  --fs-card:     20px;    /* 선택 카드 제목 */
  --fs-card-sub: 15px;    /* 선택 카드 설명 */
  --fs-body:     17px;    /* 본문 기본 */
  --fs-help:     17px;    /* 「왜 묻는지」 */
  --fs-sum:    16.5px;    /* 최종 확인 요약 줄 */
  --fs-small:  13.5px;    /* 행정적 보조 설명 */
  /* Context Rail(§10)은 구조와 폭을 고정하고 **글자만** 크게 보기를 따른다 */
  --fs-rail-num:   33px;  /* 진행 큰 숫자 */
  --fs-rail-head:  15px;  /* 「준비하셨나요?」 같은 머리 */
  --fs-rail-item:13.5px;  /* 목록 항목 */
  --fs-rail-note:12.5px;  /* 안심 안내 본문 */
  --fw-bold:   700;
  --fw-heavy:  800;
  --ls-tight: -.035em;    /* 큰 질문에만 */

  /* ── Touch target — Input-Agnostic, Touch-Friendly ─────────────────
     터치·마우스·물리키보드에서 **모두** 쓸 수 있어야 한다(2026.08.24 결정 §2).
     ⚠️ **크기는 터치 기준을 유지한다.** 큰 표적은 마우스에서도 문제가 없지만
        그 반대는 성립하지 않는다.
     ⛔ hover 는 보조 효과로만 쓴다. **hover 에만 의존하는 정보·기능은 금지.** */
  --touch-card:  132px;   /* 큰 선택 카드 최소 높이 */
  --touch-field:  64px;   /* 글자 입력칸 높이 */
  --touch-min:    48px;   /* 그 밖의 누를 수 있는 것의 최소 변 */
  --btn-h:        62px;   /* [이전]·[다음] 높이 */

  /* ── Layout (§2 LEFT / CENTER / RIGHT) ─────────────────────────────*/
  --topbar-h:      74px;
  --rail-w:       252px;
  --rail-w-narrow:214px;  /* 1600px 이하 */
  --question-max: 640px;  /* 질문 한 줄이 길어지지 않게 */
  --cards-max:    700px;
  /* 세 영역의 가로 배분. **1920×1080 실물을 보고 미세조정**할 수 있게 토큰으로 뺐다.
     ⛔ 비율만 숫자로 빼서 `calc(var(--x)*1fr)` 로 쓰지 마라 — **`fr` 은 `calc()` 안에서
        쓸 수 없다.** 선언 전체가 무효가 되어 3단이 한 줄로 무너진다(2026.08.24 에 실제로
        그렇게 깨졌고 갈무리 용량이 절반으로 줄어 들통났다). 트랙 목록을 통째로 담는다. */
  /* ⚠️ 2026.08.24 — 고정폭 RAIL 을 버리고 **비율**로 바꿨다. 종전 값(1 : 1.08 : 252px)은
     1920 에서 794 : 858 : 252 = 약 3 : 3 : 1 이 되어 **질문면이 너무 넓고 종이가 좁았다.**
     이제 세 칸 전부 `fr` 이라 화면이 커지든 작아지든 비율이 유지된다.
       일반 보기  2 : 3 : 1   → 1920 에서 640 : 960 : 320
       크게 보기  5 : 5 : 2   → 1920 에서 800 : 800 : 320  (아래 html.big)
     RAIL 은 두 경우 모두 화면의 1/6 이라 폭이 변하지 않는다 — 「크게 보기에서 RAIL 은
     구조와 폭을 그대로 두고 글자만 키운다」(동결 §3-3)가 이렇게 지켜진다. */
  --cols:             minmax(0,2fr) minmax(0,3fr) minmax(0,1fr);
  /* 좁은 화면에서도 비율이 같다 — 고정폭이 아니라 `fr` 이므로 저절로 줄어든다.
     이름은 남겨 둔다(각 화면의 미디어 쿼리가 이 이름으로 참조한다). */
  --cols-narrow:      minmax(0,2fr) minmax(0,3fr) minmax(0,1fr);
  --cols-narrow-left: minmax(0,3fr) minmax(0,2fr) minmax(0,1fr);
}

/* ── 크게 보기 (§13) — Responsive Layout Mode ─────────────────────────
   ⛔ **전체 화면 Zoom 이 아니다.** Paper 를 통째로 확대하는 기능도 아니다.
      목적은 질문·입력·조작 UI 의 읽기와 조작 편의이고, CENTER Paper 는
      **바뀐 영역 안에서 가능한 최대 크기**를 유지한다(fit-to-area).
   ⚠️ 그래서 크게 보기를 켜면 **Paper 는 오히려 작아진다**(1920 기준 794→667px).
      **버그가 아니라 받아들인 결과다**(2026.08.24 결정 §6-1). 서식을 크게 보는 길은
      Paper 확대·스크롤과 [미리보기]로 따로 있다. 되돌리려면 그 결정을 먼저 고쳐라.
      비율 조정이 필요하면 **아래 `--cols` 계열만** 만진다 — 그것이 의도된 조정 경로다.
   ⚠️ RIGHT Context Rail 은 **구조와 폭을 그대로 두고 글자만** 키운다.
      자유 Drag/Resize 는 만들지 않는다.
   ⚠️ 아래는 전부 토큰이다 — 실물 화면을 보고 이 값만 만지면 된다. */
html.big{
  --fs-question:  40px;
  --fs-lead:      24px;
  --fs-label:     21px;
  --fs-card:      23px;
  --fs-card-sub:  17px;
  --fs-body:      19px;
  --fs-help:      19px;
  --fs-sum:     18.5px;
  --fs-small:     15px;
  --fs-rail-num:  38px;
  --fs-rail-head: 17px;
  --fs-rail-item:15.5px;
  --fs-rail-note: 14px;
  --touch-card:  150px;
  --touch-field:  72px;
  --touch-min:    56px;
  --btn-h:        72px;
  --question-max:780px;
  --cards-max:   820px;
  /* LEFT 를 넓힌다 — CENTER Paper 는 남은 폭에 스스로 맞춰 줄어든다(fit-to-area).
     RIGHT 는 폭 그대로다(글자만 커진다). */
  --cols:             minmax(0,5fr) minmax(0,5fr) minmax(0,2fr);
  --cols-narrow:      minmax(0,5fr) minmax(0,5fr) minmax(0,2fr);
  --cols-narrow-left: minmax(0,5fr) minmax(0,5fr) minmax(0,2fr);
}

/* ── 공통 UI 규칙 ─────────────────────────────────────────────────────
   9개 화면이 함께 지켜야 하는 것. 값이 아니라 규칙이라 `:root` 밖에 둔다. */

/* §17 Interaction — 움직임은 상태를 설명할 때만. 줄여 달라고 한 사용자에게는 끈다.
   ⚠️ JS 의 `scrollIntoView({behavior:"smooth"})` 는 CSS 로 꺼지지 않는다.
      그쪽은 각 서식이 `matchMedia` 로 따로 본다. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
}

<script>
"use strict";
var FORM_IMG="__BGDATA__";
/* =====================================================================
   FORM 설정 (build-form.js 주입: forms/<이름>.config.js)
   ===================================================================== */
/*{{CONFIG}}*/
/* =====================================================================
   공통 엔진 (build-form.js 주입: engine/engine.js)
   ===================================================================== */
/*{{ENGINE}}*/
</script>
<!-- 키오스크 개인정보 보호: (1) 3분 무동작 시 자동 초기화 (2) 인쇄 직후 화면 초기화 -->
<script>
(function(){
  /* 키오스크 환경설정(Ctrl+Shift+S)에서 정한 값이 있으면 그것을 쓴다.
     `window.__kioskCfg` 는 키오스크의 preload 가 **이 스크립트보다 먼저** 심어 준다.
     웹 배포본에는 없으므로 아래 기본값이 그대로 쓰인다. */
  var KCFG = (typeof window !== "undefined" && window.__kioskCfg) || {};
  var IDLE_MS = (typeof KCFG.idleMs === "number" && KCFG.idleMs > 0)
                  ? KCFG.idleMs : 3*60*1000;    // 무동작 대기 시간(기본 3분)
  var WARN_SEC = 30;          // 초기화 전 경고(마지막 30초 카운트다운)
  var PRINTED_MS = (typeof KCFG.printedMs === "number" && KCFG.printedMs >= 0)
                  ? KCFG.printedMs : 5000;      // 인쇄 후 처음 화면으로(기본 5초, 0=즉시)
  var HOME = "index.html";    // 되돌아갈 처음 화면(허브 메뉴). 이동 시 입력값(메모리) 전부 소멸
  var warnTimer=null, tickTimer=null, remain=0, ov=null, numEl=null, locked=false;

  function build(){
    ov=document.createElement("div");
    ov.id="idleGuard";
    ov.setAttribute("role","alertdialog");
    ov.setAttribute("aria-live","assertive");
    ov.style.cssText="position:fixed;inset:0;z-index:2147483000;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.72);font-family:'Malgun Gothic','맑은 고딕',sans-serif;";
    var box=document.createElement("div");
    box.style.cssText="background:#fff;border-radius:18px;padding:34px 40px;max-width:540px;margin:20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);";
    box.innerHTML='<div style="font-size:26px;font-weight:800;color:var(--blue);margin-bottom:12px;">잠시 후 처음 화면으로 돌아갑니다</div>'+
      '<div style="font-size:19px;color:#333;line-height:1.65;margin-bottom:24px;">개인정보 보호를 위해 <b id="idleNum" style="color:#c0392b;font-size:22px;">30</b>초 후 입력하신 내용이 모두 지워집니다.<br>계속 작성하시려면 화면을 터치하거나 아래 버튼을 누르세요.</div>'+
      '<button type="button" id="idleStay" style="font-size:20px;font-weight:700;color:#fff;background:var(--blue);border:0;border-radius:12px;padding:14px 32px;cursor:pointer;">계속 작성하기</button>';
    ov.appendChild(box);
    document.body.appendChild(ov);
    numEl=box.querySelector("#idleNum");
    box.querySelector("#idleStay").addEventListener("click", function(e){ e.stopPropagation(); reset(); });
  }
  function goHome(){ try{ location.href=HOME; }catch(e){ location.reload(); } }
  function showWarn(){
    if(!ov) build();
    remain=WARN_SEC; if(numEl) numEl.textContent=remain;
    ov.style.display="flex";
    tickTimer=setInterval(function(){
      remain--; if(numEl) numEl.textContent=remain;
      if(remain<=0){ clearInterval(tickTimer); tickTimer=null; goHome(); }
    },1000);
  }
  function clearAll(){ if(warnTimer){clearTimeout(warnTimer);warnTimer=null;} if(tickTimer){clearInterval(tickTimer);tickTimer=null;} }
  function reset(){
    if(locked) return;        // 인쇄 후 초기화 중이면 타이머를 되살리지 않는다
    clearAll();
    if(ov) ov.style.display="none";
    warnTimer=setTimeout(showWarn, Math.max(0, IDLE_MS - WARN_SEC*1000));
  }

  /* 인쇄창이 닫히면 화면에 남은 개인정보를 즉시 가리고 처음 화면으로 되돌린다.
     (뒷사람이 앞사람 신청 내용을 보는 것도 개인정보 유출)
     주의: 브라우저는 '인쇄함'과 '취소함'을 구분해 알려주지 않는다(afterprint 공통) →
           취소해도 초기화된다. 인쇄 직전 안내 팝업에서 미리 알린다. */
  function showPrinted(){
    if(locked) return;
    locked=true; clearAll();
    if(ov) ov.style.display="none";
    var pg=document.createElement("div");
    pg.id="printGuard";
    pg.setAttribute("role","alertdialog");
    pg.setAttribute("aria-live","assertive");
    pg.style.cssText="position:fixed;inset:0;z-index:2147483001;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,1);font-family:'Malgun Gothic','맑은 고딕',sans-serif;";
    pg.innerHTML='<div style="background:#fff;border-radius:18px;padding:34px 40px;max-width:560px;margin:20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);">'+
      '<div style="font-size:26px;font-weight:800;color:var(--blue);margin-bottom:14px;">🖨️ 인쇄를 보냈습니다</div>'+
      '<div style="font-size:20px;font-weight:800;color:#7a5600;line-height:1.6;margin-bottom:14px;">출력물을 꼭 챙겨 가세요.<br>출력물에는 개인정보가 들어 있습니다.</div>'+
      '<div style="font-size:17px;color:#333;line-height:1.6;">개인정보 보호를 위해 <b>화면을 처음으로 되돌립니다.</b><br>인쇄가 제대로 되지 않았으면 창구 직원에게 말씀해 주세요.</div>'+
      '</div>';
    document.body.appendChild(pg);
    setTimeout(goHome, PRINTED_MS);
  }
  window.addEventListener("afterprint", showPrinted);
  /* 인쇄 직전 안내 — 네이티브 alert 은 크기·색을 바꿀 수 없어(하단이 잘림)
     화면 모달로 대체한다. 확인을 누르면 그때 실제 인쇄창이 열린다.
     개인정보 안내를 1번(맨 위)에 둔다 — 민원실 요청.
     화면이 낮으면(t) 여백·글자를 줄여 스크롤 없이 한 화면에 담는다. */
  window.__printNotice = function(whyLine, onOk){
    var old=document.getElementById("printNotice");
    if(old && old.parentNode) old.parentNode.removeChild(old);
    var vh=window.innerHeight||900, t=vh<790;              // t = 낮은 화면(720p 등)
    var PAD   = t?"20px 26px 18px":"30px 34px 26px";
    var TTL   = t?23:29,  TTLM = t?12:20;                  // 제목 크기·아래 여백
    var SEC   = t?18:21,  BOXP = t?"11px 16px":"16px 20px";
    var BASE  = t?18:22,  BIG  = t?20:24, NOTE = t?16:18.5;
    var PRIV  = t?17:19.5, WHYF = t?15:17, GAP = t?14:22;
    var BTN   = t?18:21,  BTNP = t?"12px 28px":"15px 36px";
    var back=document.createElement("div");
    back.id="printNotice";
    back.setAttribute("role","dialog");
    back.setAttribute("aria-modal","true");
    back.style.cssText="position:fixed;inset:0;z-index:2147483002;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.72);font-family:'Malgun Gothic','맑은 고딕',sans-serif;padding:14px;";
    back.innerHTML=
      '<div style="background:#fff;border-radius:20px;max-width:820px;width:100%;max-height:96vh;overflow:auto;padding:'+PAD+';box-shadow:0 24px 70px rgba(0,0,0,.42);text-align:left;">'
      + '<div style="font-size:'+TTL+'px;font-weight:800;color:var(--blue);margin:0 0 '+TTLM+'px;">🖨️ 인쇄하기 전에 확인해 주세요</div>'
      + '<div style="font-size:'+SEC+'px;font-weight:800;color:#123f7f;margin:0 0 8px;">1. 개인정보 안내</div>'
      + '<div style="margin:0 0 '+GAP+'px;padding:'+BOXP+';background:#fff8e6;border:2px solid #ffe19a;border-left:7px solid #7a5600;border-radius:12px;font-size:'+PRIV+'px;line-height:1.6;">'
      +   '<div style="margin-bottom:6px;"><b style="color:#7a5600;">출력물에는 개인정보가 들어 있습니다. 본인이 직접 수령·관리해 주세요.</b></div>'
      +   '<div style="margin-bottom:6px;"><b style="color:#7a5600;">공용 PC입니다. 사용 후에는 창을 닫아 개인정보가 남지 않게 해 주세요.</b></div>'
      +   '<div style="color:#333;">인쇄 창을 닫으면 <b>화면이 처음으로 초기화</b>됩니다. (인쇄를 취소한 경우에도)</div>'
      + '</div>'
      + '<div style="font-size:'+SEC+'px;font-weight:800;color:#123f7f;margin:0 0 8px;">2. 인쇄 창에서 이렇게 맞춰 주세요</div>'
      + '<div style="padding:'+BOXP+';background:#fff8e6;border:2px solid #ffe19a;border-left:7px solid #7a5600;border-radius:12px;font-size:'+BASE+'px;line-height:1.6;">'
      +   '<div>여백(Margins) : <b style="color:#7a5600;font-size:'+BIG+'px;">없음</b></div>'
      +   '<div>배율(Scale) : <b style="color:#7a5600;font-size:'+BIG+'px;">100% (실제 크기)</b></div>'
      +   '<div style="font-size:'+NOTE+'px;font-weight:800;color:#c0392b;margin-top:5px;">※ ‘맞춤(Fit)’ · ‘축소’ 로 하면 안 됩니다</div>'
      + '</div>'
      + '<div style="font-size:'+WHYF+'px;color:#5b626c;margin:7px 0 0;">' + (whyLine||"") + '</div>'
      + '<div style="display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:'+GAP+'px;">'
      +   '<button type="button" id="pnCancel" style="font-family:inherit;font-size:'+(BTN-2)+'px;font-weight:700;color:var(--blue);background:#fff;border:2px solid var(--blue);border-radius:12px;padding:'+BTNP+';cursor:pointer;">취소</button>'
      +   '<button type="button" id="pnOk" style="font-family:inherit;font-size:'+BTN+'px;font-weight:800;color:#fff;background:var(--blue);border:0;border-radius:12px;padding:'+BTNP+';cursor:pointer;">인쇄 창 열기</button>'
      + '</div></div>';
    document.body.appendChild(back);
    function close(){
      if(back && back.parentNode) back.parentNode.removeChild(back);
      document.removeEventListener("keydown", key, true);
    }
    function key(e){
      if(e.key==="Escape"){ e.preventDefault(); close(); }
      else if(e.key==="Enter"){ e.preventDefault(); go(); }
    }
    /* 모달을 먼저 없앤 뒤 인쇄해야 인쇄물에 안내가 섞이지 않는다 */
    function go(){ close(); setTimeout(function(){ if(onOk) onOk(); }, 60); }
    back.querySelector("#pnCancel").addEventListener("click", close);
    back.querySelector("#pnOk").addEventListener("click", go);
    back.querySelector("#pnOk").focus();
    document.addEventListener("keydown", key, true);
  };


  // 사용자 활동 감지 → 타이머 리셋(경고 중이면 취소). 인쇄 대화상자는 별도 처리 불필요.
  ["mousemove","mousedown","keydown","touchstart","wheel"].forEach(function(ev){
    window.addEventListener(ev, reset, {passive:true});
  });
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", reset);
  else reset();
})();
</script>

<script>
(function(){
  var MIN=14;                                  // 이보다 작게는 줄이지 않는다
  // 글자 실제 폭은 Range로 잰다. scrollWidth/clientWidth 비교는 쓸 수 없다 —
  // 로고 자리로 준 padding-right가 clientWidth에 포함되어, 제목이 로고 아래로
  // 파고들어도 '넘치지 않음'으로 나온다.
  function textWidth(t, rng){ rng.selectNodeContents(t); return rng.getBoundingClientRect().width; }
  function fit(){
    var t=document.getElementById("wizTitle"); if(!t || !t.firstChild) return;
    t.style.fontSize="";                       // 원래(CSS) 크기에서 다시 계산
    var cs=getComputedStyle(t);
    var avail=t.clientWidth - parseFloat(cs.paddingLeft||0) - parseFloat(cs.paddingRight||0);
    if(!(avail>0)) return;
    var rng=document.createRange(), s=parseFloat(cs.fontSize)||20, guard=0;
    while(textWidth(t,rng)>avail && s>MIN && guard++<40){
      s-=0.5; t.style.fontSize=s+"px";
    }
    rng.detach && rng.detach();
  }
  function start(){
    var t=document.getElementById("wizTitle"); if(!t) return;
    fit();
    // 글자 크기는 style 속성이라 관찰 대상(childList·characterData)이 아니다 → 무한루프 없음
    new MutationObserver(fit).observe(t,{childList:true,characterData:true,subtree:true});
    window.addEventListener("resize", fit);
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",start);
  else start();
})();
</script>

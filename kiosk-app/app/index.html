<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>군포시 민원 서식 작성 도우미</title>
<meta name="description" content="군포시 민원실 서식 작성 도우미 — 여권·가족관계등록 신고서·증명서 발급. 어르신 친화, 무저장(메모리 전용).">
<!--
  군포시 민원 서식 작성 도우미 — 허브(메뉴) 페이지
  - 단일 HTML · 외부 서버/라이브러리/CDN/폰트/이미지 없음
  - 입력값을 다루지 않는 안내·이동 전용 페이지 (개별 도우미가 메모리 전용으로 처리)
  - 각 서식 도우미로 이동하는 카드 목록
-->
<!--DESIGN-TOKENS v1-->
<style>
/* ══════════════════════════════════════════════════════════════════════
   디자인 토큰 (2026.08.24 신설) — `docs/디자인검토/DESIGN_PHILOSOPHY.md` §21

   「새로운 서식을 만들 때 새로운 디자인을 발명하지 않는다」를 지키려면 값이 한 곳에
   있어야 한다. 종전에는 색·반경·간격·글자 크기가 **다섯 원본에 흩어져 하드코딩**돼
   있었다(engine/base.html · passport · marriage · divorce · index). 한 곳을 고치면
   나머지 넷이 조용히 갈라진다 — 초기화 코드가 아홉 곳에 복제된 것과 같은 뿌리다.

   ⚠️ 이 블록은 **5개 원본에 글자까지 똑같이** 들어간다.
      고칠 때는 `engine/base.html` 을 고치고 →
        `node tools/build-form.js <이름>` 으로 엔진 5종 재빌드
        `python tools/check-design-tokens.py --fix` 로 손작성 3종·허브 반영
      확인은 `python tools/check-design-tokens.py` (다르면 exit 1).

   ⛔ **인쇄물에 나가는 값을 이 블록에 얹지 마라.** 여기 있는 것은 전부 화면 전용이다.
      서식 위 값의 위치·크기·글꼴은 절대좌표라 `verify-print.py` 19쪽 0px 가 지킨다.
      예외는 `--sign-hl` 하나이고, 왜 예외인지 그 자리에 적어 두었다.

   ⚠️ **신설 시점에는 아무도 이 토큰을 쓰지 않는다.** 값이 지금 화면과 똑같도록
      맞춰 두었을 뿐이다(화면 무변경이 이 단계의 합격 조건이었다). 하드코딩을
      토큰으로 바꾸는 일은 영역별로 나누어 진행한다 — 한꺼번에 바꾸면 무엇이
      화면을 바꿨는지 짚을 수 없다.
   ══════════════════════════════════════════════════════════════════════ */
:root{

  /* ── Institution Accent ────────────────────────────────────────────
     기관 대표색. **값을 여기에 적지 않는다** — `--blue` 계열은 SITE-CONFIG 블록이
     `documentElement.style` 로 주입하는 이름이고, 그 네 이름은 계약이다.
     새 CSS 는 아래 별칭을 쓴다. 그래야 나중에 `--blue` 라는 이름을 버리더라도
     화면 쪽 코드를 건드리지 않는다.
     ⛔ `--blue`·`--blue-dark`·`--blue-light`·`--grad` 를 **이름째 바꾸지 마라.**
        SITE-CONFIG·환경설정 창(main.js)이 그 이름으로 값을 넣는다. */
  --accent:        var(--blue);
  --accent-strong: var(--blue-dark);
  --accent-soft:   var(--blue-light);
  /* --grad(135° 그라데이션) — DESIGN_PHILOSOPHY §1 DON'T 는 **큰 면적의 장식적**
     Gradient 를 금하는 것으로 읽는다(2026.08.24 결정 §4). 지금 쓰이는 곳은 상단 바
     아래 3px 띠처럼 좁은 Accent 뿐이라 **당장 걷어내지 않는다.** 단색화 여부는
     최종 Visual Design 단계에서 다시 판단한다. */

  /* ── Surface (§1 Quiet Paper Desk · §2 세 영역) ─────────────────────
     대표색과 **무관한** 따뜻한 무채색. 기관이 대표색을 무엇으로 바꾸든 이 값들은
     그대로여서 색을 갈아 끼워도 화면이 무너지지 않는다.
     세 면의 명도를 조금씩 달리해 **선을 긋지 않고도 영역이 갈리게** 한다. */
  --surface-work: #f7f6f3;   /* LEFT   질문하고 입력하는 곳 */
  --surface-zone: #e4e1db;   /* CENTER 서식이 놓이는 바닥 */
  --surface-rail: #f1f0ec;   /* RIGHT  Context Rail */
  --surface-head: #fbfaf7;   /* 상단 바 */
  --surface-cool: #f2f4f7;   /* 옛 배경색(허브·7종). 세 영역으로 옮기면 사라진다 */

  /* ── Paper (§2 Paper First) ────────────────────────────────────────
     종이 자체는 언제나 흰색이다. 그림자로만 바닥에서 띄운다. */
  --paper:        #fff;
  --paper-shadow: 0 2px 6px rgba(0,0,0,.06), 0 14px 34px rgba(0,0,0,.10);

  /* ── Ink (§16 Typography is the Voice) ─────────────────────────────
     ⚠️ `--ink-muted` 를 더 옅게 하지 마라. §15 「가독성을 해칠 정도로 대비를
        낮추지 않는다」. 여권은 이미 한 번 진하게 올렸다(#5b626c → #495059). */
  --ink:       #1a1c1f;
  --ink-muted: #5b626c;

  /* ── Border ────────────────────────────────────────────────────────*/
  --border:        #d2cfc9;              /* 따뜻한 기본선 */
  --border-strong: #b9b6b0;              /* 입력칸·카드 테두리 */
  --border-cool:   #d5d9df;              /* 옛 회색선(허브·7종) */
  --hair:          rgba(27,95,192,.16);  /* 기하학적 포인트 선 */
  /* ⚠️ `--hair` 는 기본 파랑이 **박혀 있다.** 기관이 대표색을 초록으로 바꿔도
        이 선만 파랑으로 남는다 — 알려진 결함이고, 대표색에서 계산하도록
        SITE-CONFIG 에서 함께 주입하는 것이 옳다. 다음 단계로 미뤄 둔다. */

  /* ── Current Focus (§5 Show Where It Goes) ─────────────────────────
     **지금 작성 중인 Paper 위치.** 화면 전용이고, 기관 대표색에서 파생한 저채도다.
     ⛔ 노랑/Amber 로 바꾸지 마라. 그 색은 아래 **Print Marker** 의 것이고,
        한 색이 「지금 적는 칸」과 「여기 서명하세요」 두 뜻을 갖게 된다.
        (DESIGN_PHILOSOPHY §15 는 Muted Amber 를 제안했으나 이 충돌 때문에
         대표색 파생을 유지하기로 했다 — 2026.08.24 결정 §1.)
     ⚠️ 대표색에서 파생하므로 기관이 색을 바꾸면 Focus 도 따라온다. */
  --focus-face: var(--blue-light);
  --focus-line: var(--blue);

  /* ── Print Marker ──────────────────────────────────────────────────
     **출력 후 시민이 직접 서명·날인·기재할 위치.** Current Focus 와 섞지 마라 —
     이쪽은 사람이 펜을 댈 자리를 종이 위에서 가리키는 것이다.
     ⛔⛔ 이 토큰 하나만 **인쇄물이다.** 색·투명도·좌표를 바꾸면 인쇄 결과가 달라져
        `verify-print.py` 기준선을 갱신해야 한다. */
  --marker-sign: rgba(255,232,0,.55);

  /* ── Warning (§11 Privacy without Fear) ────────────────────────────
     > Warning color is semantic, not decorative.
     ⚠️ 빨강은 **실제 오류·위험·즉각적인 주의**에만 쓴다. 개인정보 안내처럼
        「중요하지만 위험은 아닌」 문장은 아래 `--notice-*`(갈색 계열)를 쓴다.
        지금 화면에는 이 규칙을 어긴 곳이 남아 있다(허브 빨간 띠, 인쇄 전 안내
        빨간 상자, 아무것도 틀리지 않았는데 뜨는 `.step-warn`). 다음 단계 과제다. */
  --warn:      #a12727;
  --warn-face: #fdecec;
  --warn-line: #f5b5b5;
  --notice:      #7a5600;   /* 중요하지만 위험이 아닌 안내 — 짙은 갈색 */
  --notice-face: #fff8e6;
  --notice-line: #ffe19a;

  /* ── Radius ────────────────────────────────────────────────────────
     여권 한 파일에 반경이 13가지 흩어져 있던 것을 아래 여섯 단계로 모았다
     (2026.08.24). 새 서식은 이 여섯 개 밖의 값을 쓰지 않는다.

     ⛔ **인쇄되는 반경 둘은 토큰을 쓰지 않는다** — 값이 박혀 있어야 한다.
          `.ovhi`     4px  Print Marker(서명 자리)
          `.csign-hl` 3px  위임장·동의서 서명 형광
        토큰으로 바꿔 두면 나중에 아래 값을 만질 때 **인쇄물이 조용히 달라진다.**
     ⚠️ 제목 왼쪽 2px 장식 막대도 뺐다 — 폭이 3px 남짓이라 `--r-xs`(4px)를 주면
        알약이 된다. 스케일에 넣기엔 너무 작다. */
  --r-xs:   4px;
  --r-sm:   8px;
  --r-md:  10px;    /* 가장 많이 쓰이는 값 */
  --r-lg:  12px;
  --r-xl:  18px;
  --r-pill: 999px;

  /* ── Shadow (§1 DON'T 강한 그림자) ─────────────────────────────────*/
  --shadow-lift:  0 4px 20px rgba(0,0,0,.4);
  --shadow-modal: 0 20px 60px rgba(0,0,0,.35);

  /* ── Spacing ───────────────────────────────────────────────────────*/
  --sp-1:  4px;
  --sp-2:  8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 22px;
  --sp-6: 30px;

  /* ── Motion (§17 Interaction) ──────────────────────────────────────
     「움직임은 상태를 설명할 때만」을 지키려면 값이 한 곳에 있어야 한다.
     종전에는 5원본 8곳에 박혀 있었고 종류가 벌써 다섯이었다(.12·.15·.2·.22·.34s).
     easing 은 대부분 **방치**돼 브라우저 기본값(ease)으로 굴러갔다 — Radius 13가지와 같은 뿌리다.

     ✅ **값이 정해졌다(2026.08.27, 외부 검토 과제 A).** 세 박자로 통합했다 —
        120 / 200 / 320. 종전(120·220·340)과 20ms 씩만 다르다. 지금 화면이 크게 틀리지
        않았다는 뜻이고, **바뀐 것은 주로 easing** 이다. 셋이 제각각이던 곡선을
        **한 가족**(빠르게 나와 길게 멎는 out · 가속하며 물러나는 in · 양끝이 완만한 move)
        으로 맞췄다.
     ⚠️ 세 박자 이상으로 늘리지 마라. 늘어나는 순간 다시 흩어진다.

     ⛔ 인쇄물에는 모션이 없다. 이 값들은 전부 화면 전용이다.
     ⚠️ 아래 `@media (prefers-reduced-motion: reduce)` 가 이것들을 통째로 끈다.
        ⛔ 다만 **JS 로 도는 것(허브 시연)은 CSS 로 안 꺼진다** — `matchMedia` 로 따로 본다. */
  --dur-quick: 120ms;   /* 눌린 표시·hover — 손을 뗄 무렵 반응이 보여야 한다 */
  --dur-base:  200ms;   /* 펼침·접힘·나타남 — 시민이 직접 일으킨 상태 변화 */
  --dur-calm:  320ms;   /* 종이 갈아끼우기·큰 비율 변화 — 위치가 어디로 갔는지 따라갈 시간 */
  --ease-out:  cubic-bezier(.2,0,0,1);        /* 들어오는 것 — 빨리 보이기 시작해 길게 멎는다 */
  --ease-in:   cubic-bezier(.4,0,1,1);        /* 나가는 것 — 다음 내용을 가리지 않고 물러난다 */
  --ease-move: cubic-bezier(.4,0,.2,1);       /* 자리를 옮기는 것 — 양끝이 완만하다 */

  /* ── Typography (§16) ──────────────────────────────────────────────
     글꼴은 하나만 쓴다. 관공서 PC 에 반드시 있는 것이어야 하고, 오프라인
     설치본이라 웹폰트를 받을 수 없다. */
  --ff: "Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
  --fs-question: 34px;    /* 시민에게 말하는 큰 질문 */
  --fs-lead:     21px;    /* 입력칸에 치는 글자 */
  --fs-label:    18px;    /* 항목 라벨 */
  --fs-card:     20px;    /* 선택 카드 제목 */
  --fs-card-sub: 15px;    /* 선택 카드 설명 */
  --fs-body:     17px;    /* 본문 기본 */
  --fs-help:     17px;    /* 「왜 묻는지」 */
  --fs-sum:    16.5px;    /* 최종 확인 요약 줄 */
  --fs-small:  13.5px;    /* 행정적 보조 설명 */
  /* Context Rail(§10)은 구조와 폭을 고정하고 **글자만** 크게 보기를 따른다 */
  --fs-rail-num:   33px;  /* 진행 큰 숫자 */
  --fs-rail-head:  15px;  /* 「준비하셨나요?」 같은 머리 */
  --fs-rail-item:13.5px;  /* 목록 항목 */
  --fs-rail-note:12.5px;  /* 안심 안내 본문 */
  --fw-bold:   700;
  --fw-heavy:  800;
  --ls-tight: -.035em;    /* 큰 질문에만 */

  /* ── Touch target — Input-Agnostic, Touch-Friendly ─────────────────
     터치·마우스·물리키보드에서 **모두** 쓸 수 있어야 한다(2026.08.24 결정 §2).
     ⚠️ **크기는 터치 기준을 유지한다.** 큰 표적은 마우스에서도 문제가 없지만
        그 반대는 성립하지 않는다.
     ⛔ hover 는 보조 효과로만 쓴다. **hover 에만 의존하는 정보·기능은 금지.** */
  --touch-card:  132px;   /* 큰 선택 카드 최소 높이 */
  --touch-field:  64px;   /* 글자 입력칸 높이 */
  --touch-min:    48px;   /* 그 밖의 누를 수 있는 것의 최소 변 */
  --btn-h:        62px;   /* [이전]·[다음] 높이 */

  /* ── Layout (§2 LEFT / CENTER / RIGHT) ─────────────────────────────*/
  --topbar-h:      74px;
  --rail-w:       252px;
  --rail-w-narrow:214px;  /* 1600px 이하 */
  --question-max: 640px;  /* 질문 한 줄이 길어지지 않게 */
  --cards-max:    700px;
  /* 세 영역의 가로 배분. **1920×1080 실물을 보고 미세조정**할 수 있게 토큰으로 뺐다.
     ⛔ 비율만 숫자로 빼서 `calc(var(--x)*1fr)` 로 쓰지 마라 — **`fr` 은 `calc()` 안에서
        쓸 수 없다.** 선언 전체가 무효가 되어 3단이 한 줄로 무너진다(2026.08.24 에 실제로
        그렇게 깨졌고 갈무리 용량이 절반으로 줄어 들통났다). 트랙 목록을 통째로 담는다. */
  /* ⚠️ 2026.08.24 — 고정폭 RAIL 을 버리고 **비율**로 바꿨다. 종전 값(1 : 1.08 : 252px)은
     1920 에서 794 : 858 : 252 = 약 3 : 3 : 1 이 되어 **질문면이 너무 넓고 종이가 좁았다.**
     이제 세 칸 전부 `fr` 이라 화면이 커지든 작아지든 비율이 유지된다.
       일반 보기  2 : 3 : 1   → 1920 에서 640 : 960 : 320
       크게 보기  5 : 5 : 2   → 1920 에서 800 : 800 : 320  (아래 html.big)
     RAIL 은 두 경우 모두 화면의 1/6 이라 폭이 변하지 않는다 — 「크게 보기에서 RAIL 은
     구조와 폭을 그대로 두고 글자만 키운다」(동결 §3-3)가 이렇게 지켜진다. */
  --cols:             minmax(0,2fr) minmax(0,3fr) minmax(0,1fr);
  /* 좁은 화면에서도 비율이 같다 — 고정폭이 아니라 `fr` 이므로 저절로 줄어든다.
     이름은 남겨 둔다(각 화면의 미디어 쿼리가 이 이름으로 참조한다). */
  --cols-narrow:      minmax(0,2fr) minmax(0,3fr) minmax(0,1fr);
  --cols-narrow-left: minmax(0,3fr) minmax(0,2fr) minmax(0,1fr);
}

/* ── 크게 보기 (§13) — Responsive Layout Mode ─────────────────────────
   ⛔ **전체 화면 Zoom 이 아니다.** Paper 를 통째로 확대하는 기능도 아니다.
      목적은 질문·입력·조작 UI 의 읽기와 조작 편의이고, CENTER Paper 는
      **바뀐 영역 안에서 가능한 최대 크기**를 유지한다(fit-to-area).
   ⚠️ 그래서 크게 보기를 켜면 **Paper 는 오히려 작아진다**(1920 기준 794→667px).
      **버그가 아니라 받아들인 결과다**(2026.08.24 결정 §6-1). 서식을 크게 보는 길은

  /* 빈 자리 — 여기가 늘어나고 줄어든다. ⛔ 무엇으로도 채우지 않는다 */
  .bar-space{flex:1 1 auto;min-width:8px;}
  .brand{display:flex;align-items:center;gap:11px;min-width:0;}
  .brand-tx{display:flex;align-items:center;gap:11px;min-width:0;}
  .brand b{font-size:var(--m-fs-brand);font-weight:var(--fw-heavy);color:var(--blue);
    letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* 기관 표기와 제품 이름 사이의 얇은 칸막이 — Figma 의 정보 밀도 */
  .brand-div{width:1px;height:15px;background:var(--m-border);flex:0 0 auto;}
  .brand h1{margin:0;font-size:var(--m-fs-brand-sub);font-weight:500;color:var(--m-ink-sub);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* ⚠️ 로고 높이는 **공통 `GUNPO-LOGO` 블록(38px)** 이 정한다 — 그 블록이 뒤에 와서
     여기서 값을 적어도 늘 졌다(2026.08.28 실측으로 확인). 죽은 규칙을 지웠다. */
  .actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    justify-content:flex-end;padding:8px 0;}
  /* ⚠️ 날짜만 둔다. **시계는 넣지 않는다** — 이 PC 는 날짜가 설치일로 원복되는
     이력이 있어, 디자인을 이유로 틀린 시각을 띄우면 안 된다(2026.08.28 결정). */
  .today{font-size:var(--m-fs-meta);color:var(--m-ink-faint);white-space:nowrap;
    font-feature-settings:"tnum";}
  .btn{display:inline-flex;align-items:center;gap:7px;
    font-family:inherit;font-size:var(--m-fs-btn);font-weight:var(--fw-bold);
    border:1px solid var(--m-border);background:var(--m-surface);color:var(--m-ink-sub);
    border-radius:var(--m-r-btn);padding:8px 13px;cursor:pointer;
    transition:border-color var(--dur-quick) var(--ease-out),
               background var(--dur-quick) var(--ease-out);}
  .btn:hover{background:var(--m-bg);border-color:var(--m-border-mid);}
  .btn .btn-ic{color:var(--m-ink-faint);}

  /* ── 세 영역 골격 ────────────────────────────────────────────────────*/
  .layout{display:grid;grid-template-columns:var(--m-cols);}
  @media screen and (min-width:861px){
    body{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
    .topbar{flex:0 0 auto;position:relative;}
    .layout{flex:1 1 auto;min-height:0;}
    .task-col,.ready-col,.rail-col{height:100%;min-height:0;}
  }
  .task-col{display:flex;flex-direction:column;min-width:0;overflow:hidden;
    background:var(--m-surface);border-right:1px solid var(--m-border);}
  /* ⚠️ `position:relative` 는 **Idle 소개 덮개의 기준점**일 뿐이다(2026.08.30).
     보이는 것은 하나도 바뀌지 않는다 — 덮개는 `html.demo` 에서만 나타난다. */
  .ready-col{min-width:0;overflow-y:auto;background:var(--m-bg);position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 32px;}
  .rail-col{min-width:0;overflow-y:auto;background:var(--m-surface);
    border-left:1px solid var(--m-border);display:flex;flex-direction:column;}

  /* ── LEFT ────────────────────────────────────────────────────────────*/
  .ask-head{padding:26px 22px 12px;flex:0 0 auto;}
  .ask-q{margin:0;font-size:var(--m-fs-ask);font-weight:var(--fw-heavy);
    color:var(--m-ink);line-height:1.3;letter-spacing:-.03em;}
  .ask-sub{margin:6px 0 0;font-size:var(--m-fs-ask-sub);color:var(--m-ink-read);line-height:1.5;}
  /* 목록만 구르는 칸. ⚠️ `min-height:0` 이 없으면 flex 자식이 안 줄어들어 기둥을 넘친다. */
  .ask-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 14px 8px;}
  /* 기둥 바닥 — 직원 단추 자리. **목록이 길어져도 여기 남는다.**
     ⚠️ 목록이 구를 때만 위에 실선을 그어 「위에 더 있다」를 알린다(JS 가 `.scrolls` 를 붙인다).
        서식이 몇 종이든 화면이 같아 보이도록, 구르지 않을 때는 선이 보이지 않는다. */
  .ask-foot{flex:0 0 auto;padding:10px 14px 16px;
    border-top:1px solid transparent;
    transition:border-color var(--dur-base) var(--ease-out);}
  .task-col.scrolls .ask-foot{border-top-color:var(--m-border);}
  /* 목록 카드 — **큰 글씨 = 시민이 하려는 일 / 작은 글씨 = 행정명칭**(철학 §3) */
  /* ⚠️ `position:relative` 는 **Idle 이동 블록의 기준점**일 뿐이다(2026.08.30).
     보이는 것은 하나도 바뀌지 않는다 — 그 블록은 `html.demo` 에서만 나타난다. */
  .cards{display:flex;flex-direction:column;gap:5px;margin:0 0 6px;position:relative;}
  .card{display:flex;align-items:center;gap:13px;width:100%;
    min-height:var(--row-h);padding:11px 13px;
    background:#fafafa;border:1.5px solid var(--m-border);border-radius:var(--m-r-row);
    text-align:left;cursor:pointer;font-family:inherit;color:inherit;
    transition:border-color var(--dur-quick) var(--ease-out),
               background var(--dur-quick) var(--ease-out);}
  /* hover·포커스는 **이 카드 자신만** 바꾼다(Figma 동결 §5) */
  .card:hover,.card:focus-visible{background:#f8f9fb;border-color:var(--m-border-mid);}
  /* 고른 카드 — 색이 여기서만 「골라짐」이라는 뜻을 갖는다 */
  .card[aria-pressed="true"]{border-color:var(--m-a35);background:var(--m-a06);}
  .card-ic{flex:0 0 auto;width:40px;height:40px;border-radius:var(--m-r-row);
    background:var(--m-icon-bg);display:flex;align-items:center;justify-content:center;
    color:var(--m-ink-muted);
    transition:background var(--dur-quick) var(--ease-out),
               color var(--dur-quick) var(--ease-out);}
  .card-ic svg{display:block;width:22px;height:22px;}
  .card[aria-pressed="true"] .card-ic{background:var(--m-a10);color:var(--blue);}
  .card-tx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 auto;}
  /* 시민의 말 — **미선택도 진하다**(17px→19px · #374151→#111827, 2026.08.28).
     ⚠️ 목록은 8개 중 7개가 늘 미선택이다. 그 일곱이 읽기 어려우면 목록이 아니다. */
  .card-label{font-size:var(--m-fs-menu);font-weight:600;
    color:var(--m-ink);line-height:1.3;letter-spacing:-.015em;
    transition:color var(--dur-quick) var(--ease-out);}
  .card[aria-pressed="true"] .card-label{font-weight:var(--fw-heavy);color:var(--blue);}
  /* 행정명칭 — 창구와 말이 통하게 하는 줄이다. 13px→14px · #9ca3af→#4b5563 */
  /* ⚠️ 크게 보기에서 **잘리지 않게** 한다 — 창구와 말이 통해야 하는 줄이다.
     ⛔ ellipsis 로 삼키지 않는다. 길면 두 줄로 흐른다. */
  .card-formal{font-size:var(--m-fs-menu-sub);color:var(--m-ink-read);
    line-height:1.4;overflow-wrap:break-word;}
  /* ⛔ 고른 카드에서 이 줄의 색을 **연하게 하지 않는다**(종전 `--m-a55` 는 대표색 55%
     투명이라 대비가 떨어졌다). 선택은 배경·테두리·아이콘·민원명이 이미 말한다. */
  .card-arrow{flex:0 0 auto;width:13px;height:13px;color:var(--m-ink-faint);}
  .card[aria-pressed="true"] .card-arrow{color:var(--blue);}

  /* Human Handoff (철학 §8) — 여기 없으면 시민이 갇힌다.
     ⚠️ Figma 시안에는 이 단추가 없다. **빠뜨리지 않고 그대로 지켰다.** */
  .btn-ic{flex:0 0 auto;width:16px;height:16px;display:block;}
  .card-sub{display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;margin:0;padding:13px;
    font-family:inherit;font-size:var(--m-fs-handoff);font-weight:var(--fw-bold);
    color:var(--m-ink-sub);background:var(--m-bg);
    border:1.5px dashed var(--m-border-mid);border-radius:var(--m-r-row);cursor:pointer;}
  .card-sub:hover{border-color:var(--blue);color:var(--blue);background:var(--m-surface);}
  .staff-note{margin:10px 0 0;padding:12px 14px;font-size:var(--m-fs-note);line-height:1.6;
    color:var(--notice);background:var(--notice-face);
    border:1px solid var(--notice-line);border-radius:var(--m-r-card);}
  .staff-note:empty{display:none;}

  /* ── CENTER — 준비물 + 작성할 신청서 + [작성 시작하기] ────────────────
     ⚠️ Figma 의 CENTER 는 준비물 3장뿐이었다. 신청서 카드는 **같은 조형 언어 안에서**
        보탰다(이식 지시서 2단계). 담당 창구는 설정값이 없어 이번 단계에 넣지 않았다. */
  .ready{width:100%;max-width:var(--m-center-max);margin:0 auto;
    display:flex;flex-direction:column;align-items:center;}
  .ready-head{text-align:center;margin-bottom:40px;}
  .form-badge{display:inline-flex;align-items:center;gap:7px;margin-bottom:13px;
    padding:5px 12px;border-radius:var(--m-r-chip);
    font-size:var(--m-fs-badge);font-weight:600;color:var(--blue);
    background:var(--m-a07);border:1px solid var(--m-a18);}
  .ready-title{margin:0 0 9px;font-size:var(--m-fs-title);font-weight:var(--fw-heavy);
    color:var(--m-ink);letter-spacing:-.03em;line-height:1.25;}
  .ready-lead{margin:0;font-size:var(--m-fs-lead);color:var(--m-ink-read);line-height:1.5;
    letter-spacing:-.01em;}
  /* 준비물 — ⚠️ **검증된 것만.** 카탈로그 `ready` 가 비면 이 격자를 아예 내지 않는다
     (지금은 여권만 채워져 있다). ⛔ 없는 준비물을 지어내지 마라. */
  .ready-grid{display:grid;grid-template-columns:repeat(var(--m-grid-n,3),minmax(0,1fr));
    gap:16px;width:100%;margin-bottom:22px;}
  .rc{display:flex;flex-direction:column;align-items:center;
    padding:24px 16px 20px;background:var(--m-surface);
    border:1px solid var(--m-border);border-radius:var(--m-r-card);position:relative;}
  /* ⚠️ 그래픽은 크게 보기에서도 **커지지 않는다**(결정 ② · Figma 동결 §8). */
  .rc-gfx{display:flex;align-items:center;justify-content:center;
    height:108px;margin-bottom:18px;}
  .rc-gfx svg{display:block;max-width:100%;height:auto;}
  .rc-sep{width:100%;height:1px;background:var(--m-border);margin-bottom:14px;}
  /* ⚠️ 한국어 조판 — 어절 중간에서 끊지 않는다(Product UI v1 규칙, `PRODUCT_SKIN_v1.md`).
     준비물 이름이 짧을 때는 드러나지 않았는데, 이혼의 「협의이혼의사확인서 등본」에서
     「등/본」이 갈렸다. ⛔ `<br>` 로 막지 마라 — 규칙 한 줄로 막는다. */
  .rc-name{font-size:var(--m-fs-item);font-weight:var(--fw-bold);color:var(--m-ink);
    letter-spacing:-.02em;line-height:1.3;text-align:center;margin-bottom:5px;
    word-break:keep-all;overflow-wrap:anywhere;}
  /* 준비물의 실제 조건(사진 규격·결제 방법 …). 읽어야 하는 줄이다 — #9ca3af→#4b5563 */
  .rc-sub{font-size:var(--m-fs-item-sub);color:var(--m-ink-read);line-height:1.5;
    text-align:center;word-break:keep-all;overflow-wrap:anywhere;}
  /* 「가지고 계시면」 같은 **선택** 준비물. 종전 목록의 `·` 표시를 눈에 보이게 옮겼다 */
  .rc-opt{position:absolute;top:10px;right:10px;padding:2px 7px;border-radius:var(--m-r-chip);
    font-size:var(--m-fs-chip);font-weight:600;
    color:var(--m-ink-muted);background:var(--m-bg);border:1px solid var(--m-border);}

  /* 작성할 신청서 — 나중에 **실제 PAPER 로 이어질 자리**(shared-element 원점).
     ⚠️ 모션은 이번 단계에서 붙이지 않는다. DOM 만 유지한다. */
  .ready-form{display:flex;align-items:center;gap:20px;width:100%;
    padding:18px 22px;background:var(--m-surface);
    border:1px solid var(--m-border);border-radius:var(--m-r-card);margin-bottom:30px;}
  .rf-gfx{flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
  .rf-gfx svg{display:block;width:52px;height:auto;}
  .rf-tx{min-width:0;flex:1 1 auto;}
  .rf-kicker{font-size:var(--m-fs-form-sub);color:var(--m-ink-muted);letter-spacing:-.005em;}
  .rf-name{margin-top:3px;font-size:var(--m-fs-form);font-weight:var(--fw-bold);
    color:var(--m-ink);letter-spacing:-.02em;}
  .rf-scale{margin-top:4px;font-size:var(--m-fs-form-sub);color:var(--m-ink-read);line-height:1.5;}
  .rf-scale:empty{display:none;}

  .ready-go{display:inline-flex;align-items:center;gap:10px;
    min-height:var(--touch-min);padding:16px 36px;
    font-family:inherit;font-size:var(--m-fs-cta);font-weight:var(--fw-heavy);
    color:#fff;background:var(--blue);border:0;border-radius:var(--m-r-btn);
    letter-spacing:-.01em;cursor:pointer;
    transition:background var(--dur-quick) var(--ease-out);}
  .ready-go:hover{background:var(--blue-dark);}
  .ready-note{margin:14px 0 0;font-size:var(--m-fs-note);color:var(--m-ink-muted);
    text-align:center;letter-spacing:-.005em;}

  /* 가운데가 바뀔 때 — **짧은 페이드 하나뿐**(2026.08.28).
     시민이 눌렀을 때도, 시연이 한 걸음 옮겨 갈 때도 같은 경로(`renderReady`)라
     같은 전환이 걸린다 — 시연과 실사용이 다르게 보일 여지를 만들지 않는다.
     ⛔ 움직이지 않는다(자리 이동·확대·bounce 없음). 8초마다 무엇이 스르르 움직이면
        민원실 화면이 아니라 매장 광고판이 된다.
     ⚠️ `#ready` 자신이 아니라 **자식들**에 건다. 내용이 갈릴 때 자식은 새로 만들어지므로
        애니메이션이 다시 돈다 — 같은 요소에 걸면 두 번째부터 돌지 않는다.
     ⚠️ `prefers-reduced-motion` 에서는 공통 토큰 블록이 이것을 통째로 끈다. */
  @keyframes m-ready-in{ from{opacity:0} to{opacity:1} }
  #ready > *{ animation:m-ready-in var(--dur-base) var(--ease-out); }

  /* ── RIGHT — 조용한 공통 안내 ────────────────────────────────────────
     ⛔ 콘텐츠를 채우기 위해 넓히지 않는다(Figma 동결 §4). 여백은 의도다(결정 ⑤). */
  .rail{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;}
  .rail-sec{padding:22px 20px 4px;}
  .rail-head{display:flex;align-items:center;gap:8px;margin-bottom:13px;
    font-size:var(--m-fs-rail-head);font-weight:var(--fw-heavy);color:var(--m-ink-sub);
    letter-spacing:-.01em;}
  .rail-head svg{flex:0 0 auto;width:16px;height:16px;color:var(--m-ink-muted);}
  .rail-item{display:flex;gap:11px;align-items:flex-start;padding:10px 0;
    border-bottom:1px solid var(--m-hairline);}
  .rail-item:last-child{border-bottom:0;}
  .rail-ic{flex:0 0 auto;width:30px;height:30px;border-radius:var(--m-r-card);
    background:var(--m-icon-bg);display:flex;align-items:center;justify-content:center;
    color:var(--m-ink-muted);}
  .rail-ic svg{display:block;width:16px;height:16px;}
  .rail-item b{display:block;font-size:var(--m-fs-rail-title);font-weight:var(--fw-bold);
    color:var(--m-ink);letter-spacing:-.01em;line-height:1.4;}
  .rail-item small{display:block;margin-top:2px;font-size:var(--m-fs-rail-sub);
    color:var(--m-ink-read);line-height:1.5;}
  /* 묶음 사이의 띠 — Figma 의 6px 홈 */
  .rail-gap{height:6px;background:var(--m-bg);
    border-top:1px solid var(--m-border);border-bottom:1px solid var(--m-border);
    margin:8px 0;flex:0 0 auto;}
  /* 「안심하고 작성하세요」 네 문장 — 개인정보 안내다. **읽히지 않으면 없는 것과 같다.** */
  .rail-note{margin:6px 0 0;font-size:var(--m-fs-rail-sub);line-height:1.6;
    color:var(--m-ink-read);}
  .rail-list{margin:0;padding:0;list-style:none;}
  .rail-list li{display:flex;gap:8px;align-items:flex-start;padding:7px 0;
    font-size:var(--m-fs-rail-sub);line-height:1.55;color:var(--m-ink-sub);
    border-bottom:1px solid var(--m-hairline);}
  .rail-list li:last-child{border-bottom:0;}
  .rail-list i{flex:0 0 auto;font-style:normal;font-weight:var(--fw-heavy);color:var(--blue);}
  .rail-foot{margin-top:auto;padding:13px 20px;border-top:1px solid var(--m-border);
    display:flex;justify-content:space-between;align-items:center;
    font-size:var(--m-fs-meta);color:var(--m-ink-faint);}

  /* ── 크게 보기의 여백 — **글자가 커진 만큼만 조인다** ────────────────────
     ⛔ 카드·그래픽·열 폭은 그대로다. 여기서 줄이는 것은 **빈 곳**뿐이다.
     ⚠️ 1080 화면에서 RIGHT 세 묶음이 7px 넘쳤다(2026.08.28 실측). 안내문은 줄일 수
        없으므로 묶음 사이와 항목 사이의 숨을 조금 줄였다 — 스크롤이 생기면
        아래 문장은 **없는 것과 같아진다**(키오스크에서 옆 기둥을 굴리는 사람은 드물다). */
  html.big .rail-sec{padding:17px 20px 4px;}
  html.big .rail-item{padding:8px 0;}
  html.big .rail-gap{margin:6px 0;}
  html.big .rail-foot{padding:11px 20px;}
  /* CENTER — 제목과 카드 사이의 큰 숨만 줄인다(카드 자체는 그대로) */
  html.big .ready-head{margin-bottom:34px;}
  html.big .ready-form{margin-bottom:26px;}

  :focus-visible{outline:3px solid var(--blue);outline-offset:2px;}

  /* 세로 화면(1080×1920 키오스크) — 안내 띠 위 / 목록 / CENTER 아래.
     ⚠️ 이번 단계의 검증 대상은 1920×1080 이다. 여기서는 **깨지지 않게만** 쌓는다 —
        세로 전용 배치는 다음 단계 과제다(핸드오프 §12 「미착수」). */
  @media screen and (max-width:860px), screen and (max-aspect-ratio:9/10){

  /* ══ Idle Motion v2 — 아무도 쓰지 않을 때 도는 자동 시연 (2026.08.30) ════════
     「대기화면은 광고판이 아니라 사용해도 된다는 신호다」(철학 §22)

     ⛔ 이 블록의 규칙은 **전부 `html.demo` 안에서만** 산다. 사람이 화면을 만지는 순간
        `stopDemo()` 가 그 class 를 떼므로 **실제 작성 화면은 종전 그대로 조용하다.**
        모션 강도의 상한선이 여기다 — 작성 화면은 이것의 절반 이하로 둔다.

        불투명한 `#fafafa` 라 **블록이 중간에 사라졌다 나타난다.**
        6% 투명이라 지나가는 카드의 글자는 그대로 읽힌다.
     ⚠️ 고른 카드는 제 배경·테두리를 **블록에 넘긴다**(투명). 그래야 두 겹으로 짙어지지
        않는다 — 결과 색은 종전 「고른 카드」와 같다(흰 바탕 + `--m-a06` + `--m-a35` 테두리).
     ⛔ 고르지 않은 카드는 **손대지 않는다.** Idle 이 돌아도 목록 자체는 그대로다. */

                                color 240ms var(--ease-move),

     ⛔ `pointer-events:none` — 카드 누름을 가로채면 안 된다. */
  .card-selector{display:none;}
  html.demo .card-selector{position:absolute;left:0;right:0;top:0;
    height:var(--sel-h,0px);transform:translateY(var(--sel-y,0px));

        ② 컨테이너가 **위로** 올라왔다. 왼쪽 선택 블록은 **아래로** 내려가는데 가운데가
           위로 오면 두 움직임이 서로 싸운다 → 컨테이너는 **세로로 움직이지 않는다.**
           세로 움직임은 아래 ④ 의 항목별 stagger(9px)가 맡는다.
     ⛔ **진짜 두 겹으로 겹치게 하지 마라.** 민원마다 준비물이 2~4장이라 가운데 덩어리의
        **높이가 다르고**, 가운데 정렬이라 두 겹의 제목·카드·단추가 **서로 어긋난 채 겹쳐**

        읽을 시간을 준다(4.5초 중 3.8초가 정지 상태다). */
  /* ⛔ `#ready` 를 반드시 쓴다. 위쪽에 `#ready > *{animation:m-ready-in …}` 이 이미 있고
        **ID 선택자라 class 만으로는 이기지 못한다** — 2026.08.30 에 실제로 졌다

  /* ⚠️ 지연을 `--rise-delay` 로 넘긴다. 아래 CTA 규칙이 `animation` 을 통째로 다시
     적어야 하는데, 그때도 **제 차례의 지연**을 그대로 쓰게 하려는 것이다.
     ⚠️ 준비물이 없는 서식(증명서·부동산)은 자식이 넷이라 [작성 시작하기]가 세 번째다 —

  html.demo #ready.pv-enter > *{--rise-delay:40ms;

  html.demo #ready.pv-enter > *:nth-child(2){--rise-delay:120ms;}
  html.demo #ready.pv-enter > *:nth-child(3){--rise-delay:200ms;}
  html.demo #ready.pv-enter > *:nth-child(4){--rise-delay:280ms;}
  html.demo #ready.pv-enter > *:nth-child(5){--rise-delay:340ms;}
  @keyframes idleRise{ from{opacity:0;transform:translateY(9px);} to{opacity:1;transform:translateY(0);} }

  /* ⑤ [작성 시작하기]는 내용이 다 나온 뒤 **한 번만** 짧게 밝힌다(620~1220ms).
        「이 화면은 직접 쓰셔도 됩니다」라는 신호다. ⛔ 계속 뛰지 않는다.
     ⚠️ 이 줄에 위의 `idleRise` 도 함께 적는다 — 뒤에 오는 규칙이 그것을 덮기 때문이다.
     ⚠️ 색을 박아 넣지 않는다. 기관 대표색이 바뀌면 이 강조도 따라 바뀌어야 한다

  html.demo #ready.pv-enter .ready-go{

              idleCta 600ms var(--ease-out) 620ms both;}
  @keyframes idleCta{
    0%{box-shadow:0 0 0 0 var(--m-a18);transform:scale(1);}

    100%{box-shadow:0 0 0 0 transparent;transform:scale(1);}
  }

     ⛔ 별도 대기화면이 아니다. CENTER 위에만 잠깐 덮이고 LEFT·RIGHT 는 그대로 보인다.

  html.demo .idle-intro.show{display:flex;position:absolute;inset:0;z-index:5;
    align-items:center;justify-content:center;padding:40px 32px;
    background:var(--m-bg);pointer-events:none;

<script>
/* ── 기관별 설정 적용 (2026.08.19 확산 대응) ─────────────────────────────
   같은 배포본을 다른 기관이 그대로 쓰게 하려고, 기관 고유값(표기·로고·대표색·
   취급 서식·업무 정책)을 키오스크 환경설정 창(Ctrl+Shift+S)에서 받는다.
   preload 가 `window.__kioskCfg` 를 **이 스크립트보다 먼저** 심어 준다.
   웹(GitHub Pages) 배포본에는 preload 가 없어 설정도 없다 — 그때는 아래가
   아무것도 하지 않고 서식에 적힌 기본값이 그대로 쓰인다.

   ⛔ **인쇄물은 건드리지 않는다.** 여기서 바꾸는 것은 `.topbar`(인쇄 CSS 가 숨긴다)와
      화면 전용 색 변수·로고뿐이다. 인쇄에 나가는 값을 이 통로에 얹지 마라 —
      그 순간 `verify-print.py` 19쪽 0px 안전망이 무너진다.
   ⚠️ 이 블록은 **8종 + 허브에 똑같이** 들어간다. 고칠 때는 `engine/base.html` 을 고쳐
      5종을 재빌드하고, 손작성 3종(passport·marriage·divorce)과 `index.html` 에 같은
      내용을 손수 반영한다(AGENTS.md §1). `sync-kiosk.sh --check` 는 루트↔키오스크
      드리프트만 본다 — **이 블록끼리의 드리프트는 잡아 주지 못한다.**
   ==================================================================== */
(function(){
  "use strict";
  var C=(typeof window!=="undefined" && window.__kioskCfg) || {};

  /* 서식 스크립트가 쓰는 창구. 기본값은 **서식이 갖고 있고** 설정은 덮어쓰기만 한다
     (기본값을 설정 쪽에도 적으면 두 벌이 되어 갈라진다). */
  window.__site={
    cfg:C,
    org:function(def){ var o={},k; for(k in def) o[k]=def[k];
      if(C.org) for(k in C.org) if(C.org[k]) o[k]=C.org[k];
      return o; },
    policy:function(def){ var o={},k; for(k in def) o[k]=def[k];
      if(C.policy) for(k in C.policy) if(typeof C.policy[k]==="boolean") o[k]=C.policy[k];
      return o; },
    formOn:function(key){ return !(C.forms && C.forms[key]===false); },
    hasKeyboard:C.hasKeyboard!==false
  };

  /* ── 대표색 하나에서 명암·그라데이션을 만든다 ─────────────────────────
     기관마다 대표색이 있다. 색을 여러 개 받으면 조합이 어긋나 촌스러워지므로
     **한 색만 받고 나머지는 계산한다.**
     ⚠️ 명도를 30~55 로 좁힌다 — 너무 밝으면 버튼 위 흰 글씨가, 너무 어두우면
        옅은 배경이 읽히지 않는다. 고른 색과 화면 색이 조금 다를 수 있다는 뜻이고,
        환경설정 창이 조정된 결과를 미리 보여 준다. */
  function toHsl(hex){
    var r=parseInt(hex.substr(1,2),16)/255, g=parseInt(hex.substr(3,2),16)/255, b=parseInt(hex.substr(5,2),16)/255;
    var mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, h=0, l=(mx+mn)/2;
    var s=d===0?0:d/(1-Math.abs(2*l-1));
    if(d!==0){
      if(mx===r) h=60*(((g-b)/d)%6);
      else if(mx===g) h=60*((b-r)/d+2);
      else h=60*((r-g)/d+4);
    }
    return [Math.round((h+360)%360), Math.round(s*100), Math.round(l*100)];
  }
  var hex=String(C.themeColor||"");
  if(/^#[0-9a-fA-F]{6}$/.test(hex)){
    var t=toHsl(hex.toLowerCase()), H=t[0], S=Math.max(8,t[1]), L=Math.min(55,Math.max(30,t[2]));
    var c=function(s,l){ return "hsl("+H+","+s+"%,"+l+"%)"; };
    var base=c(S,L), dark=c(Math.min(100,S+4),Math.max(18,L-11)), lite=c(Math.min(90,S),95);
    var st=document.documentElement.style;
    st.setProperty("--blue",base);
    st.setProperty("--blue-dark",dark);
    st.setProperty("--blue-light",lite);
    st.setProperty("--grad","linear-gradient(135deg,"+c(S,Math.min(70,L+9))+" 0%,"+base+" 52%,"+dark+" 100%)");
    /* 기하학적 포인트 선(`--hair`)도 대표색에서 뽑는다. 종전에는 CSS 에 기본 파랑이
       **박혀 있어**, 기관이 대표색을 초록으로 바꿔도 이 선만 파랑으로 남았다.
       화면 전용이고(인쇄 CSS 가 `.form-col::before` 를 그리지 않는다) 아주 옅은 농도다. */
    st.setProperty("--hair","hsla("+H+","+S+"%,"+L+"%,.16)");
  }

  /* 로고 — 설정 폴더의 `logo.png` 가 있으면 서식에 박힌 기본 로고를 갈아 끼운다.
     (인쇄 CSS 가 `.gunpo-logo{display:none}` 으로 숨기므로 인쇄물과 무관하다) */
  function onReady(fn){
    if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",fn);
    else fn();
  }
  if(C.logo){
    onReady(function(){
      var n=document.querySelectorAll("img.gunpo-logo"), i;
      for(i=0;i<n.length;i++){ n[i].src=C.logo; n[i].alt=(C.org&&C.org.orgName)||n[i].alt; }
    });
  }

  /* 물리 키보드가 없는 자리 — 이름·주소를 칠 수 없어 그 칸에서 막힌다. 화면 키보드는
     쓰지 않기로 했으므로(2026.08.13 결정), 대신 **도움을 청하라고 눈에 보이게** 알린다.
     `.topbar` 안에 넣는다 — 인쇄 CSS 가 통째로 숨기므로 인쇄물에는 나오지 않는다. */
  if(C.hasKeyboard===false){
    onReady(function(){
      document.documentElement.classList.add("no-keyboard");
      var bar=document.querySelector(".topbar"); if(!bar) return;
      var n=document.createElement("div");
      n.className="kb-help";
      n.style.cssText="flex:1 0 100%;order:9;font-size:13.5px;font-weight:700;color:#8a4b00;"+
        "background:#fff7e6;border:1px solid #ffdf9e;border-radius:8px;padding:7px 10px;";
      n.textContent="글자를 적는 칸에서 입력이 어려우시면 창구 직원에게 말씀해 주세요.";
      bar.appendChild(n);
    });
  }
})();
</script>

function formOn(key){
  if(!key) return true;
  return window.__site ? window.__site.formOn(key) : true;

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function formatDate(d){
  var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  var w=["일","월","화","수","목","금","토"][d.getDay()];
  return y+"년 "+m+"월 "+day+"일 ("+w+")";
}

/* 그 기관이 취급하는 서식만. **그리는 쪽과 누른 것을 읽는 쪽이 같은 목록을 봐야 한다.** */

   ══════════════════════════════════════════════════════════════════════════ */
function renderPaper(f, mode){
  var img=el("gpimg"), hold=el("gpHold"), pap=el("gpaper"),
      sil=el("gpSil"), empty=el("gpEmpty"), note=el("gpNote");
  if(!img||!hold||!pap||!sil||!empty||!note) return;   // Main 에서 사용 중단
  var root=document.documentElement;
  hold.hidden=true; pap.hidden=true; sil.hidden=true; empty.hidden=true;
  root.classList.toggle("picked", mode==="picked");

  if(!f || mode==="empty"){
    img.removeAttribute("src"); img.alt="";
    empty.hidden=false; note.textContent="";
    return;
  }
  if(mode==="silent"){                       // 시연·hover — 실루엣
    img.removeAttribute("src"); img.alt="";
    sil.hidden=false;
    sil.innerHTML = silHtml(f);
    note.textContent = "";
    return;
  }
  // mode === "picked" — 실제 서식
  var src=(typeof FORM_IMAGES!=="undefined") ? FORM_IMAGES[f.key] : null;
  note.textContent = src ? "이 서식을 작성합니다. [작성 시작]을 누르면 또렷해집니다."
                         : "미리보기입니다. 실제 서식과 항목·배치가 다를 수 있습니다.";
  if(src){
    hold.hidden=false;
    img.src=src; img.alt=f.formal+" 미리보기";
    return;
  }
  img.removeAttribute("src"); pap.hidden=false;
  var rows=(f.preview&&f.preview.fields||[]).map(function(k){
    return '<div class="gp-row"><span class="gp-k">'+esc(k)+'</span><span class="gp-v"></span></div>';
  }).join("");
  pap.innerHTML =
    '<div class="gp-title">'+esc(f.formal)+'</div><div class="gp-rule"></div>'+rows+
    '<div class="gp-sign"><span></span><span>신청인 <i></i> (서명 또는 인)</span></div>';
}

/* ⛔ 사용 중단(위 설명 참조) — 실루엣 한 장 */
function silHtml(f){
  var fs = (f.preview && f.preview.fields) || [];
  var vs = (f.preview && f.preview.sample) || [];
  var rows = "";
  for(var i=0;i<fs.length;i++){
    rows += '<div class="sil-row"><span class="sil-k">'+esc(fs[i])+'</span>'+
            '<span class="sil-v"><i>'+esc(vs[i]||"")+'</i></span></div>';
  }
  return '<div class="sil-name">'+esc(f.formal)+'</div><div class="sil-rule"></div>'+
         '<div class="sil-rows">'+rows+'</div>'+
         '<div class="sil-sign"><span></span></div>'+
         '<div class="sil-foot">작성 예시입니다 · 질문에 답하시면 이렇게 채워집니다</div>';
}

/* ⛔ 사용 중단(위 설명 참조) — 값이 한 줄씩 채워지는 연출 */
var silTimers=[];
function silStop(){ for(var i=0;i<silTimers.length;i++) clearTimeout(silTimers[i]); silTimers=[]; }
function silWrite(){
  silStop();
  var rows=document.querySelectorAll("#gpSil .sil-row");
  if(!rows.length) return;
  var gap=Math.max(150, Math.floor((DEMO_STEP_MS-500)/Math.max(rows.length,1)));
  for(var i=0;i<rows.length;i++) rows[i].classList.remove("wrote");
  for(var j=0;j<rows.length;j++) (function(j){
    silTimers.push(setTimeout(function(){ rows[j].classList.add("wrote"); }, 120+j*gap));
  })(j);
}

/* ⛔ 사용 중단(위 설명 참조) — 종이 갈아끼우기 */
var swapTimer=null;
function showPaper(key, mode){
  var col=document.querySelector(".form-col");
  if(!col) return;                                   // Main 에서 사용 중단
  clearTimeout(swapTimer); silStop();
  col.classList.add("swap");
  swapTimer=setTimeout(function(){
    renderPaper(formByKey(key), key ? (mode||"picked") : "empty");
    col.classList.remove("swap");
    if(mode==="silent" && demoing()) silWrite();
  }, 170);
}

/* ══ 목록 아이콘 — 24 격자 · 굵기 1.7 · 둥근 끝 (2026.08.27) ═══════════════
   ⛔ **이모지를 쓰지 않는다.** OS·글꼴에 따라 모양이 달라지고, 목록 8장이 색으로 경쟁한다.
   ⚠️ Figma 시안에도 목록 아이콘이 있지만(20 격자·굵기 1.5) **이 한 벌을 지켰다** —
      사망·이혼은 감정이 실리는 민원이라 상징을 이미 신중하게 정해 두었다
      (국화 한 송이 · 담담한 두 사람. 종교·문화 상징을 쓰지 않는다).
   ⚠️ `currentColor` 라 잉크색을 따른다. 고른 카드에서만 대표색이 된다.

  death:'<circle cx="12" cy="4.9" r="2.1"/><circle cx="15.6" cy="8" r="2.1"/>'+

  /* 개명 — 펜 */
  naming:'<path d="M4 20l.9-3.6L15.4 5.9l2.7 2.7L7.6 19.1z"/><path d="M13.6 7.7l2.7 2.7"/>',
  /* 이혼·친권자 — 두 사람과 그 사이의 끊긴 선. ⛔ 깨진 하트를 쓰지 않는다 */
  divorce:'<circle cx="6.8" cy="8.6" r="2.4"/>'+

          '<circle cx="17.2" cy="8.6" r="2.4"/>'+
          '<path d="M13.4 18.4c0-2.1 1.7-3.8 3.8-3.8s3.8 1.7 3.8 3.8"/>'+

/* ⚠️ 다른 기관이 **새 서식을 늘리면** 여기 없는 `key` 가 온다. 그때 아이콘 자리가
   비면 목록이 고장 난 것처럼 보이므로, 카탈로그의 `icon`(이모지) → **기본 서류 아이콘**
   순으로 물러난다. ⛔ 빈 칸으로 두지 마라. */
var ICON_FALLBACK = '<path d="M6.5 3h7.2L18 7.3V21H6.5z"/><path d="M13.7 3v4.3H18"/>'+
                    '<path d="M9.3 12.4h5.4M9.3 15.6h3.6"/>';
function iconHtml(f){
  var d = ICONS[f.key];
  if(d) return '<svg '+ICON_ATTR+'>'+d+'</svg>';
  if(f.icon) return esc(f.icon);
  return '<svg '+ICON_ATTR+'>'+ICON_FALLBACK+'</svg>';
}

/* RIGHT 의 작은 아이콘 — Figma 원형(16 격자 · 굵기 1.4) */
var PANEL_ATTR = 'viewBox="0 0 16 16" fill="none" stroke="currentColor" '+
                 'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"';
var PANEL_ICONS = {
  chat:'<path d="M2.5 2.5h11a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H5l-3 3V3.5a1 1 0 0 1 1-1z"/>',

/* ══ LEFT — 민원 목록 ═════════════════════════════════════════════════════
   ⛔ **누른다고 바로 넘어가지 않는다.** 누르면 고를 뿐이고, 가운데의
      [작성 시작하기]를 눌러야 간다 — 잘못 누른 사람이 되돌아올 길이 남는다. */
function cardHtml(f){
  var on = (f.key===selected);
  return '<div class="card-wrap" role="listitem">'
    + '<button type="button" class="card" data-key="'+esc(f.key)+'"'
    +   ' aria-pressed="'+(on?"true":"false")+'">'
    +   '<span class="card-ic" aria-hidden="true">'+iconHtml(f)+'</span>'
    +   '<span class="card-tx">'
    +     '<span class="card-label">'+esc(f.citizen)+'</span>'
    +     '<span class="card-formal">'+esc(f.formal)+'</span>'
    +   '</span>'
    +   '<svg class="card-arrow" viewBox="0 0 13 13" fill="none" aria-hidden="true">'
    +     '<path d="M4.5 3.5l4 3-4 3" stroke="currentColor" stroke-width="1.4"'
    +     ' stroke-linecap="round" stroke-linejoin="round"/></svg>'
    + '</button></div>';
}

function renderCards(){
  /* ⚠️ 이동 블록도 여기서 함께 만든다. `innerHTML` 을 갈아 끼우므로 밖에 두면 지워진다.
     ⚠️ `aria-hidden` — `role="list"` 안의 항목이 아니라 **칠해진 자국**일 뿐이다. */
  el("cards").innerHTML = visibleForms().map(cardHtml).join("")
    + '<div class="card-selector" id="cardSelector" aria-hidden="true"></div>';
  syncScrollHint();
  placeSelector(true);
}

/* 이동 블록을 고른 카드에 맞춘다. ⚠️ 카드 높이는 글자 길이·「크게 보기」에 따라 달라지므로
   **잴 때마다 다시 읽는다.** ⛔ 값을 박아 두지 마라. */
function syncSelector(){
  var box=el("cards"), sel=el("cardSelector");
  if(!box || !sel) return;
  var on=box.querySelector('.card[aria-pressed="true"]');
  if(!on){ sel.style.opacity="0"; return; }
  var wrap=on.parentNode || on;          // `.card-wrap` — 목록의 실제 한 칸
  sel.style.opacity="1";
  sel.style.setProperty("--sel-y", wrap.offsetTop+"px");
  sel.style.setProperty("--sel-h", wrap.offsetHeight+"px");
}
/* `immediate` 면 **미끄러지지 않고 그 자리에** 놓는다 — 시연이 시작되는 순간이나 목록을
   다시 만든 직후에 블록이 화면을 가로질러 날아오지 않게 한다. */
function placeSelector(immediate){
  var sel=el("cardSelector"); if(!sel) return;
  if(immediate) sel.style.transition="none";
  syncSelector();
  if(immediate){ void sel.offsetWidth; sel.style.transition=""; }
}

/* 목록이 구를 때만 바닥 단추 위에 실선을 긋는다.
   ⚠️ 취급 서식 수는 기관마다 다르다(설정으로 켜고 끈다). 8종인 군포에서는 구르지 않지만,
      12종을 쓰는 기관에서는 구른다 — 그때 아래에 무엇이 더 있는지 보여야 한다.
   ⚠️ 글자 크기가 바뀌면(크게 보기) 구르는 여부도 바뀌므로 거기서도 다시 부른다. */
function syncScrollHint(){
  var body=document.querySelector(".ask-body"), col=document.querySelector(".task-col");
  if(!body||!col) return;
  col.classList.toggle("scrolls", body.scrollHeight - body.clientHeight > 1);
}

/* ══ CENTER — 준비물 + 작성할 신청서 + [작성 시작하기] ═════════════════════
   ⛔ **없는 것을 지어내지 않는다.** 준비물은 카탈로그의 검증된 `ready` 뿐이고,
      비어 있으면 그 격자를 통째로 내지 않는다(지금은 여권만 채워져 있다).
      ⚠️ Figma 시안의 `READY_DATA` 여권 외 7종은 **샘플이라 쓰지 않았다.**
   ⚠️ 담당 창구는 아직 설정값이 없어 넣지 않았다 — 다음 단계에서 `ORG_KEYS` 로 붙인다.
   ═══════════════════════════════════════════════════════════════════════ */
function renderReady(){
  var box=el("ready");
  var f=formByKey(selected);
  if(!f){ box.innerHTML=""; return; }
  var items=(f.ready||[]);
  /* 한 줄 설명. ⚠️ **Idle 에서만** 「이 민원에서 무엇을 해 드리는가」로 바뀐다
     (2026.08.30 · 자동 시연은 멀리서도 무엇 하는 곳인지 알려야 한다).
     ⛔ 사람이 만지는 순간 `html.demo` 가 떨어져 **종전 문구로 돌아온다.**
     ⛔ 새 행정정보·준비물·업무요건을 만들지 않는다 — `IDLE_TAGLINE` 참조. */
  var lead = items.length ? "작성 전에 필요한 것을 준비해 주세요." : (f.desc||"");
  if(demoing() && IDLE_TAGLINE[f.key]) lead = IDLE_TAGLINE[f.key];
  var h='<div class="ready-head">'
      + '<span class="form-badge">'+esc(f.formal)+'</span>'
      + '<h2 class="ready-title">'+esc(f.citizen)+'</h2>'
      + '<p class="ready-lead">'+esc(lead)+'</p></div>';

  if(items.length){
    /* 3장이면 3열, 4장이면 4열. ⛔ 칸을 채우려고 없는 준비물을 만들지 않는다. */
    h+='<div class="ready-grid" style="--m-grid-n:'+Math.min(items.length,4)+'">';
    for(var i=0;i<items.length;i++){
      var r=items[i];
      h+='<div class="rc">'
       + (r.opt?'<span class="rc-opt">선택</span>':"")
       + '<div class="rc-gfx">'+graphicHtml(r.g)+'</div>'
       + '<div class="rc-sep"></div>'
       + '<div class="rc-name">'+esc(r.t)+'</div>'
       + (r.s?'<div class="rc-sub">'+esc(r.s)+'</div>':"")
       + '</div>';
    }
    h+='</div>';
  }

  /* 작성할 신청서 — ⚠️ `data-shared` 는 **나중에 실제 PAPER 로 이어질 자리**의 표시다.
     이번 단계에서는 모션을 붙이지 않는다(결정 ① — DOM 만 유지). */
  var scale = (f.scale && f.scale.steps)
    ? "약 "+f.scale.steps+"가지를 여쭤봅니다 · "+f.scale.minutes+"분쯤 걸립니다" : "";
  h+='<div class="ready-form" data-shared="form-paper">'
   + '<div class="rf-gfx">'+graphicHtml("document")+'</div>'
   + '<div class="rf-tx">'
   +   '<div class="rf-kicker">여기에서 작성합니다</div>'
   +   '<div class="rf-name">'+esc(f.formal)+'</div>'
   +   '<div class="rf-scale">'+esc(scale)+'</div>'
   + '</div></div>';

  h+='<button type="button" class="ready-go" data-go="'+esc(f.key)+'">작성 시작하기'
   + '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">'
   + '<path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8"'
   + ' stroke-linecap="round" stroke-linejoin="round"/></svg></button>'
   + '<p class="ready-note">적으신 내용은 저장되지 않고, 인쇄한 뒤 바로 지워집니다.</p>';

  box.innerHTML=h;
}

/* 고른 카드의 **표시만** 바꾼다 — ⛔ 목록 DOM 을 다시 만들지 않는다.
   ⚠️ 종전에는 고를 때마다 `renderCards()` 가 목록을 통째로 다시 그렸다. 사람이 한 번
      누를 때는 표가 나지 않지만, Idle 이 4.5초마다 도는 지금은 **새로 만든 카드에
      전환이 걸리지 않아** 선택이 옮겨 가지 않고 점멸한다(게다가 4.5초마다 카드
      여덟 벌을 버린다). class 만 바꾸면 CSS 전환이 그대로 흐른다.
   ⚠️ 목록 자체가 바뀌는 일(취급 서식 설정)은 실행 중에 없다. 그래서 여기서
      다시 그릴 필요가 없고, 카드가 아직 없을 때만 `false` 를 돌려준다. */
function markSelected(){
  var box=el("cards"); if(!box) return false;
  var list=box.querySelectorAll(".card");
  if(!list.length) return false;
  for(var i=0;i<list.length;i++){
    list[i].setAttribute("aria-pressed",
      list[i].getAttribute("data-key")===selected ? "true" : "false");
  }
  syncSelector();                        // 이동 블록이 새 자리로 미끄러진다
  return true;
}

/* 고른 민원을 바꾼다. ⚠️ 목록과 가운데가 **같은 값 하나**를 본다.
   ⛔ 여기에는 모션이 없다. **사람이 누르는 길**이라 조용해야 한다(모션 원칙 §12).
      Idle 의 전환 리듬은 `demoSelect()` 가 따로 맡는다. */
function selectForm(key){
  selected=key;
  if(!markSelected()) renderCards();   // 처음 한 번은 만들어야 한다
  renderReady();
  demoShownKey=selected;               // CENTER 에 그려진 것이 무엇인지 항상 참이게
}

/* ══ RIGHT — 조용한 공통 안내 ═════════════════════════════════════════════
   ⚠️ 문구는 종전 것을 그대로 옮겼다. **새 사실을 만들지 않았다** —
      전화번호·운영시간은 확인된 설정값이 없어 넣지 않았다(Figma 시안의
      `031-390-XXXX` 는 자리표시다). */
function renderRail(){
  var help=[
    ["chat","왜 묻는지 알려 드립니다","그 칸이 왜 필요한지 함께 적어 둡니다."],
    ["form","쉬운 말로 여쭤봅니다","서식의 용어 대신 평소 쓰는 말로 묻습니다."],
    ["steps","적히는 자리를 보여 드립니다","답하시면 실제 신청서의 그 칸에 바로 나타납니다."]
  ];
  var safe=[
    "적으신 내용은 이 화면에서만 쓰이고 어디에도 저장·전송되지 않습니다.",
    "작성이 끝나면 종이로 인쇄해 창구에 내시면 됩니다. 접수·전송은 하지 않습니다.",
    "출력물에는 개인정보가 들어 있습니다. <b>본인이 직접 수령·관리</b>해 주세요.",
    "공용 PC 입니다. 사용 후에는 창을 닫아 개인정보가 남지 않게 해 주세요."
  ];
  var use=[
    "본 도구는 신청서 작성을 돕기 위한 미리보기 도구입니다.",
    "공식 신청서와 항목·배치가 다를 수 있습니다.",
    "실제 접수 가능 여부와 필요 서류는 담당 직원의 확인을 따릅니다."
  ];
  el("rail").innerHTML =
    '<div class="rail-sec"><div class="rail-head">'+panelIcon("chat")+'이렇게 도와드립니다</div>'+
    help.map(function(r){
      return '<div class="rail-item"><span class="rail-ic" aria-hidden="true">'+panelIcon(r[0])+
             '</span><div><b>'+esc(r[1])+'</b><small>'+esc(r[2])+'</small></div></div>';
    }).join("")+'</div>'+
    '<div class="rail-gap"></div>'+
    /* 종전에는 이 내용이 화면 상단의 **빨간 띠**였다. 개인정보 안내는 중요하지만
       위험이 아니다 — Red 는 실제 오류·진행불가에만(철학 §11). */
    '<div class="rail-sec"><div class="rail-head">'+panelIcon("lock")+'안심하고 작성하세요</div>'+
    safe.map(function(t){ return '<p class="rail-note">'+t+'</p>'; }).join("")+'</div>'+
    '<div class="rail-gap"></div>'+
    '<div class="rail-sec"><div class="rail-head">'+panelIcon("info")+'이용 안내</div>'+
    '<ul class="rail-list">'+
    use.map(function(t){ return '<li><i>→</i><span>'+esc(t)+'</span></li>'; }).join("")+
    '</ul></div>'+
    '<div class="rail-foot"><span id="officeName"></span></div>';
  el("officeName").textContent = ORG_CONFIG.officeName||"";
}

/* ══════════════════════════════════════════════════════════════════════════
   Idle — **화면을 따로 두지 않는다.** 이 Main 이 스스로 천천히 사용된다 (2026.08.28)

   「대기화면은 광고판이 아니라 사용해도 된다는 신호다」(철학 §22)

   ⛔ 캐러셀·시정홍보·빠른 pulse·bounce·flash 를 쓰지 않는다. 8초에 한 번 **선택이
      옮겨 갈 뿐**이고, 그 결과로 가운데가 바뀐다.
   ⛔ hover 흉내를 내지 않는다. `selectForm()` — **사람이 누를 때와 똑같은 경로**를 부른다.
      그래서 시연에 나오는 화면은 정의상 실제 화면과 같다(따로 그리는 코드가 없다).
   ⛔ RIGHT 는 공통 안내라 움직이지 않는다 — `renderRail()` 을 다시 부르지 않는다.
   ⚠️ 종전의 「종이에 값이 한 줄씩 그어지는 시연」은 **폐기**했다. CENTER 에 종이가 없다
      (그 코드는 아직 지우지 않았다 — 위의 「사용 중단」 표시를 보라).
   ⚠️ 멈출 때 **화면을 되돌리지 않는다.** 마지막으로 짚던 민원이 그대로 골라져 있어
      바로 [작성 시작하기]를 누를 수 있다 — 깨어나는 순간 화면이 갈리지 않는다.
   ⚠️ 시연 중에 **없는 정보를 채우지 않는다.** 준비물이 검증된 것은 아직 여권뿐이고,
      나머지는 그 자리를 비워 둔 채로 순회한다(지어내지 않는다).
   ══════════════════════════════════════════════════════════════════════════ */
var DEMO_ENABLED = true;
/* 한 민원에 머무는 시간. ⚠️ 8초 → **4.5초**(2026.08.30 · Idle Motion v2).
   8초는 「멈춰 있는 화면」으로 보였다. 4.5초면 8종 한 바퀴가 **36초**라, 지나가던
   사람이 한 자리에 서서 전체를 볼 수 있다.
   ⚠️ 등장 연출이 0.68초에 멎으므로 나머지 **3.8초는 정지 상태**다 — 읽을 시간이 있다.
   ⛔ 4.0~5.0초 밖으로 나가지 마라. 더 빠르면 광고 배너가 되고, 더 느리면 다시 멈춘
      화면이 된다. */
var DEMO_STEP_MS = 4500;
/* 자동 시연에 **들어갈 때 한 번만** 보여 주는 소개의 길이(CSS `idleIntro` 와 같은 값).
   ⛔ 순환마다 되풀이하지 않는다. */
var DEMO_INTRO_MS = 1400;
/* 시연이 한 걸음 옮긴 직후, 커서 아래 요소가 바뀌어 브라우저가 **합성 mousemove** 를
   던진다. 그것에 즉시 꺼지지 않도록 걸음마다 이 시간만 움직임을 무시한다.
   ⛔ 누름·키·터치는 가드 없이 **언제나** 즉시 멈춘다. */
var DEMO_GUARD_MS = 400;
/* 아무 조작이 없을 때 시연으로 돌아가는 시간 — **1분**(2026.08.30 요청).
   ⚠️ 종전에는 키오스크 환경설정의 `idleMs` 를 그대로 따라갔다(기본 3분). 그것과 **갈라 두었다** —
      두 시계는 하는 일이 다르다.
        · `idleMs` 는 **보호**다. 서식 8종에서 반쯤 적다 만 개인정보를 지우는 시계라,
          짧게 잡으면 시민이 생각하는 사이에 적은 것이 날아간다.
          ⛔ 그것을 1분으로 줄이지 마라(환경설정 「무동작이 이만큼 지나면」은 그대로 3분이다).
        · 여기 이 시계는 **대기로 돌아가기**다. 허브에는 지울 개인정보가 없고, 사람이 만지는
          순간 즉시 멎으며 첫 누름도 삼키지 않는다. 그래서 짧을수록 화면이 살아 보인다.
   ⛔ 8종과 달리 30초 경고를 띄우지 않는다 — 지울 것이 없으니 예고할 것도 없다. */
var DEMO_BACK_MS = 60 * 1000;
var demoTimer=null, backTimer=null, demoAt=0, lastArm=0;
/* 전환 도중(퇴장 → 등장 사이)과 소개를 재는 시계. ⛔ 중첩되지 않게 **언제나 하나씩**만
   살아 있고, `stopDemo()` 가 둘 다 지운다.
   `demoShownKey` 는 **지금 CENTER 에 실제로 그려져 있는** 민원이다. 전환 한가운데에서
   멈출 때 LEFT 를 이것에 도로 맞춰, 목록과 가운데가 서로 다른 민원을 가리키지 않게 한다. */
var demoSwap=null, introTimer=null, demoShownKey=null;

/* Idle 에서만 쓰는 한 줄 설명 — 「이 민원에서 무엇을 해 드리는가」.
   ⛔ **새 행정정보·준비물·업무요건을 만들지 않는다.** 전부 카탈로그의 `desc`·`ready` 가
      이미 말하고 있는 것을 홍보 문장으로 다시 쓴 것뿐이다. 접수 요건·서류 기준을
      여기서 정하지 마라 — 그 원본은 담당자 확인본이다.
   ⛔ 여기 없는 서식은 종전 문구(`desc`)가 그대로 쓰인다. 다른 기관이 서식을 더해도
      화면이 비지 않는다. */
var IDLE_TAGLINE = {
  passport:  "사진과 신분증을 준비하시면, 질문에 따라 신청서를 함께 작성합니다.",
  birth:     "부모와 출생 정보를 차근차근 여쭤보고 신고서를 채워 드립니다.",
  marriage:  "혼인당사자와 증인 정보를 순서대로 확인하며 신고서를 작성합니다.",
  death:     "필요한 항목을 빠뜨리지 않도록 질문에 따라 신고서를 작성합니다.",
  naming:    "개명 전·후 이름과 법원 허가 사항을 순서대로 여쭤봅니다.",
  divorce:   "협의·재판 여부에 따라 해당하는 항목만 골라 안내합니다.",
  cert:      "필요한 증명서와 통수를 고르시면 발급 신청서를 작성합니다.",
  realestate:"복잡한 거래신고 항목을 하나씩 확인하며 순서대로 작성합니다."
};

/* ⚠️ CSS 의 `prefers-reduced-motion` 규칙은 transition/animation 만 끈다.
      **JS 로 도는 시연은 여기서 직접 갈라야 한다.** */
function calmMotion(){
  try{ return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
  catch(e){ return false; }
}
function demoing(){ return document.documentElement.classList.contains("demo"); }

/* ══ 한 걸음 — **LEFT 가 먼저 옮겨 가고 CENTER 가 뒤따른다** (Idle Motion v2)
   ① LEFT 선택 이동(240ms) → ② 옛 CENTER 복제본이 물러난다(220ms) →
   ③ **90ms 에** 새 CENTER 등장(300ms) → ④ 내부 stagger → ⑤ CTA 한 번.
   ⚠️ 2026.08.30 — ② 를 **복제본으로** 바꿨다. 종전에는 같은 요소를 흐리게 했다가 도중에
      내용만 갈아 끼워, 겹치는 것이 아니라 「흐려지다가 툭 바뀌는」 것으로 보였다.
   ⛔ 사람이 누르는 `selectForm()` 과 갈라 둔다 — 그쪽은 모션 없이 즉시다.
   ⚠️ 실제로 바뀌는 값은 `selected` 하나이고, 그리는 함수도 종전과 **같은 것**을 쓴다.
      시연 전용 렌더러를 따로 두지 않는다 — 그래야 시연 화면이 실제 화면과 같다. */
function demoSelect(key){
  selected=key;
  markSelected();                       // ① LEFT 가 **먼저** 움직인다
  var box=el("ready");
  if(!box) return;
  /* 줄여 달라고 한 사용자에게는 겹침 없이 바로 갈아 끼운다(여기까지 올 일은 없다) */
  if(calmMotion()){ renderReady(); demoShownKey=selected; return; }

  /* ② 옛 화면이 물러난다(160ms).
     ③ **다 사라진 뒤에** 갈아 끼운다(170ms) — 그래야 「툭 바뀌는」 순간이 눈에 걸리지 않는다.
        ⛔ 이 값을 줄여 겹치게 만들지 마라. 종전 110ms 가 바로 그 어색함의 원인이었다. */
  box.classList.remove("pv-enter");
  box.classList.add("pv-leave");
  clearTimeout(demoSwap);
  demoSwap=setTimeout(function(){
    demoSwap=null;
    renderReady();
    demoShownKey=selected;
    box.classList.remove("pv-leave");
    void box.offsetWidth;                    // ⚠️ 리플로우 — 없으면 등장이 다시 타지 않는다
    box.classList.add("pv-enter");
  }, 170);
}

function startDemo(){
  if(!DEMO_ENABLED) return;
  clearTimeout(backTimer); backTimer=null;
  if(demoing()) return;
  /* 줄여 달라고 한 사용자에게는 **아예 돌리지 않는다**(자동 시연 없음) */
  if(calmMotion()) return;
  /* ⚠️ 그 기관이 취급하는 것만 돈다(`formOn`). 한 가지뿐이면 순회가 뜻이 없으므로
     돌리지 않는다 — 같은 화면이 4.5초마다 다시 그려질 뿐이다. */
  var forms=visibleForms();
  if(forms.length<2) return;
  document.documentElement.classList.add("demo");
  /* 지금 골라진 것 **다음**부터 시작한다 — 같은 화면을 한 번 더 보여 주지 않는다 */
  var at=0;
  for(var i=0;i<forms.length;i++) if(forms[i].key===selected) at=i+1;

  function step(){
    demoSelect(forms[at % forms.length].key);
    at++;
    demoAt=+new Date();
    demoTimer=setTimeout(step, DEMO_STEP_MS);
  }

  /* 소개를 **한 번만** 띄우고 그 뒤에 순회를 시작한다.
     ⚠️ 덮개는 CENTER 만 가린다 — LEFT·RIGHT 는 그대로 보인다. */
  var intro=el("idleIntro"), kick=el("idleIntroKicker");
  if(intro){
    /* 기관이 바뀌면 이름도 바뀐다 — BAR 의 그 글자를 그대로 가져다 쓴다(지어내지 않는다) */
    if(kick && !kick.textContent){
      var h1=document.querySelector(".brand-tx h1");
      kick.textContent = h1 ? h1.textContent : "";
    }
    intro.classList.remove("show");
    void intro.offsetWidth;
    intro.classList.add("show");
    clearTimeout(introTimer);
    introTimer=setTimeout(function(){
      introTimer=null;
      intro.classList.remove("show");
      step();                            // 소개가 걷힌 뒤부터 순회
    }, DEMO_INTRO_MS);
    return;
  }
  step();
}

/* 시연을 멈춘다. ⛔ 화면을 되돌리지 않는다 — 보이는 그대로 바로 조작할 수 있어야 한다.
   ⚠️ **전환 한가운데에서 멈출 수 있다.** 남은 시계와 animation class 를 전부 걷어내지
      않으면 가운데가 반쯤 사라진 채 굳거나 소개 덮개가 남는다.

   ⛔ **여기서 `renderReady()` 를 부르지 마라 — 사용자의 첫 누름이 삼켜진다.**
      이 함수는 `pointerdown` 에 실려 돌아간다. 그 순간 CENTER 를 다시 그리면 눌린
      단추가 DOM 에서 사라지고, 브라우저는 mousedown 과 mouseup 의 **공통 조상**에
      `click` 을 던진다 — 위임 처리기의 `closest("[data-go]")` 가 빈손이 되어
      [작성 시작하기] 한 번이 없던 일이 된다.
   ✅ 대신 아직 그려지지 않은 전환은 **LEFT 를 되돌려** 맞춘다. `markSelected()` 는
      class 만 바꾸므로 눌린 요소가 살아 있다. */
function stopDemo(){
  clearTimeout(demoTimer); demoTimer=null;
  clearTimeout(introTimer); introTimer=null;
  if(demoSwap){
    clearTimeout(demoSwap); demoSwap=null;
    /* CENTER 는 아직 앞 민원이다 — 목록을 그쪽으로 도로 맞춘다(둘이 갈리지 않게) */
    if(demoShownKey){ selected=demoShownKey; markSelected(); }
  }
  var box=el("ready");
  if(box) box.classList.remove("pv-leave","pv-enter");
  var intro=el("idleIntro");
  if(intro) intro.classList.remove("show");
  document.documentElement.classList.remove("demo");
}
function armDemo(){ clearTimeout(backTimer); backTimer=setTimeout(startDemo, DEMO_BACK_MS); }

function chooseForm(key){
  var f=formByKey(key);
  if(f && f.href) location.href=f.href;
}

function bindEvents(){
  /* 시연을 끄는 것 — 마우스가 **움직이기만 해도** 끈다. 키·터치·휠도 마찬가지다.
     장치를 전제하지 않는다(철학 §19).

     ⛔ **깨우는 입력을 삼키지 않는다**(2026.08.28 결정). Idle 은 덮개도 대기화면도 아니라
        **이 Main 이 스스로 고르고 있는 상태**다. 그러니 첫 누름은 「깨우기」가 아니라
        그냥 그 사람의 첫 조작이어야 한다 — 카드를 누르면 그 카드가 골라지고,
        [작성 시작하기]를 누르면 그대로 들어가고, [크게 보기]는 그 한 번에 켜진다.
        종전에는 여기서 `preventDefault()` 로 삼켜 **두 번 눌러야** 했다.
     ⚠️ 그래서 이 처리기는 **아무것도 막지 않는다.** 시계만 만지고 이벤트는 그대로 흘러
        원래 처리기(카드 click · CTA click · 단추들)로 내려간다. `passive:true` 인 것이
        그 약속의 표시다 — 여기서 실수로 막으려 하면 브라우저가 무시한다.
     ⚠️ 시연이 한 걸음 옮긴 직후에는 커서 아래 요소가 바뀌어 브라우저가 **합성
        mousemove** 를 던진다. 그 400ms 만 움직임을 무시한다. 누름·키·터치는 가드 없다.
     ⚠️ 시연 중이 아니면 무동작 시계만 되감는다. pointermove 는 초당 수십 번 오므로
        1초에 한 번만 되감는다. */
  ["pointermove","pointerdown","keydown","wheel","touchstart"].forEach(function(t){
    document.addEventListener(t, function(){
      var now=+new Date();
      if(demoing()){
        if(t==="pointermove" && now-demoAt < DEMO_GUARD_MS) return;   // 합성 이동 무시
        stopDemo();
        armDemo();
        return;                       // ⛔ preventDefault·stopPropagation 하지 않는다
      }
      if(now-lastArm < 1000) return;
      lastArm=now; armDemo();
    }, {capture:true, passive:true});
  });

  /* 목록 — 누르면 **고르기만** 한다. ⛔ 페이지를 옮기지 않는다.
     ⚠️ hover 는 카드 자신만 밝힌다(CSS). CENTER 를 바꾸지 않는다(Figma 동결 §5). */
  el("cards").addEventListener("click", function(e){
    var b=e.target.closest(".card");
    if(b) selectForm(b.getAttribute("data-key"));
  });

  /* 가운데의 [작성 시작하기]만 실제로 이동한다 */
  el("ready").addEventListener("click", function(e){
    var go=e.target.closest("[data-go]");
    if(go) chooseForm(go.getAttribute("data-go"));
  });

  el("btnStaff").addEventListener("click", function(){
    var n=el("staffNote");
    n.innerHTML = n.innerHTML ? "" :
      "<b>창구 직원에게 말씀해 주세요.</b><br>"+
      "어떤 서식이 필요한지 함께 찾아 드립니다. "+
      esc(ORG_CONFIG.officeName||"")+" 창구로 오시면 됩니다.";
  });

  /* 크게 보기 — `html.big` 이 글자 토큰만 갈아 끼운다.
     ⚠️ 열 폭(`--m-cols`)은 **바뀌지 않는다**(2026.08.28 결정 ②). */
  el("btnBig").addEventListener("click", function(){
    var on=document.documentElement.classList.toggle("big");
    this.setAttribute("aria-pressed", on?"true":"false");
    el("btnBigLabel").textContent = on ? "일반 보기로" : "크게 보기";
    syncScrollHint();          // 글자가 커지면 목록이 구를 수 있다
    placeSelector(true);       // 카드 높이가 달라졌다 — 블록을 그 자리에서 다시 맞춘다
  });

  /* 화면 크기가 바뀌어도 다시 잰다(다른 기관의 다른 해상도·회전) */
  window.addEventListener("resize", function(){ syncScrollHint(); placeSelector(true); });
}

function init(){
  el("orgName").textContent = ORG_CONFIG.orgName;
  el("today").textContent = formatDate(new Date());
  var forms=visibleForms();
  selected = forms.length ? forms[0].key : null;
  renderCards();
  renderReady();
  demoShownKey = selected;
  renderRail();
  bindEvents();
  /* 서식에서 **무동작으로 되돌아온 경우**(`?from=idle`)에는 기다리지 않고 **바로** 시연한다.
     ⚠️ 그 사람은 서식에서 3분 무입력에 30초 경고까지 지나쳤다 — 떠난 것이 확실하다.
        여기서 1분을 더 정지해 있으면 키오스크가 도합 **4분**을 멈춰 있게 된다.
     ⛔ 그 밖의 도착에는 그대로 1분을 기다린다 — 허브를 처음 열었거나, 사람이 [메인으로]를
        눌러 직접 돌아온 경우다. **방금 누른 화면이 갑자기 움직이면 안 된다.**
     ⚠️ `startDemo()` 가 스스로 물러나는 경우(줄임 설정·취급 서식 1종)에는 어차피 시연이
        돌지 않으므로 시계를 걸어 두지 않는다. 사람이 만지면 그때 다시 걸린다. */
  if(/(^|[?&])from=idle(&|$)/.test(location.search||"")) startDemo();
  else armDemo();
}

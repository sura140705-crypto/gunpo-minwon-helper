<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여권발급신청서 작성 미리보기 도우미</title>
<!--
  여권발급신청서(여권법 시행규칙 별지 제1호서식, 2026.6.1 개정) 작성 미리보기 도우미
  - 단일 HTML 파일 · 외부 서버/라이브러리/CDN/폰트/이미지 없음
  - 입력값은 브라우저 메모리에서만 처리 · 저장(localStorage 등) 안 함 · 새로고침 시 소멸
  - 좌: 실제 서식을 재현한 신청서 (실시간 반영) / 우: 단계별 간단 입력
  - 작성 보조·미리보기용 (공식 접수 가능 여부 미보장)
-->
<!--DESIGN-TOKENS v1-->
<style>
/* ══════════════════════════════════════════════════════════════════════
   디자인 토큰 (2026.08.24 신설) — `docs/디자인검토/DESIGN_PHILOSOPHY.md` §21

   「새로운 서식을 만들 때 새로운 디자인을 발명하지 않는다」를 지키려면 값이 한 곳에
   있어야 한다. 종전에는 색·반경·간격·글자 크기가 **다섯 원본에 흩어져 하드코딩**돼
   있었다(engine/base.html · passport · marriage · divorce · index). 한 곳을 고치면
   나머지 넷이 조용히 갈라진다 — 초기화 코드가 아홉 곳에 복제된 것과 같은 뿌리다.

   ⚠️ 이 블록은 **5개 원본에 글자까지 똑같이** 들어간다.
      고칠 때는 `engine/base.html` 을 고치고 →
        `node tools/build-form.js <이름>` 으로 엔진 5종 재빌드
        `python tools/check-design-tokens.py --fix` 로 손작성 3종·허브 반영
      확인은 `python tools/check-design-tokens.py` (다르면 exit 1).

   ⛔ **인쇄물에 나가는 값을 이 블록에 얹지 마라.** 여기 있는 것은 전부 화면 전용이다.
      서식 위 값의 위치·크기·글꼴은 절대좌표라 `verify-print.py` 19쪽 0px 가 지킨다.
      예외는 `--sign-hl` 하나이고, 왜 예외인지 그 자리에 적어 두었다.

   ⚠️ **신설 시점에는 아무도 이 토큰을 쓰지 않는다.** 값이 지금 화면과 똑같도록
      맞춰 두었을 뿐이다(화면 무변경이 이 단계의 합격 조건이었다). 하드코딩을
      토큰으로 바꾸는 일은 영역별로 나누어 진행한다 — 한꺼번에 바꾸면 무엇이
      화면을 바꿨는지 짚을 수 없다.
   ══════════════════════════════════════════════════════════════════════ */
:root{

  /* ── Institution Accent ────────────────────────────────────────────
     기관 대표색. **값을 여기에 적지 않는다** — `--blue` 계열은 SITE-CONFIG 블록이
     `documentElement.style` 로 주입하는 이름이고, 그 네 이름은 계약이다.
     새 CSS 는 아래 별칭을 쓴다. 그래야 나중에 `--blue` 라는 이름을 버리더라도
     화면 쪽 코드를 건드리지 않는다.
     ⛔ `--blue`·`--blue-dark`·`--blue-light`·`--grad` 를 **이름째 바꾸지 마라.**
        SITE-CONFIG·환경설정 창(main.js)이 그 이름으로 값을 넣는다. */
  --accent:        var(--blue);
  --accent-strong: var(--blue-dark);
  --accent-soft:   var(--blue-light);
  /* --grad(135° 그라데이션) — DESIGN_PHILOSOPHY §1 DON'T 는 **큰 면적의 장식적**
     Gradient 를 금하는 것으로 읽는다(2026.08.24 결정 §4). 지금 쓰이는 곳은 상단 바
     아래 3px 띠처럼 좁은 Accent 뿐이라 **당장 걷어내지 않는다.** 단색화 여부는
     최종 Visual Design 단계에서 다시 판단한다. */

  /* ── Surface (§1 Quiet Paper Desk · §2 세 영역) ─────────────────────
     대표색과 **무관한** 따뜻한 무채색. 기관이 대표색을 무엇으로 바꾸든 이 값들은
     그대로여서 색을 갈아 끼워도 화면이 무너지지 않는다.
     세 면의 명도를 조금씩 달리해 **선을 긋지 않고도 영역이 갈리게** 한다. */
  --surface-work: #f7f6f3;   /* LEFT   질문하고 입력하는 곳 */
  --surface-zone: #e4e1db;   /* CENTER 서식이 놓이는 바닥 */
  --surface-rail: #f1f0ec;   /* RIGHT  Context Rail */
  --surface-head: #fbfaf7;   /* 상단 바 */
  --surface-cool: #f2f4f7;   /* 옛 배경색(허브·7종). 세 영역으로 옮기면 사라진다 */

  /* ── Paper (§2 Paper First) ────────────────────────────────────────
     종이 자체는 언제나 흰색이다. 그림자로만 바닥에서 띄운다. */
  --paper:        #fff;
  --paper-shadow: 0 2px 6px rgba(0,0,0,.06), 0 14px 34px rgba(0,0,0,.10);

  /* ── Ink (§16 Typography is the Voice) ─────────────────────────────
     ⚠️ `--ink-muted` 를 더 옅게 하지 마라. §15 「가독성을 해칠 정도로 대비를
        낮추지 않는다」. 여권은 이미 한 번 진하게 올렸다(#5b626c → #495059). */
  --ink:       #1a1c1f;
  --ink-muted: #5b626c;

  /* ── Border ────────────────────────────────────────────────────────*/
  --border:        #d2cfc9;              /* 따뜻한 기본선 */
  --border-strong: #b9b6b0;              /* 입력칸·카드 테두리 */
  --border-cool:   #d5d9df;              /* 옛 회색선(허브·7종) */
  --hair:          rgba(27,95,192,.16);  /* 기하학적 포인트 선 */
  /* ⚠️ `--hair` 는 기본 파랑이 **박혀 있다.** 기관이 대표색을 초록으로 바꿔도
        이 선만 파랑으로 남는다 — 알려진 결함이고, 대표색에서 계산하도록
        SITE-CONFIG 에서 함께 주입하는 것이 옳다. 다음 단계로 미뤄 둔다. */

  /* ── Current Focus (§5 Show Where It Goes) ─────────────────────────
     **지금 작성 중인 Paper 위치.** 화면 전용이고, 기관 대표색에서 파생한 저채도다.
     ⛔ 노랑/Amber 로 바꾸지 마라. 그 색은 아래 **Print Marker** 의 것이고,
        한 색이 「지금 적는 칸」과 「여기 서명하세요」 두 뜻을 갖게 된다.
        (DESIGN_PHILOSOPHY §15 는 Muted Amber 를 제안했으나 이 충돌 때문에
         대표색 파생을 유지하기로 했다 — 2026.08.24 결정 §1.)
     ⚠️ 대표색에서 파생하므로 기관이 색을 바꾸면 Focus 도 따라온다. */
  --focus-face: var(--blue-light);
  --focus-line: var(--blue);

  /* ── Print Marker ──────────────────────────────────────────────────
     **출력 후 시민이 직접 서명·날인·기재할 위치.** Current Focus 와 섞지 마라 —
     이쪽은 사람이 펜을 댈 자리를 종이 위에서 가리키는 것이다.
     ⛔⛔ 이 토큰 하나만 **인쇄물이다.** 색·투명도·좌표를 바꾸면 인쇄 결과가 달라져
        `verify-print.py` 기준선을 갱신해야 한다. */
  --marker-sign: rgba(255,232,0,.55);

  /* ── Warning (§11 Privacy without Fear) ────────────────────────────
     > Warning color is semantic, not decorative.
     ⚠️ 빨강은 **실제 오류·위험·즉각적인 주의**에만 쓴다. 개인정보 안내처럼
        「중요하지만 위험은 아닌」 문장은 아래 `--notice-*`(갈색 계열)를 쓴다.
        지금 화면에는 이 규칙을 어긴 곳이 남아 있다(허브 빨간 띠, 인쇄 전 안내
        빨간 상자, 아무것도 틀리지 않았는데 뜨는 `.step-warn`). 다음 단계 과제다. */
  --warn:      #a12727;
  --warn-face: #fdecec;
  --warn-line: #f5b5b5;
  --notice:      #7a5600;   /* 중요하지만 위험이 아닌 안내 — 짙은 갈색 */
  --notice-face: #fff8e6;
  --notice-line: #ffe19a;

  /* ── Radius ────────────────────────────────────────────────────────
     여권 한 파일에 반경이 13가지 흩어져 있던 것을 아래 여섯 단계로 모았다
     (2026.08.24). 새 서식은 이 여섯 개 밖의 값을 쓰지 않는다.

     ⛔ **인쇄되는 반경 둘은 토큰을 쓰지 않는다** — 값이 박혀 있어야 한다.
          `.ovhi`     4px  Print Marker(서명 자리)
          `.csign-hl` 3px  위임장·동의서 서명 형광
        토큰으로 바꿔 두면 나중에 아래 값을 만질 때 **인쇄물이 조용히 달라진다.**
     ⚠️ 제목 왼쪽 2px 장식 막대도 뺐다 — 폭이 3px 남짓이라 `--r-xs`(4px)를 주면
        알약이 된다. 스케일에 넣기엔 너무 작다. */
  --r-xs:   4px;
  --r-sm:   8px;
  --r-md:  10px;    /* 가장 많이 쓰이는 값 */
  --r-lg:  12px;
  --r-xl:  18px;
  --r-pill: 999px;

  /* ── Shadow (§1 DON'T 강한 그림자) ─────────────────────────────────*/
  --shadow-lift:  0 4px 20px rgba(0,0,0,.4);
  --shadow-modal: 0 20px 60px rgba(0,0,0,.35);

  /* ── Spacing ───────────────────────────────────────────────────────*/
  --sp-1:  4px;
  --sp-2:  8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 22px;
  --sp-6: 30px;

  /* ── Motion (§17 Interaction) ──────────────────────────────────────
     「움직임은 상태를 설명할 때만」을 지키려면 값이 한 곳에 있어야 한다.
     종전에는 5원본 8곳에 박혀 있었고 종류가 벌써 다섯이었다(.12·.15·.2·.22·.34s).
     easing 은 대부분 **방치**돼 브라우저 기본값(ease)으로 굴러갔다 — Radius 13가지와 같은 뿌리다.

     ✅ **값이 정해졌다(2026.08.27, 외부 검토 과제 A).** 세 박자로 통합했다 —
        120 / 200 / 320. 종전(120·220·340)과 20ms 씩만 다르다. 지금 화면이 크게 틀리지
        않았다는 뜻이고, **바뀐 것은 주로 easing** 이다. 셋이 제각각이던 곡선을
        **한 가족**(빠르게 나와 길게 멎는 out · 가속하며 물러나는 in · 양끝이 완만한 move)
        으로 맞췄다.
     ⚠️ 세 박자 이상으로 늘리지 마라. 늘어나는 순간 다시 흩어진다.

     ⛔ 인쇄물에는 모션이 없다. 이 값들은 전부 화면 전용이다.
     ⚠️ 아래 `@media (prefers-reduced-motion: reduce)` 가 이것들을 통째로 끈다.
        ⛔ 다만 **JS 로 도는 것(허브 시연)은 CSS 로 안 꺼진다** — `matchMedia` 로 따로 본다. */
  --dur-quick: 120ms;   /* 눌린 표시·hover — 손을 뗄 무렵 반응이 보여야 한다 */
  --dur-base:  200ms;   /* 펼침·접힘·나타남 — 시민이 직접 일으킨 상태 변화 */
  --dur-calm:  320ms;   /* 종이 갈아끼우기·큰 비율 변화 — 위치가 어디로 갔는지 따라갈 시간 */
  --ease-out:  cubic-bezier(.2,0,0,1);        /* 들어오는 것 — 빨리 보이기 시작해 길게 멎는다 */
  --ease-in:   cubic-bezier(.4,0,1,1);        /* 나가는 것 — 다음 내용을 가리지 않고 물러난다 */
  --ease-move: cubic-bezier(.4,0,.2,1);       /* 자리를 옮기는 것 — 양끝이 완만하다 */

  /* ── Typography (§16) ──────────────────────────────────────────────
     글꼴은 하나만 쓴다. 관공서 PC 에 반드시 있는 것이어야 하고, 오프라인
     설치본이라 웹폰트를 받을 수 없다. */
  --ff: "Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
  --fs-question: 34px;    /* 시민에게 말하는 큰 질문 */
  --fs-lead:     21px;    /* 입력칸에 치는 글자 */
  --fs-label:    18px;    /* 항목 라벨 */
  --fs-card:     20px;    /* 선택 카드 제목 */
  --fs-card-sub: 15px;    /* 선택 카드 설명 */
  --fs-body:     17px;    /* 본문 기본 */
  --fs-help:     17px;    /* 「왜 묻는지」 */
  --fs-sum:    16.5px;    /* 최종 확인 요약 줄 */
  --fs-small:  13.5px;    /* 행정적 보조 설명 */
  /* Context Rail(§10)은 구조와 폭을 고정하고 **글자만** 크게 보기를 따른다 */
  --fs-rail-num:   33px;  /* 진행 큰 숫자 */
  --fs-rail-head:  15px;  /* 「준비하셨나요?」 같은 머리 */
  --fs-rail-item:13.5px;  /* 목록 항목 */
  --fs-rail-note:12.5px;  /* 안심 안내 본문 */
  --fw-bold:   700;
  --fw-heavy:  800;
  --ls-tight: -.035em;    /* 큰 질문에만 */

  /* ── Touch target — Input-Agnostic, Touch-Friendly ─────────────────
     터치·마우스·물리키보드에서 **모두** 쓸 수 있어야 한다(2026.08.24 결정 §2).
     ⚠️ **크기는 터치 기준을 유지한다.** 큰 표적은 마우스에서도 문제가 없지만
        그 반대는 성립하지 않는다.
     ⛔ hover 는 보조 효과로만 쓴다. **hover 에만 의존하는 정보·기능은 금지.** */
  --touch-card:  132px;   /* 큰 선택 카드 최소 높이 */
  --touch-field:  64px;   /* 글자 입력칸 높이 */
  --touch-min:    48px;   /* 그 밖의 누를 수 있는 것의 최소 변 */
  --btn-h:        62px;   /* [이전]·[다음] 높이 */

  /* ── Layout (§2 LEFT / CENTER / RIGHT) ─────────────────────────────*/
  --topbar-h:      74px;
  --rail-w:       252px;
  --rail-w-narrow:214px;  /* 1600px 이하 */
  --question-max: 640px;  /* 질문 한 줄이 길어지지 않게 */
  --cards-max:    700px;
  /* 세 영역의 가로 배분. **1920×1080 실물을 보고 미세조정**할 수 있게 토큰으로 뺐다.
     ⛔ 비율만 숫자로 빼서 `calc(var(--x)*1fr)` 로 쓰지 마라 — **`fr` 은 `calc()` 안에서
        쓸 수 없다.** 선언 전체가 무효가 되어 3단이 한 줄로 무너진다(2026.08.24 에 실제로
        그렇게 깨졌고 갈무리 용량이 절반으로 줄어 들통났다). 트랙 목록을 통째로 담는다. */
  /* ⚠️ 2026.08.24 — 고정폭 RAIL 을 버리고 **비율**로 바꿨다. 종전 값(1 : 1.08 : 252px)은
     1920 에서 794 : 858 : 252 = 약 3 : 3 : 1 이 되어 **질문면이 너무 넓고 종이가 좁았다.**
     이제 세 칸 전부 `fr` 이라 화면이 커지든 작아지든 비율이 유지된다.
       일반 보기  2 : 3 : 1   → 1920 에서 640 : 960 : 320
       크게 보기  5 : 5 : 2   → 1920 에서 800 : 800 : 320  (아래 html.big)
     RAIL 은 두 경우 모두 화면의 1/6 이라 폭이 변하지 않는다 — 「크게 보기에서 RAIL 은
     구조와 폭을 그대로 두고 글자만 키운다」(동결 §3-3)가 이렇게 지켜진다. */
  --cols:             minmax(0,2fr) minmax(0,3fr) minmax(0,1fr);
  /* 좁은 화면에서도 비율이 같다 — 고정폭이 아니라 `fr` 이므로 저절로 줄어든다.
     이름은 남겨 둔다(각 화면의 미디어 쿼리가 이 이름으로 참조한다). */
  --cols-narrow:      minmax(0,2fr) minmax(0,3fr) minmax(0,1fr);
  --cols-narrow-left: minmax(0,3fr) minmax(0,2fr) minmax(0,1fr);
}

/* ── 크게 보기 (§13) — Responsive Layout Mode ─────────────────────────
   ⛔ **전체 화면 Zoom 이 아니다.** Paper 를 통째로 확대하는 기능도 아니다.
      목적은 질문·입력·조작 UI 의 읽기와 조작 편의이고, CENTER Paper 는
      **바뀐 영역 안에서 가능한 최대 크기**를 유지한다(fit-to-area).
   ⚠️ 그래서 크게 보기를 켜면 **Paper 는 오히려 작아진다**(1920 기준 794→667px).
      **버그가 아니라 받아들인 결과다**(2026.08.24 결정 §6-1). 서식을 크게 보는 길은

  --fs-card-sub:  17px;
  --fs-body:      19px;
  --fs-help:      19px;
  --fs-sum:     18.5px;

       위 `DESIGN-TOKENS` 눈금은 **크게 보기가 없던 시절**(2026.07 「어르신 가독성
       강화」)에 만들어져 Normal 이 큰 글씨 몫까지 지고 있었다. 이제 크게 보기가
       따로 있으므로 Normal 은 **허브 Main 과 같은 밀도**를 쓴다 — 같은 제품인데
       목록에서 작성으로 넘어가면 글자가 갑자기 커지는 느낌을 없앤다.

       ⛔ **공통 `DESIGN-TOKENS` 블록을 고치지 마라.** 그 블록은 9개 화면에 글자까지
          같아야 하고(`check-design-tokens.py`), 여기서 고치면 나머지 8종이 함께
          끌려간다 — 아직 옮기지 않은 서식들이다. **이 파일의 지역 `:root`** 에서만 덮는다.
       ⛔ `html.big`(DESIGN-TOKENS 안)이 같은 이름을 더 높은 우선순위로 덮으므로
          **크게 보기 값은 그대로다.** 아래 값은 일반 보기에만 걸린다.
       ⚠️ 다른 7종으로 옮길 때는 이 묶음을 통째로 가져가라(`docs/PRODUCT_SKIN_v1.md`).

       ── 대응(허브 Main) ────────────────────────────────────────────────
         질문 28 ← CENTER 제목 30 · 설명 15 ← 리드 16 · 라벨 16 ← 리드 16
         카드 18/14 ← 민원명 19/14 · 입력 18 · CTA 17 ← CTA 18 · 보조 13 ← note 13.5 */
    --fs-question: 28px;    /* 34 → 28  시민에게 말하는 큰 질문 */
    --fs-lead:     18px;    /* 21 → 18  입력칸에 치는 글자 */
    --fs-label:    16px;    /* 18 → 16  항목 라벨 */
    --fs-card:     18px;    /* 20 → 18  선택 카드 제목 */
    --fs-card-sub: 14px;    /* 15 → 14  선택 카드 설명 */
    --fs-body:   15.5px;    /* 17 → 15.5  본문 기본 */
    --fs-help:     15px;    /* 17 → 15  「왜 묻는지」 */
    --fs-sum:      15px;    /* 16.5 → 15  최종 확인 요약 줄 */
    --fs-small:    13px;    /* 13.5 → 13  행정적 보조 설명 */
    /* 손끝 표적 — ⛔ `--touch-min`(48px) 아래로 내리지 않는다. 셋 다 그 위에 있다. */
    --touch-card:  116px;   /* 132 → 116 */
    --touch-field:  56px;   /* 64 → 56 */
    --btn-h:        56px;   /* 62 → 56 */
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;background:var(--zone);color:var(--ink);
    font-family:"Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
    font-size:var(--fs-body);line-height:1.55;
  }

  /* ===== 상단 바 =====
     왼쪽 기관 · 가운데 지금 쓰는 서식 이름 · 오른쪽 도구. 가운데를 비워 두면
     시민이 「내가 무슨 서류를 쓰고 있는지」를 확인할 자리가 없다. */
  /* ⚠️ 도구 칸을 `auto`(제 너비)로 두고 **기관명·서식 이름이 먼저 줄어들게** 한다.
     종전에는 `1fr auto 1fr` 이라 도구가 제 몫보다 넓어지면 **버튼이 두 줄로 접혔다**
     (2026.08.24 에 「크게 보기」를 더하면서 일곱 개가 되어 실제로 접혔다).
     버튼 폭을 깎아 맞추는 식은 **기관명 길이가 바뀌면 또 접힌다** — 이 배포본은
     기관마다 이름이 다르다(`rebrand.py`). 그래서 수치가 아니라 구조로 막는다.
     기관명·서식 이름에는 이미 말줄임(ellipsis)이 걸려 있어 줄어도 깨지지 않는다. */
  .topbar{
    /* ⚠️ 2026.08.28 — 3등분 격자를 버리고 **Shell 순서**로 바꿨다(`PRODUCT_SKIN_v1.md`).
       종전에는 서식 이름을 정중앙에 두려고 양옆을 `1fr` 로 잡았는데, 오른쪽 단추가
       하나만 늘어도 제목이 움직였다. 이제 제목은 **identity 옆 고정 슬롯**이다.
       ⚠️ `flex-wrap` 은 SITE-CONFIG 의 `.kb-help`(`order:9`)가 아랫줄에 붙게 한다. */
    display:flex;align-items:center;flex-wrap:wrap;gap:8px 18px;
    padding:0 28px;min-height:var(--m-bar-h);background:var(--head);   /* Main 과 같은 좌우 여백 */
    /* ⚠️ 허브 Main 과 **같은 구현**(2026.08.28 Product Shell v1) — `border-bottom`.
       종전에는 BAR 내용이 62px 을 꽉 채워 테두리를 두면 63px 이 돼 안쪽 그림자로 그렸는데,
       Shell 로 바꾸며 내용이 가벼워져(업무명 제거 · 작성예시 compact) 이제 62px 을 지킨다.
       ⚠️ 높이가 다시 63px 이 되면 이 줄이 아니라 **내용**을 줄여라. */
    border-bottom:1px solid var(--line-warm);
    position:sticky;top:0;z-index:20;
  }
  /* ⚠️ 2026.08.28 — 74px + 3px 대표색 그라데이션 띠를 **62px + 1px 선**으로 바꿨다(Main 과 같은 문법).
     ⛔ 그라데이션을 되살리지 마라. 좁은 Accent 라도 9개 화면에서 인상이 갈린다.
     ⚠️ 선 색은 이 단계에서 **기존 팔레트(`--line-warm`)** 를 그대로 쓴다 — 골격만 판정하려고
        색은 다음 단계로 미뤘다. 그때 `--m-border` 로 바뀐다.
  /* ── IDENTITY — 허브 Main 과 **글자까지 같은 lockup** ──
     ⛔ 여권만의 표기를 만들지 마라. 시민은 같은 키오스크에서 두 화면을 지난다. */
  .brand{display:flex;align-items:center;gap:11px;min-width:0;flex:0 0 auto;}
  .brand-tx{display:flex;align-items:center;gap:11px;min-width:0;}
  .brand b{font-size:var(--m-fs-brand);font-weight:var(--fw-heavy);color:var(--blue);
    letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand-div{width:1px;height:15px;background:var(--m-border);flex:0 0 auto;}
  .brand h1{margin:0;font-size:var(--m-fs-brand-sub);font-weight:500;color:var(--m-ink-sub);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* ⛔ BAR 에 업무명 슬롯을 두지 않는다(2026.08.28). 작성 영역이 이미 말한다 —
     같은 말을 두 번 하면 BAR 이 무거워지고, 상세페이지마다 길이가 달라져 흔들린다. */
  /* 빈 자리 — 여기가 늘어나고 줄어든다. ⛔ 무엇으로도 채우지 않는다 */
  .bar-space{flex:1 1 auto;min-width:8px;}
  .actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    justify-content:flex-end;padding:8px 0;}
  /* ── DATE — 허브 Main 과 **같은 규칙**(2026.08.28) ──
     ⚠️ Shell 로 옮기면서 이 규칙이 통째로 빠져 있었다. 스타일이 없어 본문 크기(17px)로
        나왔고, Main(13.5px·faint)과 눈에 띄게 달랐다. ⛔ 여기서 값을 새로 만들지 마라.
     ⚠️ 시계는 넣지 않는다 — 이 PC 는 날짜가 설치일로 원복되는 이력이 있다. */
  .today{font-size:var(--m-fs-meta);color:var(--m-ink-faint);white-space:nowrap;
    font-feature-settings:"tnum";}
  /* 담당자 도구 — 시민 단추보다 한 치수 작게(자리를 적게 먹는다) */
  /* Button Role ③ BAR utility(compact) — 담당자 도구. 한 치수 더 작다. */
  .topbar .btn.compact{font-size:13px;padding:7px 10px;}
  /* 상단 바의 버튼은 본문 버튼보다 한 치수 작다 — 한 줄에 들어가야 하고,
     시민이 누를 것은 본문에 있지 여기에 있지 않다(여기는 도구·담당자용이다).
     ⚠️ `nowrap` — 라벨이 버튼 안에서 두 줄로 접히면 상단 바 높이가 들쭉날쭉해진다. */
  /* Button Role ③ BAR utility — 허브 Main 의 BAR 단추와 같은 값(14px). */
  .topbar .btn{font-size:14px;padding:9px 12px;white-space:nowrap;}
  /* 선 아이콘. ⚠️ 허브(`index.html`)와 **같은 문법**이다 — 24 격자·굵기 1.7·둥근 끝.
     상단 바는 9개 화면에서 같아 보여야 하므로 한쪽만 고치지 마라. */
  .btn-ic{flex:0 0 auto;width:16px;height:16px;display:block;}
  /* ⚠️ 반경 10 → 6(`--m-r-btn`) · **그라데이션 제거**(2026.08.28 단계 4).
     ⛔ 높이·`disabled` 규칙·문구·순서는 건드리지 않았다. */
  /* Button Role ② 본문 단추 — 기본값. CTA(`.wiz-nav .btn`)와 BAR 가 이것을 덮는다. */
  .btn{display:inline-flex;align-items:center;gap:7px;
    font-family:inherit;font-size:15px;font-weight:700;border:1.5px solid var(--blue);
    background:var(--m-surface);color:var(--blue);border-radius:var(--m-r-btn);
    padding:10px 15px;cursor:pointer;
    transition:background var(--dur-quick) var(--ease-out),
               border-color var(--dur-quick) var(--ease-out);}
  .btn:hover{background:var(--m-a06);}
  .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);}
  .btn.primary:hover{background:var(--blue-dark);border-color:var(--blue-dark);}
  .btn.ghost{border-color:var(--m-border);color:var(--m-ink-sub);background:var(--m-surface);}
  .btn.ghost:hover{background:var(--m-bg);border-color:var(--m-border-mid);}
  .btn:disabled{opacity:.45;cursor:default;}

  /* ===== 3영역 레이아웃 (2026.08.21 디자인 개편) =====
     Writing Desk(질문) · Paper(서식) · Companion Rail(진행·준비물).
     세 면의 바탕색이 조금씩 달라 선을 긋지 않아도 영역이 갈린다.

     ⚠️ **높이·스크롤은 반드시 `@media screen` 안에 둔다.** 인쇄에 새어 나가면
        서식이 화면 높이에 잘려 나간다. 인쇄 블록은 `.layout{display:block}` 과
        `.form-col{position:static;max-height:none;overflow:visible}` 만 되돌린다.
     ⚠️ 질문면과 레일에 **`.panel-col` 을 함께 붙여 둔다.** 인쇄 CSS가 그 이름으로
        둘을 숨긴다 — 새 이름만 쓰면 안내면이 종이에 딸려 나간다. */
  /* ⚠️ 2026.08.28 — Main 과 **같은 프레임**(26/56/18)을 쓴다. 종전에는 공통 토큰
     `--cols`(2:3:1, 크게 보기에서 5:5:2)를 썼는데, Main 이 26/56/18 로 동결되면서
     같은 제품인데 페이지마다 기둥 폭이 달라 보였다.
     ⛔ `html.big` 이 `--cols` 를 5:5:2 로 덮지만 **여기서는 `--m-cols` 를 보므로 무시된다** —
        크게 보기에서 열 폭이 변하지 않는 것이 그래서다(결정 ②). */
  .layout{display:grid;gap:0;padding:0;max-width:none;margin:0;
    grid-template-columns:var(--m-cols);}
  .form-col{min-width:0;}
  .panel-col{min-width:0;}
  /* 화면을 꽉 채우되 **상단 바 높이를 숫자로 빼지 않는다.** 기관명이 길거나 화면이 좁아
     버튼이 두 줄로 접히면 그만큼 본문이 아래로 밀려 잘린다. body 를 세로 flex 로 두고
     본문이 남는 높이를 먹게 하면 상단 바가 몇 줄이 되든 어긋나지 않는다. */
  @media screen and (min-width:861px){
    body{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
    .topbar{flex:0 0 auto;position:static;}
    .layout{flex:1 1 auto;min-height:0;}
    .task-col,.form-col,.rail-col{height:100%;min-height:0;}
  }

  /* ===== 서식 영역(Paper) : 실제 서식 재현 ===== */
  /* 실제 서식 이미지 위에 값을 얹는 방식 (A4 규격 · 컬러 인쇄) */
  .paper{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 34px rgba(0,0,0,.10);
    width:210mm;margin:0 auto;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;}
  /* ⚠️ 아래는 전부 **화면 전용**이다. 서식 바닥색·모서리 선·폭 맞춤이 인쇄로 새면
     종이에 회색 바탕과 선이 찍힌다. `@media screen` 밖으로 내지 마라. */
  @media screen{
    .form-col{background:var(--zone);padding:16px 18px 20px;position:relative;overflow:auto;}
    /* ⚠️ 서식 자리를 가리키던 모서리 선 한 쌍(94px)을 걷었다(2026.08.28) —
       종이 자체가 이미 그 자리를 말한다. */
    /* 210mm 보다 좁은 자리에서도 서식이 잘리지 않게 폭을 맞춘다. 안의 값은 전부
       `%` 와 `cqw`(컨테이너 폭 기준)라 **비율이 그대로 유지된다** — 좌표가 밀리지 않는다. */
    .form-col .paper{width:min(210mm,100%);}
  }
  .stage{position:relative;width:100%;container-type:inline-size;}
  .stage .bg{display:block;width:100%;height:auto;}
  .ovl{position:absolute;inset:0;pointer-events:none;}
  /* 얹는 글자 = 검은 펜 느낌 */
  .ov{position:absolute;transform:translate(-50%,-50%);color:#111;font-weight:700;line-height:1;white-space:nowrap;}
  .ov.k{color:#000;font-weight:900;}          /* 체크 ✔ */
  .ov.t{transform:translateY(-50%);}           /* 좌측정렬 자유 텍스트(세로중앙; wrap 2줄도 칸 중앙) */
  .cover{position:absolute;background:#fff;pointer-events:none;
        -webkit-print-color-adjust:exact;print-color-adjust:exact;}  /* 원본 인쇄 안내문 완전히 가림 */
  .guide{position:absolute;transform:translateY(-50%);color:#c4c4c4;font-weight:400;white-space:nowrap;line-height:1;pointer-events:none;
        -webkit-print-color-adjust:exact;print-color-adjust:exact;}  /* 옅은 색으로 균일하게 다시 그린 안내문 */
  /* 지금 적고 있는 칸을 서식 위에서 가리키는 표시(화면 전용 · 인쇄 CSS가 숨긴다).
     바탕을 대표색에서 뽑은 옅은 색으로 두어 기관 색을 바꿔도 따라온다.
     ⛔ 노란색은 쓰지 않는다 — 서명란 형광(`.ovhi`)이 이미 노랑이라 뜻이 겹친다. */
  .ovhl{position:absolute;background:var(--focus-face);opacity:.66;
    outline:1px solid var(--focus-line);outline-offset:0;border-radius:var(--r-xs);pointer-events:none;}
  /* 형광펜 하이라이트(서명란): 항상 표시, 인쇄에도 유지. multiply로 밑 글자 살림 */
  .ovhi{position:absolute;background:var(--marker-sign);border-radius:4px;pointer-events:none;
    mix-blend-mode:multiply;-webkit-print-color-adjust:exact;print-color-adjust:exact;}

  /* 미리보기 모달 */
  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;flex-direction:column;padding:14px;}
  .modal-box{display:flex;flex-direction:column;height:100%;max-width:100%;margin:0 auto;}
  .modal-top{display:flex;justify-content:space-between;align-items:center;color:#fff;gap:10px;padding:4px 2px 10px;}
  .modal-top b{font-size:18px;}
  .modal-scroll{flex:1;overflow:auto;display:flex;justify-content:center;background:#5a5a5a;padding:12px;border-radius:var(--r-sm);}
  .modal-scroll .paper{width:min(210mm,94vw);height:max-content;box-shadow:0 4px 20px rgba(0,0,0,.4);}

  /* ===== 질문면(Writing Desk) =====
     종전에는 흰 「휴대전화」 카드를 배경 위에 얹었다. 그 은유는 손에 쥐는 화면의 것이라,
     서서 쓰는 큰 키오스크에서는 화면 한복판에 작은 종이가 떠 있는 꼴이 된다.
     이제 **작업면 자체가 화면**이고 질문이 그 위에 큰 활자로 놓인다. */
  /* ⚠️ 질문면이 흰 면이 되면서 바닥과의 명도차가 줄었다 — Main 처럼 **1px 실선**으로
     구역을 가른다(종전에는 따뜻한 회색끼리의 명도차가 그 몫을 했다). */
  .task-col{background:var(--work);border-right:1px solid var(--line-warm);}
  .task{display:flex;flex-direction:column;height:100%;min-height:0;
    padding:28px 40px 22px;position:relative;}
  /* 기하학적 포인트 — 머리글 아래를 지나는 선. 왼쪽 짧은 구간만 대표색이다.
     ⚠️ **머리글에 붙여 둔다.** 종전에는 질문면 위쪽의 고정 위치(`top:96px`)에 그렸는데,
        제목이 길거나 두 줄이 되면 그 선이 글자를 가로질렀다(첫 화면에서 바로 드러났다).
        흐름 안에 두면 무슨 글자가 오든 겹칠 수 없다. 두께도 1px → 2px 로 올려
        「흐릿하게 걸쳐 있는 것」이 아니라 「구분선」으로 읽히게 했다. */
  /* ⚠️ 2026.08.28 — 아래를 지나던 **2px 대표색 띠를 걷었다**(단계 3). 구분은 선이
     아니라 여백이 맡는다(Main 과 같은 문법). ⛔ 되살리지 마라 — 화면마다 색 띠가
     두세 줄씩 생기면 정작 질문이 묻힌다. */
  /* ══ ASK 상단 navigation · 하단 초기화 — **역할이 다른 두 단추** ══════════
     ⚠️ 뜻이 다르다 : 메인으로 = **이 업무를 나간다**(되돌릴 수 있다) ·
        처음부터 = **지금 적은 것을 전부 버린다**(`askConfirm` 으로 한 번 더 묻는다).
     ⚠️ 둘 다 **hover 없이도 누를 수 있는 것임이 보여야 한다** — 종전에는 글자만 떠 있어서
        터치 화면에서는 알 길이 아예 없었다(⛔ hover 의존 금지).
     ⚠️ 2026.08.29 — 뜻이 다르니 **계층도 갈랐다**(현장 의견).
        메인으로  = **Role ② 본문 단추**(대표색 테두리 · 대표색 글자 · 흰 면)
        처음부터  = **Role ④ Compact-Tertiary**(회색 테두리 · 잉크 글자) 그대로
        ⛔ 여기서 새 수치를 만들지 마라. 위 `.btn` 규격을 그대로 쓴다. */
  .ask-nav{flex:0 0 auto;margin-bottom:14px;}
  .nav-back,.reset-btn{display:inline-flex;align-items:center;justify-content:center;
    font-family:inherit;line-height:1;background:var(--m-surface);text-decoration:none;
    border-radius:var(--m-r-btn);cursor:pointer;
    transition:border-color var(--dur-quick) var(--ease-out),
               background var(--dur-quick) var(--ease-out),
               color var(--dur-quick) var(--ease-out);}
  /* Role ② 본문 단추 — BAR 의 [미리보기]와 **같은 family** 의 테두리 변형이다.
     ⛔ 채운 대표색(solid)으로 만들지 마라. 이 화면에서 **앞으로 가는 길은 [다음]**이고,
        위아래에 채운 파란 단추가 둘이면 어느 쪽이 진행인지 흐려진다. */
  .nav-back{gap:7px;font-size:15px;font-weight:var(--fw-bold);
    color:var(--blue);border:1.5px solid var(--blue);padding:10px 15px;}
  .nav-back:hover{background:var(--m-a06);}
  .nav-back .btn-ic{width:16px;height:16px;}
  /* Role ④ Compact-Tertiary — 되돌릴 수 없는 행동이라 **가장 조용하다** */
  .reset-btn{gap:7px;font-size:13.5px;font-weight:var(--fw-bold);
    color:var(--m-ink-sub);border:1px solid var(--m-border);padding:8px 13px;}
  .reset-btn .btn-ic{width:15px;height:15px;}
  html.big .nav-back{font-size:17.5px;padding:12px 18px;}
  html.big .nav-back .btn-ic{width:18px;height:18px;}
  html.big .reset-btn{font-size:15px;padding:9px 14px;}
  html.big .reset-btn .btn-ic{width:17px;height:17px;}

  .topline{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
    padding-bottom:15px;margin-bottom:26px;flex:0 0 auto;position:relative;}
  /* 화면 이름 = 지금 무엇을 묻는 묶음인지. 왼쪽 짧은 대표색 막대가 자리를 잡아 준다. */
  /* ⚠️ 왼쪽 3px 대표색 막대를 걷었다(2026.08.28). 제목은 색과 굵기로 충분히 선다. */
  .wiz-title{font-size:16px;font-weight:800;color:var(--blue-dark);
    position:relative;letter-spacing:-.01em;}
  .wiz-count{font-size:13.5px;font-weight:800;color:var(--muted);white-space:nowrap;}
  .wiz-body{flex:1 1 auto;min-height:0;overflow:auto;padding:0 2px 6px;}
  /* ── Human Handoff 자리 (2026.08.28 단계 6) ──
     질문 영역의 **바닥에 고정**된 보조 행동 영역. 질문이 길어 본문이 굴러도 남는다.
     ⚠️ 허브 Main 의 `.ask-foot` 과 같은 문법이다 — 위에 실선 하나로 갈라 둔다.
     ⛔ 이 화면에 탈출구가 없으면 **자리를 차지하지 않는다.** */
  .ask-foot{flex:0 0 auto;margin-top:10px;padding-top:12px;
    border-top:1px solid var(--m-border);}
  .ask-foot:empty{display:none;}
  /* 「처음부터 다시 작성」 — 파괴적 행동이라 **가장 조용한 톤**이다.
     ⚠️ Handoff(`.ask-foot`)와 시각 계층이 겹치면 안 된다 — 저기는 판/단추, 여기는 글자.
     ⛔ 눈에 띄게 만들지 마라. 잘못 누르면 시민이 처음부터 다시 적어야 한다. */
  /* Navigation Zone 의 셋째 줄 — [이전][다음] **아래**, 가운데. */
  .ask-reset{flex:0 0 auto;margin-top:10px;display:flex;justify-content:center;}
  /* 되돌릴 수 없는 행동이라 hover 에서만 경고색이 비친다(평소에는 조용하다). */
  .reset-btn:hover{border-color:var(--warn-line);background:var(--warn-face);color:var(--warn);}
  html.big .ask-reset{margin-top:8px;}
  .ask-foot .card-sub{margin:0;}
  .ask-foot .ask-box{margin:0;}

  /* ===== 안내 기둥(Companion Rail) =====
     진행 · 준비물 · 안심 안내. 질문에 답하는 동안 **눈을 돌리지 않아도** 지금 어디쯤인지와
     무엇을 꺼내 둬야 하는지가 늘 보이게 한다. 종전에는 이 정보가 패널 머리의 얇은 막대
     하나뿐이었고, 준비물은 아예 없었다. */
  .rail-col{background:var(--rail);border-left:1px solid var(--line-warm);}
  /* ⚠️ 여백은 **실측으로 정한 예산**이다(2026.08.28 단계 6). 미성년 경로 + 크게 보기가
     기준이고, 여기서 조금만 벌리면 진행·준비물이 화면 밖으로 밀린다. */
  .rail{display:flex;flex-direction:column;height:100%;min-height:0;overflow:auto;
    padding:20px 18px 16px;}
  /* 진행 머리 — 캡션(좌) + 큰 숫자(우)를 **한 줄에**(2026.08.28 단계 6).
     ⚠️ 두 줄이던 것을 한 줄로 묶어 23px 을 벌었다 — 준비물이 여섯 개인 미성년 경로에서
        그만큼이 기둥 안에 담기느냐 마느냐를 갈랐다. 정보는 그대로다. */
  .rail-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .rail-cap{font-size:12px;letter-spacing:.12em;color:var(--m-ink-muted);font-weight:800;}
  .rail-num{font-size:var(--fs-rail-num);font-weight:900;letter-spacing:-.04em;line-height:1.05;}
  .rail-num span{font-size:15px;color:var(--muted);font-weight:800;}
  .rail-now{font-size:14px;color:var(--blue-dark);font-weight:800;margin-top:5px;}
  .rail-steps{display:grid;gap:7px;font-size:var(--fs-rail-item);margin-bottom:22px;}
  .rail-step{display:grid;grid-template-columns:19px 1fr;gap:9px;align-items:center;
    color:#7b7f7d;background:none;border:0;padding:0;font-family:inherit;text-align:left;
    width:100%;line-height:1.35;}
  .ic-dot{display:block;width:12px;height:12px;}
  .rail-step .dot{width:17px;height:17px;border:1px solid var(--m-border-mid);border-radius:50%;
    display:grid;place-items:center;font-size:9px;background:#fff;}
  /* 지나온 묶음은 눌러서 되돌아갈 수 있다(앞으로 건너뛰기는 막는다 — 검증 우회 방지) */
  .rail-step.done{color:var(--m-ink-read);cursor:pointer;}
  .rail-step.done .dot{color:var(--blue-dark);border-color:var(--blue);}
  .rail-step.done:hover{color:var(--blue-dark);}
  .rail-step.now{font-weight:800;color:var(--ink);}
  .rail-step.now .dot{background:var(--blue);border-color:var(--blue);}
  .rail-rule{height:1px;background:var(--line-warm);margin:0 0 14px;}
  .rail-sec{margin-bottom:14px;}
  .rail-head{display:flex;align-items:center;gap:8px;font-size:var(--fs-rail-head);font-weight:900;margin-bottom:11px;}
  .rail-items{display:grid;gap:7px;}
  .rail-item{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;
    font-size:var(--fs-rail-item);line-height:1.45;color:var(--m-ink-read);}
  /* ── compact 준비물 (2026.08.28 단계 6) ──
     32px 아이콘판 + 이름 한 줄 + 조건 한 줄. ⛔ 조건이 두 줄이 되면 **문구를 줄인다** —
     칸을 키우면 미성년 경로에서 기둥이 넘친다(실측으로 정한 예산이다). */
  .rail-ic{width:30px;height:30px;border-radius:var(--m-r-card);
    background:var(--m-icon-bg);color:var(--m-ink-muted);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .ic-rail{display:block;width:19px;height:19px;}
  /* 꼭 필요한 것은 아이콘판이 대표색을 띤다 — 종전의 「✓」 글자를 대신한다 */
  .rail-item.req .rail-ic{background:var(--m-a10);color:var(--blue);}
  .rail-item b{display:block;font-weight:var(--fw-bold);color:var(--m-ink);line-height:1.35;}
  .rail-item .check{color:var(--m-border-mid);font-weight:900;}
  /* 꼭 필요한 것만 진하게. 나머지는 한 톤 내려 「없어도 되는 것」임이 눈에 보이게 한다. */
  .rail-item.req{color:var(--ink);font-weight:700;}
  .rail-item.req .check{color:var(--blue);}
  .rail-item small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px;font-weight:400;
    line-height:1.35;}   /* ⚠️ 조건 한 줄. 줄 간격이 예산에 직접 걸린다(단계 6 실측) */
  .rail-safe{margin-top:auto;border-top:1px solid var(--line-warm);padding-top:12px;}
  .rail-safe .rail-head{font-size:var(--fs-rail-item);margin-bottom:7px;}
  .rail-safe p{font-size:var(--fs-rail-note);line-height:1.55;color:var(--m-ink-read);margin:5px 0;}

  /* 질문 — 이 화면에서 가장 큰 글자. 어르신이 서서 보는 거리에서 한눈에 읽혀야 한다. */
  /* ══ 한국어 조판 (2026.08.28) ═══════════════════════════════════════════
     ⛔ **어절 중간에서 줄을 바꾸지 않는다.** 「신청하시나 / 요?」처럼 끊기면 읽는 사람이
        한 번 멈춘다. 브라우저 기본값은 한글을 글자 단위로 끊으므로 `keep-all` 로 막는다.
     ⚠️ 대신 아주 긴 **한 낱말**(로마자 이름·주소·전화번호)이 칸을 넘칠 수 있어
        `overflow-wrap:anywhere` 를 안전망으로 함께 둔다 — **그때만** 쪼갠다.
     ⛔ 문장마다 `<br>` 을 박아 개행을 맞추지 마라. 문구·글자 크기·기관명이 바뀌면
        그 자리가 어긋나고, `rebrand.py` 로 이름이 긴 기관에 가면 바로 깨진다.
     ⛔ 인쇄층(`.ov`·`.paper`)에는 걸지 않는다 — 거기는 좌표로 찍는 자리다.
        그래서 서식 기둥(`.form-col`)이 아니라 **읽는 두 기둥에만** 건다.
     ⚠️ 선택자를 나열하지 않고 기둥에 한 번 건다. 나열하면 화면이 늘 때마다 빠뜨리는
        자리가 생긴다 — 실제로 `.sug-note` 한 줄이 빠져 거기서만 어절이 쪼개졌다. */
  .task-col,.rail-col{word-break:keep-all;overflow-wrap:anywhere;}

  .coach-q{font-size:var(--fs-question);font-weight:var(--fw-heavy);line-height:1.28;letter-spacing:var(--ls-tight);
    margin:0 0 14px;max-width:var(--question-max);}
  /* 「왜 묻는지」 — 상자를 두르는 대신 왼쪽 선 하나로 조용히 붙인다. 상자가 많으면
     화면이 시끄러워져 정작 질문이 묻힌다.
     ⚠️ `display:flex` 로 두면 안 된다 — 안내문에 `<b>` 가 섞이는 화면이 있는데
        그것들이 저마다 flex 칸이 되어 한 문장이 세 토막으로 갈라진다. */
  .why-box{display:block;font-size:var(--fs-help);color:var(--m-ink-read);background:none;
    border:0;border-left:3px solid var(--line-warm);border-radius:0;
    padding:2px 0 2px 14px;margin:0 0 22px;line-height:1.6;max-width:var(--question-max);}
  /* 「왜 묻는지」 앞의 전구. ⚠️ 글줄 높이를 바꾸지 않게 크기를 못 박는다. */
  .why-box .ic{margin-right:7px;color:var(--m-ink-muted);}
  .why-box .ic .ic-svg{display:inline-block;vertical-align:-4px;width:19px;height:19px;}
  details.terms{margin-bottom:14px;border:1px dashed var(--line);border-radius:var(--r-md);padding:2px 12px;background:#fff;}
  details.terms summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--blue-dark);padding:9px 0;}
  details.terms .term{font-size:14px;color:#333;padding:7px 0;border-top:1px solid #eef1f5;line-height:1.55;}

  .fb{font-size:12.5px;border-radius:var(--r-sm);padding:2px 8px;font-weight:700;vertical-align:middle;white-space:nowrap;}
  /* ⚠️ 뜻은 그대로다 — 필수(Red) · 선택(중립) · 자동(대표색). 값만 눈금에 맞췄다. */
  .fb-req{color:var(--warn);background:var(--warn-face);border:1px solid var(--warn-line);}
  .fb-opt{color:var(--m-ink-read);background:var(--m-bg);border:1px solid var(--m-border);}
  .fb-auto{color:var(--blue);background:var(--m-a07);border:1px solid var(--m-a25);}
  /* 자동으로 채워지는 칸. ⛔ 흐릿하게(비활성처럼) 만들지 않는다 — 값은 또렷이 읽혀야 한다.
     면과 커서만 「지금 적는 칸이 아니다」를 말한다. */
  .text-input.ro{background:var(--m-bg);color:var(--m-ink);cursor:default;}

  .field{margin-bottom:21px;max-width:var(--question-max);}
  .field-label{display:block;font-size:var(--fs-label);font-weight:var(--fw-heavy);margin-bottom:9px;}
  .q-help{font-size:14px;color:var(--muted);margin:-2px 0 10px;line-height:1.5;}
  /* 작은 선택지(renderGroup) — 두 줄 목록. 지금 여권 화면은 큰 카드를 쓰지만,
     엔진 서식과 공유하는 구조라 스타일은 남겨 둔다. */
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .opt{display:flex;flex-direction:column;align-items:stretch;justify-content:center;
    font-family:inherit;text-align:left;min-height:60px;
    padding:14px 17px;border:1.5px solid var(--m-border-mid);
    background:var(--m-control);color:var(--m-ink);
    border-radius:var(--m-r-card);cursor:pointer;
    transition:border-color var(--dur-quick) var(--ease-out),
               background var(--dur-quick) var(--ease-out);}
  /* hover·포커스는 **얕게** — 고른 것과 헷갈리면 안 된다 */
  .opt:hover,.opt:focus-visible{border-color:var(--m-a35);background:var(--m-a06);}
  /* 고른 것 — 대표색 테두리 + 옅은 대표색 면 + 왼쪽 띠 */
  .opt.selected{border-color:var(--blue);background:var(--m-a10);
    box-shadow:inset 3px 0 0 var(--blue);}
  .opt-main{display:flex;align-items:center;gap:8px;}
  .opt-check{color:var(--blue);font-weight:800;visibility:hidden;}
  .opt.selected .opt-check{visibility:visible;}
  .opt-label{font-size:17px;font-weight:600;}
  .opt.selected .opt-label{color:var(--blue-dark);}
  .opt-rec{font-size:12px;color:#0a7a2f;background:#e7f6ec;border:1px solid #b6e3c4;border-radius:var(--r-sm);padding:2px 8px;margin-left:auto;}
  .opt-desc{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.45;}
  .opt.selected .opt-desc{color:#2c5aa0;}

  /* 글자 칸 — 물리 키보드로 친다. 키가 큰 편이라 칸도 크게 잡는다(높이 64px). */
  /* 적는 칸 — 흰 면 위에서 **적는 자리**임이 보이게 한 톤 내린 면 + 또렷한 테두리.
     ⚠️ 높이는 `--touch-field`(64/72px) 그대로다. 손끝 표적을 줄이지 않는다.
     ⚠️ 반경 12 → 8(`--m-r-card`)로 Main 계열에 맞췄다. */
  .text-input{width:100%;font-family:inherit;font-size:var(--fs-lead);font-weight:var(--fw-bold);
    height:var(--touch-field);padding:0 17px;color:var(--m-ink);
    border:1.5px solid var(--m-border-mid);border-radius:var(--m-r-card);
    background:var(--m-control);
    transition:border-color var(--dur-quick) var(--ease-out),
               background var(--dur-quick) var(--ease-out);}
  /* 적는 중 — 면이 희어지고 테두리가 대표색이 된다(「지금 여기」) */
  .text-input:focus{outline:none;border-color:var(--blue);background:var(--m-surface);}
  select.text-input{font-weight:700;}
  .hint{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.5;}

  /* 안내 상자들 — 질문면이 넓어져서 폭을 묶어 두지 않으면 한 줄이 너무 길어져 읽기 어렵다 */
  .warn-strong,.note-box,.info-box,.print-tip,.unsure-note,.sug-box,.manual-warn,
  .staff-list,.age-status,details.terms{max-width:var(--cards-max);}
  /* ⚠️ 값만 공통 토큰으로 모았다(2026.08.28). **뜻은 그대로** — Red 는 진행 불가·오류. */
  .warn-strong{background:var(--warn-face);border:1px solid var(--warn-line);color:var(--warn);border-radius:var(--r-md);
    padding:12px 14px;font-size:14px;line-height:1.6;margin-bottom:14px;}
  .note-box{background:var(--notice-face);border:1px solid var(--notice-line);color:var(--notice);border-radius:var(--r-md);
    padding:12px 14px;font-size:14px;margin-bottom:14px;line-height:1.55;}
  .info-box{background:var(--blue-light);border:1px solid var(--m-a25);color:var(--blue-dark);
    border-radius:var(--r-md);padding:12px 14px;font-size:14.5px;margin-bottom:14px;line-height:1.6;}
  /* 인쇄 설정 안내(여백 없음·배율 100%) — 화면 전용, 인쇄엔 안 나옴 */
  .print-tip{background:#fff4d6;border:2px solid #f0c040;color:#7a5600;border-radius:var(--r-md);
    padding:12px 14px;font-size:14.5px;line-height:1.6;margin-bottom:12px;}
  .print-tip b{color:#a12727;}
  .print-tip.modal{margin:10px 16px 0;}
  .unsure-note{background:var(--notice-face);border:1px solid var(--notice-line);color:var(--notice);border-radius:var(--r-md);
    padding:10px 12px;font-size:13px;margin-bottom:14px;}
  .sug-box{background:var(--m-a06);border:1px solid var(--m-a18);border-radius:var(--r-md);padding:12px 14px;margin-bottom:14px;}
  .sug-title{font-weight:700;font-size:14px;margin-bottom:8px;color:var(--blue-dark);}
  .sug-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:15px;}
  .sug-row b{font-size:16px;letter-spacing:1px;}
  /* Button Role ② 본문 단추(작은 것) — ⚠️ 굵기가 빠져 있어 400 으로 나오고 있었다. */
  .sug-btn{font-family:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--blue);
    background:var(--m-surface);color:var(--blue);border-radius:var(--m-r-btn);
    padding:6px 10px;cursor:pointer;}
  .sug-btn:hover{background:var(--blue);color:#fff;}
  .sug-note{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5;}

  .dunno-btn{width:100%;margin-top:4px;font-family:inherit;font-size:14.5px;font-weight:600;
    color:var(--m-ink-sub);background:var(--m-bg);border:1.5px dashed var(--m-border-mid);
    border-radius:var(--m-r-btn);padding:13px;cursor:pointer;}
  .dunno-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--m-surface);}

  /* 확인·완료 단계 */
  /* 최종 확인 — 표를 두르지 않고 가로선만으로 줄을 나눈다. 오른쪽에 「수정」을 두어
     인쇄 전에 그 자리에서 고치러 갈 수 있게 한다(되돌아가기만 허용). */
  .sum-list{border-top:1px solid var(--line-warm);margin-bottom:20px;max-width:var(--cards-max);}
  .sum-row{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:18px;align-items:center;
    padding:15px 2px;border-bottom:1px solid var(--line-warm);font-size:16px;}
  .sum-row .k{color:var(--muted);font-weight:700;font-size:14px;}
  .sum-row .v{font-weight:700;min-width:0;overflow-wrap:anywhere;}
  .sum-edit{border:0;background:none;font-family:inherit;font-size:13.5px;font-weight:800;
    color:var(--blue-dark);text-decoration:underline;text-underline-offset:4px;
    cursor:pointer;padding:6px 4px;}
  .sum-edit:hover{color:var(--blue);}
  .staff-list{background:#fffaf0;border:1px solid #e0b36a;border-radius:var(--r-md);padding:12px 14px;margin-bottom:14px;font-size:14px;color:#7a5600;}
  .staff-list .st{font-weight:700;margin-bottom:4px;}
  .staff-list ul{margin:6px 0 0;padding-left:20px;}
  .staff-list.ok{background:#f1faf3;border-color:#9cc7a6;color:#1e6b34;}

  .step-warn{flex:0 0 auto;margin:12px 0 0;background:var(--warn-face);border:1px solid var(--warn-line);
    color:var(--warn);border-radius:var(--r-md);padding:11px 14px;font-size:var(--fs-small);max-width:var(--question-max);}
  .step-warn:empty{display:none;}
  /* ══ ASK Navigation Zone (2026.08.28) ══════════════════════════════════
     [← 이전] [다음 →] **같은 크기의 한 쌍**, 그 아래에 조용한 tertiary 하나.
     ⚠️ 종전에는 `150px 1fr` 이라 [다음]이 세 배 넓었다. 강조는 **색과 면**이 하는 일이지
        크기가 하는 일이 아니다 — 두 단추가 같은 조형이어야 「짝」으로 읽힌다.
     ⛔ 어느 한쪽만 폭·높이·반경·글자를 달리하지 마라. 다른 것은 색뿐이다. */
  .wiz-nav{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;
    padding:20px 0 0;margin-top:auto;max-width:var(--question-max);}
  /* Button Role ① CTA — 이 화면에서 **가장 큰 단추**. 높이는 `--btn-h`(56/72px). */
  .wiz-nav .btn{padding:0 16px;height:var(--btn-h);font-size:17px;
    font-weight:var(--fw-heavy);border-radius:var(--m-r-btn);
    justify-content:center;line-height:1;}
  html.big .wiz-nav .btn{font-size:21px;}   /* ⛔ 크게 보기는 종전 값 그대로다 */

  /* 이용 안내 — 레일 맨 아래. 늘 읽는 글이 아니라 조용히 둔다. */
  .screen-notice{margin-top:14px;background:none;border:0;border-top:1px solid var(--line-warm);
    /* ⚠️ 이 목록은 허브 Main 의 「이용 안내」와 **같은 내용**이다 — 같은 잉크를 쓴다
       (2026.08.28 · 종전 #6a706d 하드코딩). */
    border-radius:0;padding:14px 0 0;font-size:12px;color:var(--m-ink-sub);}
  .screen-notice h3{margin:0 0 7px;font-size:13px;color:var(--blue-dark);}
  .screen-notice ul{margin:0;padding-left:16px;}
  .screen-notice li{margin:3px 0;line-height:1.45;}

  /* ══ 크게 보기 — 글자 (2026.08.28 단계 7) ═══════════════════════════════
     **프레임은 그대로, 읽어야 하는 글자만 크게.**
     ⛔ 열 비율(26/56/18) · BAR 62px · 종이 794×1122 는 건드리지 않는다.
     ⛔ 종이 안의 신청서 글씨는 **확대 대상이 아니다** — 크게 보기는 작성 UI 의
        가독성 기능이지 법정서식을 키우는 기능이 아니다.

     ⚠️ 이 파일에는 글자 크기가 **하드코딩된 자리가 많다**(2026.07 「어르신 가독성」
        블록의 유산). 공통 토큰(`--fs-*`)을 쓰는 것만 크게 보기에서 커지고 나머지는
        그대로였다 — 단계 제목·힌트·Handoff 문구·로마자 판·요약 항목명·안내 상자가
        전부 0% 였다(실측). 여기서 **역할별로** 올린다.

     ⚠️ 확대율은 역할이 정한다 — ASK(읽고 답하는 곳) +15~18% ·
        RAIL(곁눈으로 보는 곳) +5~12% · metadata 는 그대로.
        RAIL 을 일괄로 키우면 **미성년 + 기존 여권 = 준비물 6개**에서 기둥이 넘친다.
     ═══════════════════════════════════════════════════════════════════════ */

  /* ── 1순위 ASK — 읽고 답하는 글자 (+15~18%) ── */
  html.big .wiz-title{font-size:21px;}
  html.big .wiz-count{font-size:18px;}
  html.big .q-help{font-size:18.5px;}
  html.big .hint{font-size:18px;}
  html.big .why-box{font-size:20px;}      /* 공통 19 → 20 (+17.6%) — 1순위 읽는 글 */
  html.big .card-desc{font-size:17.5px;}  /* 공통 17 → 17.5 (+16.7%) */
  html.big .opt-label{font-size:22px;}
  html.big .opt-desc{font-size:18.5px;}
  html.big .opt-rec{font-size:15px;}
  html.big .fb{font-size:15px;}
  html.big .age-status{font-size:17.5px;}
  /* Handoff — 막힌 사람이 찾는 글자다. ASK 와 같은 비율로 키운다 */
  html.big .ask-tx b{font-size:18.5px;}
  html.big .ask-tx span{font-size:16px;}
  html.big .ask-btn{font-size:17.5px;}
  html.big .card-sub{font-size:18px;}
  html.big .ask-btn .btn-ic,html.big .card-sub .btn-ic{width:21px;height:21px;}
  /* 안내·경고 상자 */
  html.big .info-box{font-size:18.5px;}
  html.big .warn-strong,html.big .note-box{font-size:18px;}
  html.big .unsure-note,html.big .step-warn,html.big .staff-list{font-size:17px;}
  html.big .print-tip{font-size:18px;}
  html.big .sug-title{font-size:17.5px;}
  html.big .sug-row{font-size:18.5px;}
  html.big .sug-note{font-size:17px;}
  html.big .sug-btn{font-size:17px;}
  html.big .dunno-btn{font-size:18px;}
  /* 로마자 화면 — 참고 판과 입력 판 (1열이라 폭에 여유가 있다) */
  html.big .roman-h{font-size:18.5px;}
  html.big .roman-p{font-size:16px;}
  html.big .roman-state{font-size:15.5px;}
  /* 최종 확인 */
  html.big .sum-row .k{font-size:17.5px;}
  html.big .sum-edit{font-size:17px;}
  html.big details.terms summary,html.big details.terms .term{font-size:18px;}

  /* ── 3순위 RAIL — **차등**으로 올린다 ──
     ⛔ 일괄 +17~21% 금지(사용자 지시). 곁눈으로 보는 자리이고, 여기가 넘치면
        진행·준비물이 화면 밖으로 밀린다. 공통 토큰이 주는 값보다 **낮춰** 잡는다. */
  html.big .rail-num{font-size:37px;}          /* 공통 38 → 37 (+12%) */
  html.big .rail-now{font-size:15.5px;}        /* 14 → 15.5 (+11%) */
  html.big .rail-step{font-size:15px;}         /* 공통 15.5 → 15 (+11%) */
  html.big .rail-head{font-size:16.5px;}       /* 공통 17 → 16.5 (+10%) */
  html.big .rail-item b{font-size:15px;}       /* 준비물명 13.5 → 15 (+11%) */
  html.big .rail-item small{font-size:12.3px;} /* 준비물 조건 11.5 → 12.3 (+7%) */
  html.big .rail-safe p{font-size:13.3px;}     /* 공통 14 → 13.3 (+6%) */
  html.big .screen-notice{font-size:13.2px;}   /* 12.5 → 13.2 (+6%) */
  html.big .screen-notice h3{font-size:14px;}
  /* metadata 는 그대로 — 읽는 글이 아니라 있는 것을 확인하는 자리다 */
  html.big .rail-cap{font-size:12px;}

  /* ── 2순위 버튼 — 글자만. ⛔ 높이·터치 표적(`--btn-h`·`--touch-*`)은 손대지 않는다 ──
     ⚠️ 상단 바 버튼은 **키우지 않는다.** BAR 62px 안에서 이미 `.actions` 가 62px 이라
        글자를 키우면 바가 밀린다(BAR 62 불변). 시민이 누르는 것은 본문 [다음]이다. */

  /* ── 크게 보기의 RAIL 여백 (2026.08.28 단계 6) ──
     ⚠️ 글자가 커지면 같은 내용이 25px 더 든다(미성년 경로 실측). **글자는 그대로 두고**
        묶음 사이의 숨만 줄여 기둥 안에 담는다 — 스크롤이 생기면 진행·준비물이 밀린다.
     ⛔ 크게 보기의 글자 크기는 단계 7 소관이다. 여기서 건드리지 마라. */
  html.big .rail{padding:16px 16px 14px;}
  html.big .rail-sec{margin-bottom:10px;}
  html.big .rail-items{gap:5px;}   /* ⚠️ 단계 7 에서 글자가 커진 만큼 여백을 3px 더 조였다 */
  html.big .rail-steps{gap:6px;}
  html.big .rail-rule{margin:0 0 10px;}
  /* ⚠️ 크게 보기에서 준비물 여섯 개(미성년 + 기존 여권)가 19px 넘쳤다 —
     **글자 크기는 그대로 두고 줄 간격만** 좁혀 담는다(단계 7 소관과 겹치지 않게). */
  html.big .rail-item b{line-height:1.25;}
  html.big .rail-item small{line-height:1.3;}
  html.big .rail-safe p{margin:4px 0;}
  html.big .screen-notice{margin-top:12px;}

  /* 모바일 전용: 질문면 안에서 완성된 서식을 확인하는 버튼 (넓은 화면에선 숨김) */
  .m-preview{display:none;flex:0 0 auto;width:100%;margin:12px 0 0;max-width:var(--question-max);
    font-family:inherit;font-size:16px;font-weight:700;
    border:1.5px solid var(--blue);background:#fff;color:var(--blue);
    border-radius:var(--r-md);padding:13px;cursor:pointer;}
  .m-preview:hover{background:var(--blue-light);}

  /* ===== 반응형 =====
     넓은 가로 화면(민원실 키오스크) = 질문 + 서식 + 안내 기둥 3영역.
     세로 화면(1080×1920) = 위아래로 눕히고 기둥은 가로 띠로 접는다.
     좁은 화면(어르신 스마트폰 등) = 질문만, 서식은 [미리보기]로 확인.

     ⚠️ 여기 규칙은 전부 `@media screen` 으로 감싼다. 높이·스크롤·바탕색이 인쇄로
        새면 서식이 화면 높이에 잘리거나 종이에 회색이 깔린다. */

  /* 상단 바가 두 줄로 접히면 그만큼 본문이 좁아진다. 폭이 넉넉하지 않을 때는
     담당자용 「테스트용」 꼬리표부터 뗀다 — 버튼 이름만으로도 무엇인지 알 수 있다.
     (세로 키오스크 1080 폭에서 여섯 개가 한 줄에 들어가느냐가 여기서 갈린다.) */
  @media screen and (max-width:1400px){
    /* 「민원 서식 작성 도우미」는 가운데 서식 이름 아래에도 적혀 있다. 좁을 때는 한 벌만 남긴다. */
    .brand .meta{display:none;}
  }

  /* 좁은 화면(스마트폰·웹 배포본) — 서식을 숨기고 질문만 남긴다 */
  @media screen and (max-width:860px){
    body{background:var(--work);}            /* 서식이 없으니 서식 바닥색을 깔 이유도 없다 */
    .layout{grid-template-columns:minmax(0,1fr);height:auto;}
    .form-col{display:none;}                 /* 모바일: 서식 숨김 */
    .rail-col{display:none;}                 /* 진행은 질문면 머리의 N/M 표기로 대신한다 */
    .task-col{height:auto;}
    .task{height:auto;padding:22px 18px 18px;}
    .topline{margin-bottom:20px;}
    .coach-q{font-size:26px;}
    .wiz-body{overflow:visible;}
    .m-preview{display:block;}                /* 모바일 전용 미리보기 버튼 노출 */
    .wiz-nav{grid-template-columns:1fr 1fr;}
    /* ⚠️ 카드 격자(`.cards`·`.ready-grid`·`.card`)는 여기서 못 고친다 — 그 규칙이
       이 파일 **아래쪽**에 있어 나중에 덮인다. 스타일시트 맨 끝의 「좁은 화면 되돌림」
       블록에서 고친다. */
    /* 상단바 간결화 — 격자로 두면 버튼 묶음이 줄지 않아 화면 밖으로 밀려난다.
       가로로 흐르게 두고 자리가 모자라면 접히게 한다. */
    .topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;
      padding:10px 14px;min-height:0;}
    .brand{flex:1 1 auto;}
    .actions{flex:0 1 auto;padding:0;}
    .brand b{font-size:16px;}
    #btnSampleAdult,#btnSampleMinor{display:none;}   /* 테스트용 작성예시는 모바일에서 숨김 */
  }

  /* 세로 화면(1080×1920 키오스크) — 두 단을 그대로 세우면 서식이 오른쪽으로 잘린다.
     (2026.08.19 디자인 검토 자료의 「아는 문제」가 이것이다.)
     질문을 위, 서식을 아래로 눕히고 안내 기둥은 머리맡 가로 띠로 접는다.
     준비물은 「작성 전 준비물」 화면에서 이미 한 번 안내하므로 띠에서는 진행만 남긴다. */
  @media screen and (min-width:861px) and (max-aspect-ratio:9/10){
    .layout{grid-template-columns:minmax(0,1fr);
      grid-template-rows:auto minmax(0,1fr) minmax(0,1.15fr);}
    /* 띠를 **맨 위**로 올린다. DOM 순서는 질문 → 서식 → 기둥이라 그대로 두면
       진행 표시가 화면 맨 아래로 내려가 눈에 띄지 않는다. */
    .rail-col{order:1;border-left:0;border-bottom:1px solid var(--line-warm);height:auto;}
    .task-col{order:2;}
    .form-col{order:3;}
    .rail{flex-direction:row;align-items:center;gap:24px;padding:11px 24px;overflow-x:auto;}
    .rail-prog{display:flex;align-items:center;gap:16px;flex:0 0 auto;}
    .rail-cap{display:none;}
    .rail-num{margin:0;font-size:26px;white-space:nowrap;}
    .rail-now{margin:0;white-space:nowrap;}
    .rail-steps{display:flex;gap:15px;margin:0;}
    .rail-step{white-space:nowrap;}          /* 세로 화면에서 「신청인 정 보」로 접히는 것을 막는다 */
    .rail-info,.rail .screen-notice{display:none;}
    .task{padding:24px 34px 18px;}
  }

  /* 넓은 가로 화면 — 질문·서식·기둥 3영역.
     기본은 질문이 왼쪽, `body.form-left` 면 서식이 왼쪽으로 간다.
     ⚠️ form-left 는 키오스크 환경설정(Ctrl+Shift+S)이 로드 시 body 에 얹는다 — 지우지 마라.
     화면의 「↔ 좌우 바꾸기」 버튼은 2026.08.15 에 없앴다(시민이 눌러 뒤집으면 뒷사람이 혼란).
     안내 기둥은 어느 쪽으로 뒤집어도 **가장자리에 그대로 둔다** — 늘 같은 자리에 있어야
     시민이 진행 표시를 찾아 헤매지 않는다. */
  @media screen and (min-width:861px) and (min-aspect-ratio:9/10){
    .task-col{order:1;} .form-col{order:2;} .rail-col{order:3;}
    body.form-left .task-col{order:2;}
    body.form-left .form-col{order:1;}
    /* 서식을 왼쪽에 두는 기관 설정. **비율은 그대로** 뒤집기만 한다(56/26/18).
       ⚠️ 종전 고정폭(1.08fr 1fr 252px)은 26/56/18 과 어긋나 서식이 좁은 칸에 들어갔다. */
    body.form-left .layout{grid-template-columns:var(--m-cols-left);}
  }
  /* 좁은 가로(노트북 등) — 기둥과 여백을 줄여 질문 폭을 지킨다 */
  @media screen and (min-width:861px) and (max-width:1379px) and (min-aspect-ratio:9/10){
    /* ⚠️ 좁은 가로에서도 **비율은 같다**(`fr` 이라 저절로 줄어든다). 여백·글자만 줄인다. */
    .layout{grid-template-columns:var(--m-cols);}
    body.form-left .layout{grid-template-columns:var(--m-cols-left);}
    .task{padding:24px 28px 18px;}
    .coach-q{font-size:29px;}
    .rail{padding:22px 16px 16px;}
  }

  /* ===== 인쇄: 서식 이미지+값만, A4 꽉 채움 ===== */
  @media print{
    @page{size:A4 portrait;margin:0;}
    html,body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .topbar,.panel-col,.screen-notice,.modal-top,.ovhl,.print-tip{display:none !important;}
    .layout{display:block;padding:0;margin:0;max-width:none;}
    .form-col{display:block !important;width:100%;position:static;max-height:none;overflow:visible;}   /* 모바일에서 숨겼어도 인쇄 시 서식 표시(화면용 고정·스크롤 해제) */
    /* ⛔ 미리보기 모달은 **인쇄에서 제외**하고 언제나 좌측 서식을 찍는다 (나머지 7종과 같다).
       예전에는 모달이 열려 있으면 모달 안의 사본을 찍고 좌측을 숨겼는데, 그러면 **백지가 나왔다**
       (2026.08.13 현장 신고 — 「미리보기 → 인쇄」만 아무것도 안 나옴).
       모달은 화면용 flex 레이아웃이다: 인쇄에서 `.modal-scroll` 이 `display:flex`·`flex-basis:0%`
       인 채로 남는데, 그 안의 `.paper{width:100%}` 는 기댈 폭이 없어 **0 으로 붕괴**한다.
       실측: modal-scroll h=0 · paper w=0 h=0 → 값 66개가 다 0px 안에 갇힌다.
       미성년(2쪽) 건만 우연히 멀쩡했다 — 동의서의 글자가 내재 폭을 만들어 줘서 붕괴를 면했다.
       모달의 값은 좌측 서식과 같은 `renderForm()` 이 채우므로, 좌측을 찍으면 내용은 동일하다. */
    .modal-back{display:none !important;}
    .paper{box-shadow:none !important;width:100% !important;margin:0;}
    .ov{color:#000 !important;}
    /* 첨부서류(동의서/위임장)는 새 쪽(2쪽)에서 시작 */
    body.needs-consent .consent-page,body.needs-proxy .proxy-page{page-break-before:always;break-before:page;}
    /* 창구 안내표를 인쇄할 때는 **안내표만** 찍는다. 신청서·동의서가 딸려 나가면
       개인정보가 그대로 인쇄되고(§19 위반), 서식 용지도 낭비된다. */
    body.print-slip .paper{display:none !important;}
    body.print-slip .slip-page{display:block !important;page-break-before:auto;}
  }

  /* ===== 어르신 가독성 강화(2026-07-09): 큰 글씨·고대비·또렷한 포커스 ===== */
  /* ⚠️ 2026.08.28 — 종전 `#495059` 하드코딩을 잉크 계층으로 옮겼다. 값은 거의 같고
     (#4b5563) 이제 Main·허브와 **같은 눈금**을 쓴다. */
  :root{ --muted:var(--m-ink-read); }
  /* ⚠️ 2026.08.28 — 이 블록이 **위의 토큰을 되올리던 자리**다. 값만 Main 밀도로 내렸다.
     ⛔ 선택자를 지우지 마라 — 지우면 앞쪽 규칙(더 큰 값)이 살아나 원위치된다.
     ⛔ `html.big` 이 같은 선택자를 더 높은 우선순위로 덮으므로 **크게 보기는 그대로**다. */
  .wiz-count{font-size:13.5px;}
  .why-box{font-size:var(--fs-help);}
  .q-help{font-size:14px;}
  .opt-label{font-size:17px;}
  .opt-desc{font-size:14px;}
  .opt-rec{font-size:12px;}
  .hint{font-size:14px;}
  .info-box{font-size:14.5px;}
  .warn-strong{font-size:14.5px;}
  .note-box{font-size:14.5px;}
  .unsure-note{font-size:13.5px;}
  .step-warn{font-size:13.5px;}
  .sum-row{font-size:var(--fs-sum);}
  .staff-list{font-size:14px;}
  details.terms summary{font-size:14px;}
  details.terms .term{font-size:14px;}
  .sug-title{font-size:14px;}
  .sug-row{font-size:15px;}
  .sug-note{font-size:13.5px;}
  .sug-btn{font-size:13.5px;padding:8px 12px;}
  .screen-notice{font-size:12.5px;}      /* 안내 기둥 아래에 조용히 놓인다 */
  .screen-notice h3{font-size:13px;}
  .fb{font-size:13px;}

  /* 또렷한 키보드 포커스 링(어르신·키보드 사용자) */
  .btn:focus-visible,.opt:focus-visible,.text-input:focus-visible,.dunno-btn:focus-visible,
  .m-preview:focus-visible,.sug-btn:focus-visible,.card:focus-visible,
  .card-sub:focus-visible,.rail-step:focus-visible,.sum-edit:focus-visible{
    /* ⚠️ 기관 대표색을 따른다(종전 `#2b7fff` 하드코딩 — 초록 기관에서도 파란 링이 남았다) */
    outline:3px solid var(--blue);outline-offset:2px;
  }
  /* ⚠️ 포커스 링을 **기관 대표색에서 뽑는다**(종전 `rgba(43,127,255,.22)` 하드코딩).
     대표색을 초록으로 바꾼 기관에서 파란 링만 남던 문제를 없앤다. */
  .text-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--m-a25);}

  /* 주민등록번호 입력칸 바로 아래의 되짚기.
     확인은 조용한 한 줄, **어긋남은 눈에 띄는 빨간 판**으로 낸다 — 종전에는 이 자리에
     노란 안내(5년 자동적용·동의서)가 있고 정작 고쳐야 할 경고는 화면 맨 아래에 있었다. */
  .age-status{font-size:14px;margin:-2px 0 16px;line-height:1.55;}
  .age-status:empty{margin:0;}
  .age-status.ok{color:#1b7a34;font-weight:700;}
  .age-status.bad{background:#fdecec;border:1px solid #f0a5a5;border-left:5px solid #c0392b;
    color:#a11c1c;font-weight:700;border-radius:var(--r-md);padding:12px 14px;font-size:14.5px;}

  /* ===== 터치 카드 (2026.08.18 개편 · 2026.08.21 두 칸 배치로) =====
     손가락으로 한 번에 고르게 한다. 세로 목록이던 것을 **두 칸 격자**로 바꿔
     한 화면에 선택지가 다 들어오게 했다 — 스크롤해서 찾는 일이 없어야 한다.
     물리 키보드는 함께 두므로 글자 입력칸은 종전 것을 그대로 쓴다. */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:2px 0 18px;max-width:var(--cards-max);}
  /* 홀수 번째 마지막 카드는 한 줄을 다 쓴다 — 반쪽만 남아 어색해지는 것을 막고,
     대개 그 자리에 오는 「잘 모르겠습니다」 같은 탈출구가 눈에 잘 띈다. */
  .cards>.card:last-child:nth-child(odd){grid-column:1 / -1;}
  /* 손가락으로 고르는 큰 카드. ⚠️ 표적 크기(`--touch-card` 132/150px)는 그대로다.
     ⛔ 그림자를 두르지 않는다 — 눌리는 것은 면과 테두리로 말한다(Main 과 같은 문법). */
  .card{display:flex;flex-direction:column;align-items:flex-start;gap:11px;width:100%;
    min-height:var(--touch-card);padding:20px 22px;
    background:var(--m-control);border:1.5px solid var(--m-border-mid);
    border-radius:var(--m-r-row);text-align:left;cursor:pointer;font-family:inherit;
    transition:border-color var(--dur-quick) var(--ease-out),
               background var(--dur-quick) var(--ease-out),
               box-shadow var(--dur-quick) var(--ease-out);}
  .card:hover,.card:focus-visible{border-color:var(--m-a35);background:var(--m-a06);}
  /* 고른 카드 — 왼쪽 띠 한 줄이 「이것을 골랐다」를 말한다(선택 상태는 hover 보다 진하다) */
  .card.picked{border-color:var(--blue);background:var(--m-a10);
    box-shadow:inset 3px 0 0 var(--blue);}
  /* ⚠️ 이모지 대비책으로 `font-size` 를 남겨 둔다. 표에 없는 이모지가 오면 그것이 쓰인다. */
  .card-ic{font-size:30px;line-height:1;flex:0 0 auto;color:var(--m-ink-muted);}
  /* 선 아이콘 — 24 격자를 28px 로 그린다(카드 크기는 그대로다).
     ⚠️ 색은 **잉크**를 따른다. 고른 카드에서만 대표색이 된다. */
  .card-ic .ic-svg{display:block;width:28px;height:28px;}
  .card:hover .card-ic,.card:focus-visible .card-ic{color:var(--blue);}
  .card.picked .card-ic{color:var(--blue);}
  /* 글줄 안에 섞이는 작은 아이콘(안내 상자·묶음 머리) */
  .ic-sm{display:inline-block;vertical-align:-3px;width:18px;height:18px;flex:0 0 auto;}
  .card-tx{display:flex;flex-direction:column;gap:7px;min-width:0;}
  .card-label{font-size:var(--fs-card);font-weight:var(--fw-heavy);color:var(--ink);line-height:1.28;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .card-rec{font-size:12px;font-weight:700;color:#fff;background:var(--blue);
    border-radius:var(--r-pill);padding:2px 9px;}
  .card-desc{font-size:var(--fs-card-sub);color:var(--muted);line-height:1.5;}
  /* 준비물 판 — 카드와 같은 격자에 놓되 **누르는 것이 아님**이 드러나게 결을 달리한다
     (테두리 없음 · 흰 바탕 아님 · 커서 그대로). */
  .ready-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:2px 0 20px;max-width:700px;}
  .ready-tile{display:flex;flex-direction:column;gap:5px;padding:15px 18px;
    background:#fff;border:1px solid var(--line-warm);border-radius:var(--r-md);}
  /* 꼭 필요한 것은 왼쪽에 대표색 띠를 세워 목록에서 먼저 눈에 걸리게 한다 */
  .ready-tile.req{border-left:4px solid var(--blue);padding-left:15px;}
  .ready-tile b{font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ready-tile>span{font-size:13.5px;color:var(--muted);line-height:1.45;}
  .ready-req{font-size:11.5px;font-weight:800;color:#fff;background:var(--blue);
    border-radius:var(--r-pill);padding:2px 9px;}
  .ready-opt{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--work);
    border:1px solid var(--line-warm);border-radius:var(--r-pill);padding:1px 8px;}
  /* 로마자 화면 — 왼쪽 참고 · 오른쪽 입력. 비교하면서 적는 자리다. */
  /* ⚠️ 2026.08.28 단계 4 — **두 칸을 한 칸으로.** 질문면이 495px 이 되면서 두 칸으로는
     한 칸이 240px 밖에 안 돼 「영문 이름 (Given name)」 같은 라벨이 접히고, 참고 예시와
     입력칸을 **동시에** 읽기 어려웠다. 한 칸이면 위에서 아래로 읽는 순서가 그대로다 —
     ① 이렇게 적는 것이 보통입니다(참고) → ② 그래서 이렇게 적겠습니다(입력).
     ⚠️ 세로로 길어지는 것은 받아들인 결과다. 목적은 스크롤 수치가 아니라 **읽히는 것**이다. */
  .roman-cols{display:grid;grid-template-columns:1fr;gap:12px;margin:2px 0 16px;
    max-width:var(--cards-max);align-items:start;}
  .roman-side{background:var(--m-control);border:1px solid var(--m-border);
    border-radius:var(--m-r-card);padding:16px 18px;}
  .roman-side.warn{background:#fff8f6;border-color:#f0c3b8;border-left:4px solid #c0392b;padding-left:17px;}
  .roman-h{font-size:15px;font-weight:800;margin-bottom:8px;}
  .roman-side.warn .roman-h{color:#a11c1c;}
  .roman-p{font-size:13.5px;line-height:1.55;color:var(--muted);margin:0 0 12px;}
  .roman-side .field{margin-bottom:6px;max-width:none;}
  /* ⛔ 로마자 화면만 입력칸·라벨을 다르게 두지 않는다(2026.08.28). 두 칸이던 시절
     폭이 좁아 깎아 둔 값인데, 1열이 된 뒤로는 이유가 없어졌다. 값이 갈리면
     **같은 「이름 적는 칸」이 화면마다 달라 보인다** — 한 입력 체계로 되돌린다.
     (크게 보기 예외 `html.big .roman-side …` 도 함께 걷었다) */
  /* 적은 글자의 상태. 「사용 가능」이라 하지 않는다 — 접수 가능 여부는 창구가 판단한다. */
  .roman-state{font-size:13px;font-weight:700;line-height:1.5;margin:7px 0 14px;min-height:1px;}
  .roman-state:empty{margin:0 0 14px;}
  .roman-state.ok{color:#1b7a34;}
  .roman-state.bad{color:#c0392b;}
  /* 판 안에 또 판을 두르면 답답하다 — 예시 상자의 테두리·바탕을 벗기고 줄만 남긴다 */
  .roman-side .sug-box{background:none;border:0;border-radius:0;padding:0;margin:0;max-width:none;}
  /* 판 제목이 이미 「참고용 권장 로마자 예시」다 — 상자 안의 같은 말은 지운다 */
  .roman-side .sug-title{display:none;}
  .roman-side .sug-row{display:flex;align-items:center;gap:10px;margin:0 0 10px;
    background:var(--work);border:1px solid var(--line-warm);border-radius:var(--r-md);padding:11px 13px;}
  .roman-side .sug-row b{margin-right:auto;font-size:18px;letter-spacing:1px;}
  .roman-side .sug-note{margin-top:2px;}
  .roman-side .note-box,.roman-side .warn-strong{margin-bottom:0;}
  /* 도움 판 — 헷갈릴 때 직원을 부르는 길. 점선 한 줄로 숨기지 않는다.
     ⚠️ 2026.08.28 — **가로 한 줄에서 두 줄 격자로.** 질문 기둥이 495px 인데 아이콘·글·
        단추를 한 줄에 늘어놓으니 글이 들어갈 폭이 220px 밖에 안 남아 제목이 세 줄로
        접혔다(어절을 지키면서는 더 접힌다). 이제 위는 [아이콘][제목·설명],
        아래는 **폭을 다 쓰는 단추**다 — 줄 모양(`.card-sub`)과 같은 결이 된다.
     ⛔ 다시 한 줄로 되돌리지 마라. 기관명·문구가 길어지면 그때 또 접힌다. */
  .ask-box{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;
    align-items:start;max-width:820px;margin-top:6px;
    background:#fff8ec;border:1px solid #f0d9ae;border-radius:var(--r-lg);padding:15px 18px;}
  .ask-ic{font-size:26px;line-height:1;flex:0 0 auto;color:var(--blue);}
  .ask-ic .ic-svg{display:block;width:24px;height:24px;}
  .ask-tx{min-width:0;}
  /* ══ Human Handoff Component Family (2026.08.28) ═══════════════════════
     같은 뜻(「막혔을 때 직원을 부른다」)에 **판**과 **줄** 두 모양이 있다. 내용량이
     다를 뿐이므로 **조형은 하나**로 둔다 — 글자 눈금·반경 12·아이콘 18·눌림 반응.
     ⚠️ 톤(판=따뜻한 노랑 · 줄=중립)은 **이번 범위 밖**이다. 색은 Color & Visual
        Polish 에서 Main 과 함께 본다(`docs/PRODUCT_SKIN_v1.md`).
     ⛔ 무엇을 낼지·눌렀을 때 어디로 가는지(`toCounter`)는 건드리지 않았다. */
  .ask-tx b{display:block;font-size:15.5px;font-weight:800;color:#6b4200;}
  .ask-tx span{display:block;font-size:13.5px;color:#7a5f36;margin-top:3px;line-height:1.45;}
  /* Handoff 안의 행동 — Button Role ② 본문 단추(반경 6). */
  .ask-btn{grid-column:1 / -1;width:100%;font-family:inherit;font-size:14.5px;font-weight:800;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    color:var(--blue-dark);background:#fff;border:1.5px solid var(--line-strong);
    border-radius:var(--m-r-btn);padding:11px 15px;
    transition:border-color var(--dur-quick) var(--ease-out),
               color var(--dur-quick) var(--ease-out);}
  .ask-btn:hover{border-color:var(--blue);color:var(--blue);}
  .ask-btn .btn-ic{width:18px;height:18px;}
  /* 줄 모양 — 판과 **같은 family**. ⚠️ `display:block` 이라 아이콘이 글줄에 어긋나 있었다. */
  .card-sub{display:flex;align-items:center;justify-content:center;gap:9px;
    width:100%;max-width:700px;margin-top:4px;padding:14px 16px;
    font-family:inherit;font-size:15px;font-weight:700;color:#5f6667;background:none;
    border:1px dashed var(--line-strong);border-radius:var(--r-lg);cursor:pointer;
    transition:border-color var(--dur-quick) var(--ease-out),
               color var(--dur-quick) var(--ease-out),
               background var(--dur-quick) var(--ease-out);}
  .card-sub:hover{border-color:var(--blue);color:var(--blue-dark);background:#fff;}

  function toHsl(hex){

.opts.row .opt-main{justify-content:center;}
/* 반 칸짜리 입력 두 개를 나란히.
   ⚠️ `inline-block + 인접 선택자`로는 **셋째부터 짝이 어긋난다**(모든 뒤 형제가 왼쪽 여백을
      받아 한 칸씩 밀린다 — 실제로 성(한자)·이름(한자)가 세로로 섰다). 질문면을 감싸는
      쪽을 flex 로 두면 브라우저가 알아서 두 개씩 접는다. */
.wiz-body{display:flex;flex-wrap:wrap;align-content:flex-start;gap:0 14px;}
.wiz-body>*{flex:1 1 100%;min-width:0;}
.wiz-body>.field.half{flex:0 1 calc(50% - 7px);}

/* 선택사항 공통 안내(`OPT_HINT`) — 설명과 같은 글줄 문법에 한 톤 옅게.
   ⛔ 색·아이콘으로 강조하지 마라. 눈에 띄면 필수 칸까지 「비워도 되나」로 읽힌다. */
.q-help.opt-hint{color:#7a8088;margin-top:-6px;}

/* 요약 — 엔진은 `.val`, 여권은 `.v` */
.sum-sec{margin-bottom:18px;}
.sum-sec h4{margin:0 0 8px;font-size:15px;font-weight:800;color:var(--blue-dark);}
.sum-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:baseline;
  padding:11px 2px;border-bottom:1px solid var(--line-warm);font-size:var(--fs-sum);}
.sum-row .val{font-weight:700;min-width:0;overflow-wrap:anywhere;}
.sum-row .val.empty{color:var(--m-ink-faint);font-weight:400;}

/* 「이 단계는 잘 모르겠어요」 — ⛔ Handoff 처럼 꾸미지 않는다. 조용한 글자 하나다.
   📌 창구로 전달되는 것이 아직 없다(`state.unsure` 는 읽는 곳이 없다). 그 사실을
      화면이 과장하면 시민이 「직원이 알아서 봐 주겠지」로 오해한다. */
.ask-skip{flex:0 0 auto;margin-top:10px;text-align:center;}
.skip-link{font-family:inherit;font-size:13px;font-weight:400;color:var(--m-ink-muted);
  background:none;border:0;padding:4px 8px;cursor:pointer;text-decoration:underline;
  text-underline-offset:3px;}
.skip-link:hover{color:var(--blue);}
html.big .skip-link{font-size:14.5px;}
</style>
</head>

       ⛔ **[크게 보기]와 [DATE] 사이에 아무것도 넣지 마라** — 거기가 오른쪽 기준선이다.
       ⚠️ **작성의 주 행동(Primary CTA)은 여기가 아니라 ASK 의 [다음]/[신청서 인쇄]다.**
          지금 [미리보기]만 강조돼 보이는 것은 색 체계 문제라 후속 작업에서 함께 본다. -->
  <div class="actions">
    <!-- DETAIL TOOLS — 이 서식에만 있는 것. 담당자 점검용이라 한 치수 작다(`.btn.compact`).
         ⚠️ 라벨은 `FORM.sampleLabels` 가 넣는다(출생신고는 「작성예시(혼인 중)/(혼인 외)」).
         ⛔ 시민 화면에 「테스트용」 같은 말을 쓰지 않는다. -->
    <button class="btn ghost compact" id="btnSampleAdult"
            title="담당자 점검용 · 가상 인물로 채웁니다"></button>
    <button class="btn ghost compact" id="btnSampleMinor"
            title="담당자 점검용 · 가상 인물로 채웁니다"></button>
    <!-- ⛔ BAR 에 직접 인쇄 단추를 두지 않는다. 인쇄는 **작성 → 미리보기 → 인쇄** 하나로 간다
         (`docs/PRODUCT_SKIN_v1.md` §1-1). 확인하지 않고 찍으면 종이와 개인정보가 버려진다. -->
    <button class="btn primary" id="btnPreview"><svg class="btn-ic" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
      aria-hidden="true"><circle cx="10.6" cy="10.6" r="6.6"/><path d="M15.4 15.4L21 21"/></svg>
      <span>미리보기</span></button>
    <!-- COMMON TOOLS 의 끝 — ⛔ 여기와 DATE 사이에 아무것도 넣지 마라. 오른쪽 기준선이다. -->
    <button class="btn ghost" id="btnBig" aria-pressed="false"
            title="질문과 글자를 크게 봅니다"><svg class="btn-ic" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
      aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.6"/><path d="M15.4 15.4L21 21"/>
      </svg><span id="btnBigLabel">크게 보기</span></button>
</div>
  <!-- DATE — **최우측 고정**. 단추가 몇 개든 오른쪽 기준선이 움직이지 않는다 -->
  <span class="today" id="today"></span>
</header>

<div class="layout">
  <!-- ① 질문면(Writing Desk) — 한 화면에 한 가지 판단 -->
  <section class="task-col panel-col" aria-label="신고 내용 입력">
    <div class="task">
      <!-- ASK 상단 navigation — 돌아가는 길은 작성 영역의 맨 위다(Product Shell v1).
           ⛔ BAR 에 두지 않는다 — BAR 는 Main 과 같은 프레임이어야 한다. -->
      <div class="ask-nav">
        <a class="nav-back" href="index.html" title="첫 화면으로 돌아갑니다"><svg class="btn-ic"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5"/>
          <path d="M10.6 6l-6 6 6 6"/></svg><span>메인으로</span></a>
      </div>
      <div class="topline">
        <div class="wiz-title" id="wizTitle"></div>
        <div class="wiz-count" id="wizCount"></div>
      </div>
      <div class="wiz-body" id="wizBody" aria-live="polite"></div>
      <!-- Human Handoff 자리 — 그 화면에 탈출구가 없으면 `:empty` 로 0px 이 된다.
           📌 지금 엔진 서식에는 아직 Handoff 가 없다. **자리만** 여권과 같게 마련해 둔다 —
              무엇을 어느 화면에 둘지는 업무 판단이라 담당자 확인 뒤에 채운다. -->
      <div class="ask-foot" id="askFoot"></div>
      <div class="step-warn" id="stepWarn" role="status"></div>
      <button type="button" class="m-preview" id="btnPreviewMobile"><svg class="btn-ic" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
      aria-hidden="true"><circle cx="10.6" cy="10.6" r="6.6"/><path d="M15.4 15.4L21 21"/></svg><span>완성된
      서식 미리보기</span></button>
      <div class="wiz-nav">
        <button class="btn ghost" id="btnPrev"><svg class="btn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5"/><path d="M10.6 6l-6 6 6 6"/></svg><span>이전</span></button>
        <button class="btn primary" id="btnNext"><span>다음</span><svg class="btn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15"/><path d="M13.4 6l6 6-6 6"/></svg></button>
      </div>
      <!-- ⚠️ 「이 단계는 잘 모르겠어요」 — Product UI 로 예쁘게 꾸미지 않는다.
           필수 우회는 이미 막혀 있고(2026.08.29), 선택 항목은 위의 Hint 가 이미 안내한다.
           ⛔ 이것을 Handoff 처럼 보이게 만들지 마라 — 창구로 전달되는 것이 아직 없다. -->
      <div class="ask-skip"><button type="button" class="skip-link" id="btnSkip">이 단계는 잘 모르겠어요 · 나중에 창구에서</button></div>
      <div class="ask-reset">
        <button type="button" class="reset-btn" id="btnReset"><svg class="btn-ic" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/>
          <path d="M3.2 4.2v4.6h4.6"/></svg><span>처음부터 다시 작성</span></button>
      </div>
    </div>
  </section>

  <!-- ② 서식(Paper) — ⛔ 이 안의 구조는 인쇄층이 쓴다. 클래스 이름을 바꾸지 마라. -->
  <section class="form-col" aria-label="서식 미리보기">
    <div class="paper"><div class="stage"><img class="bg" alt="서식"><div class="ovl"></div></div></div>
    <div class="paper extra"></div>
  </section>

  <!-- ③ 안내 기둥(Companion Rail) — 진행 · 준비물 · 안심 · 이용 안내.
       `.panel-col` 을 함께 붙여 둔다: 인쇄 CSS 가 그 이름으로 숨긴다. -->
  <aside class="rail-col panel-col" aria-label="진행 상황과 안내">
    <div class="rail">
      <div class="rail-prog" id="stepper" role="progressbar"
           aria-valuemin="1" aria-valuemax="10" aria-valuenow="1"></div>
      <div class="rail-info" id="railInfo"></div>
      <div class="screen-notice">
        <h3>이용 안내</h3>
        <ul id="noticeList">
          <li>필요 서류는 직원 확인을 따릅니다.</li>
          <li>여기서 접수되지는 않습니다.</li>
        </ul>
      </div>
    </div>
  </aside>
</div>

<!-- 미리보기 — 인쇄로 가는 **유일한 길**이다(작성 → 미리보기 → 인쇄). -->
<div class="modal-back" id="modalBack" hidden>
  <div class="modal-box">
    <div class="modal-top"><b id="modalTitle"></b>
      <span><button class="btn primary" id="btnPrintModal">인쇄</button>
      <button class="btn ghost" id="btnCloseModal">닫기</button></span></div>
    <div class="modal-scroll"><div class="mstack">
      <div class="paper"><div class="stage"><img class="bg" alt="서식"><div class="ovl" id="ovlModal"></div></div></div>
      <div class="paper extra"></div>
    </div></div>
  </div>
</div>

   공통 엔진 — 가족관계등록 신고서 도우미 (이미지-오버레이 방식)
   FORM 설정 객체(forms/<이름>.config.js)가 서식별 좌표·필드·단계를 정의하고,
   이 엔진이 렌더·검증·네비게이션·이벤트·인쇄를 담당한다.
   ⚠️ 이 파일은 build-form.js가 자체완결 HTML로 인라인한다. 외부 로드 안 함.
   ===================================================================== */

/* 0) 실행 시각 (무저장) */
var APP_TODAY = null;

/* 1) 상태 (메모리 전용 · 저장 안 함 · 새로고침 시 소멸) */
function createEmptyState(){
  var s={ step:1, unsure:{} };
  var keys=FORM.stateKeys||[];
  for(var i=0;i<keys.length;i++) s[keys[i]]="";
  var def=FORM.stateDefaults||{};
  for(var k in def){ if(def.hasOwnProperty(k)) s[k]=def[k]; }
  return s;
}
var state = createEmptyState();

/* 2) 파생 (서식 config에서 쓸 수 있는 공통 헬퍼) */
function juminAge(jumin){
  var j=String(jumin||"").replace(/\D/g,"");
  if(j.length<7) return null;
  var yy=+j.slice(0,2), mm=+j.slice(2,4), dd=+j.slice(4,6), code=+j.charAt(6), c;
  if(code===1||code===2||code===5||code===6) c=1900;
  else if(code===3||code===4||code===7||code===8) c=2000;
  else if(code===9||code===0) c=1800;
  else return null;
  if(mm<1||mm>12||dd<1||dd>31) return null;
  var t=APP_TODAY||new Date();
  return t.getFullYear()-(c+yy)-((t.getMonth()+1<mm)||(t.getMonth()+1===mm&&t.getDate()<dd)?1:0);
}
function isMinor(p){ var a=juminAge(state[p+"_jumin"]); return a!=null && a<19; }
/* 주민등록번호 → 출생연월일 "YYYY.MM.DD" (7번째 자리로 세기 판정) */
function birthFromJumin(jumin){
  var j=digits(jumin); if(j.length<7) return "";
  var yy=j.slice(0,2), mm=j.slice(2,4), dd=j.slice(4,6), code=+j.charAt(6), c;
  if(code===1||code===2||code===5||code===6) c=1900;
  else if(code===3||code===4||code===7||code===8) c=2000;
  else if(code===9||code===0) c=1800;
  else return "";
  var m=+mm, d=+dd; if(m<1||m>12||d<1||d>31) return "";
  return (c+ +yy)+"."+mm+"."+dd;
}

/* 3) 포매터 */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function formatDate(d){
  var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  var w=["일","월","화","수","목","금","토"][d.getDay()];
  return y+"년 "+m+"월 "+day+"일 ("+w+")";
}
function formatJumin(v){
  var d=String(v||"").replace(/\D/g,"").slice(0,13);
  if(d.length<=6) return d;
  return d.slice(0,6)+"-"+d.slice(6);
}
function formatPhone(v){
  var d=String(v||"").replace(/\D/g,"").slice(0,11);
  if(d.length<4) return d;
  if(d.slice(0,2)==="02"){                       // 서울 지역번호만 2자리
    if(d.length<=5) return d.slice(0,2)+"-"+d.slice(2);
    if(d.length<=9) return d.slice(0,2)+"-"+d.slice(2,5)+"-"+d.slice(5);
    return d.slice(0,2)+"-"+d.slice(2,6)+"-"+d.slice(6);
  }
  if(d.length<7) return d.slice(0,3)+"-"+d.slice(3);
  if(d.length<11) return d.slice(0,3)+"-"+d.slice(3,6)+"-"+d.slice(6);
  return d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7);
}
/* 숫자 8자리 → yyyy.mm.dd, 그 외는 입력값 유지 */
function formatDateFlexible(v){
  var raw=String(v||"");
  var d=raw.replace(/\D/g,"");
  if(d.length===8) return d.slice(0,4)+"."+d.slice(4,6)+"."+d.slice(6);
  return raw;
}
function digits(s){ return String(s||"").replace(/\D/g,""); }
/* 금액: 숫자만 남기고 3자리마다 콤마 (거래가격 등 — 0 자릿수 확인용) */
function formatMoney(v){ var d=digits(v).replace(/^0+(?=\d)/,""); return d?d.replace(/\B(?=(\d{3})+(?!\d))/g,","):""; }
function j1(s){ return digits(s).slice(0,6); }
function j2(s){ return digits(s).slice(6,13); }
function ymd(s){ var m=String(s||"").match(/(\d{4})\D*(\d{1,2})\D*(\d{1,2})/); return m?[m[1],m[2],m[3]]:["","",""]; }

/* 4) 좌측: 실제 서식 이미지 위에 값 오버레이 */
var PW=595, PH=841;        // PDF 포인트 좌표계 (배경 이미지도 동일 A4 비율)
var CO=FORM.CO, STEP_HL=FORM.STEP_HL||{};

function buildVals(){ return FORM.buildVals(state); }

function stepHighlights(X,Y){
  var boxes=STEP_HL[state.step]; if(!boxes) return "";
  var h="";
  boxes.forEach(function(b){
    h+='<span class="ovhl" style="left:'+X(b[0])+'%;top:'+Y(b[1])+'%;width:'+
       ((b[2]-b[0])/PW*100).toFixed(2)+'%;height:'+((b[3]-b[1])/PH*100).toFixed(2)+'%;"></span>';
  });
  return h;
}

// 배경 서식 이미지 위에 값/영표를 얹어 그림 (좌측 + 미리보기 모달 공용)
function renderForm(){
  var v=buildVals(), h="";
  var X=function(x){return (x/PW*100).toFixed(2);}, Y=function(y){return (y/PH*100).toFixed(2);};
  var fs=function(pt){return (pt/PW*100).toFixed(2);};   // 포인트 → cqw

  // 현재 단계 강조(맨 밑에 깔림)
  h+=stepHighlights(X,Y);

  // 형광펜: 인쇄 후 날인·서명해야 하는 칸 — 서식 config가 조건부로 반환
  var HI=(FORM.signatureHI?FORM.signatureHI(v,state):[])||[];
  HI.forEach(function(b){
    h+='<span class="ovhi" style="left:'+X(b[0])+'%;top:'+Y(b[1])+'%;width:'+
       ((b[2]-b[0])/PW*100).toFixed(2)+'%;height:'+((b[3]-b[1])/PH*100).toFixed(2)+'%;"></span>';
  });

  // 자유 텍스트 값 (신청서 내부 글자 — 가독성 위해 +1.5pt 확대; nb면 확대 안 함)
  var TEXT_BUMP=1.5;
  Object.keys(CO.texts).forEach(function(k){
    var val=String(v[k]==null?"":v[k]).trim(); if(!val) return;
    var t=CO.texts[k], cls="ov"+(t.a==="l"?" t":"")+(t.a==="r"?" r":"");
    var st="left:"+X(t.x)+"%;top:"+Y(t.y)+"%;font-size:"+fs(t.size+(t.nb?0:TEXT_BUMP))+"cqw;";
    if(t.wrap){ st+="width:"+(t.w/PW*100).toFixed(2)+"%;white-space:normal;line-height:1.2;"; }
    h+='<span class="'+cls+'" style="'+st+'">'+esc(val)+'</span>';
  });

  // 선택항목 표기 — 서식이 지시하는 기호를 쓴다.
  // 가족관계등록 신고서는 '영표(○)', 부동산거래계약 신고서 등 [ ] 서식은 '√표'.
  var MK=FORM.checkMark||"○", MKS=FORM.checkSize||12;
  var MKC=FORM.checkBlack?" blk":"";     // 검정 표기(인쇄 CSS가 !important라 클래스로 처리)
  var circle=function(p){ return '<span class="ov o'+MKC+'" style="left:'+X(p[0])+'%;top:'+Y(p[1])
    +'%;font-size:'+fs(MKS)+'cqw;">'+MK+'</span>'; };
  Object.keys(CO.checks||{}).forEach(function(field){
    if(FORM.checkVisible && !FORM.checkVisible(field,state)) return;
    var val=state[field]; if(!val) return;
    var pos=CO.checks[field][val]; if(pos) h+=circle(pos);
  });
  Object.keys(CO.attend||{}).forEach(function(field){ if(state[field]) h+=circle(CO.attend[field]); });

  // 신고일(오늘) — 제목 아래 ( 년 월 일 )
  var t=APP_TODAY||new Date(), td=FORM.today;
  if(td){
    var ds=function(x,val){ return '<span class="ov" style="left:'+X(x)+'%;top:'+Y(td.y)
      +'%;font-size:'+fs(7.5)+'cqw;">'+val+'</span>'; };
    h+=ds(td.yx,t.getFullYear())+ds(td.mx,t.getMonth()+1)+ds(td.dx,t.getDate());
  }

  document.querySelectorAll(".ovl").forEach(function(o){ o.innerHTML=h; });
  renderExtras();
}

/* 첨부 페이지(별지 등) — FORM.extraPages(state)가 HTML을 돌려주면 서식 뒤에 붙는다.
   내용이 없으면 빈 문자열을 돌려주고, .extra:empty 규칙으로 화면·인쇄에서 사라진다. */

}

/* ══ 선택사항 공통 안내 (2026.08.29 담당자 요구) ═══════════════════════
   가족관계등록 신고서는 원칙적으로 **모든 사항이 필수**다. 다만 **등록기준지·본·한자**는
   시민이 그 자리에서 알기 어려워 창구가 채운다 — 그 칸에는 아래 한 문장을 붙인다.
   ⛔ **화면마다 비슷한 말을 새로 짓지 마라.** 문구는 여기 하나뿐이고, 서식은

function isRailShell(){ return !!document.getElementById("railInfo"); }

/* ══ 안내 기둥의 진행 표시 (Product UI v1 · 여권과 같은 문법) ═══════════
   캡션 + 큰 숫자 + 지금 묶음 + 막대 + 묶음 목록.
   ⚠️ 분모는 **활성 단계 수**다 — 출생신고는 혼인 중 10 / 혼인 외 9 로 갈린다.
      「N / 10」 같은 고정 표기는 맞지 않는다.
   ⚠️ 지나온 묶음은 눌러 되돌아갈 수 있다. 앞으로 건너뛰기는 `gotoStep` 이 막는다. */
function renderRailProg(){
  var act=activeSteps(), n=act.length, pos=act.indexOf(state.step)+1;
  var pct=Math.round((pos||1)/(n||1)*100);
  var cur=FORM.STEPS[state.step-1];
  var h='<div class="rail-cap">작성 진행</div>';
  h+='<div class="rail-num">'+pos+' <span>/ '+n+'</span></div>';
  h+='<div class="rail-now">'+esc(cur?cur.short:"")+'</div>';
  h+='<div class="pbar"><div class="pbar-fill" style="width:'+pct+'%"></div></div>';
  h+='<div class="rail-steps">';
  act.forEach(function(nn){
    var st=FORM.STEPS[nn-1], done=nn<state.step, now=nn===state.step;
    var cls=done?"done":(now?"now":"");
    var mark=done?svgIcon("check","ic-dot"):"";
    h+= done
      ? '<button type="button" class="rail-step '+cls+'" data-goto="'+nn+'">'+
        '<span class="dot">'+mark+'</span><span>'+esc(st.short)+'</span></button>'
      : '<div class="rail-step '+cls+'"><span class="dot">'+mark+'</span>'+
        '<span>'+esc(st.short)+'</span></div>';
  });
  h+='</div>';
  el.stepper.innerHTML=h;
  el.stepper.setAttribute("aria-valuemin",1);
  el.stepper.setAttribute("aria-valuemax",n);
  el.stepper.setAttribute("aria-valuenow",pos);
  el.stepper.setAttribute("aria-valuetext",pos+" / "+n+" 단계 · "+(cur?cur.short:""));
}

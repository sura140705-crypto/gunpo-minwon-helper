<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>인쇄하지 못했습니다</title>
<!-- 인쇄가 되지 않았을 때 시민에게 보여 주는 화면.
     예전에는 인쇄가 실패해도 아무 말 없이 첫 화면으로 돌아가, 종이가 안 나온 줄 모르고
     자리를 뜨는 일이 생겼다(2026.08 보안성 검토 지적). 서식 파일이 아니라 여기 admin/ 에 둔다 —
     배포 동기화 대상(app/)을 늘리지 않기 위해서다. 외부 통신·저장 없음. -->
<style>
  html,body{margin:0;height:100%;font-family:"맑은 고딕","Malgun Gothic",sans-serif;background:#fff5f5;}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
        text-align:center;padding:40px;box-sizing:border-box;}
  .icon{font-size:72px;line-height:1;margin-bottom:24px;}
  h1{font-size:44px;color:#c0392b;margin:0 0 20px;font-weight:800;}
  .why{font-size:26px;color:#7f2b20;background:#fff;border:3px solid #f3c6c0;border-radius:14px;
       padding:18px 28px;margin:0 0 28px;max-width:900px;}
  p{font-size:28px;color:#333;margin:6px 0;line-height:1.5;}
  .staff{font-size:30px;font-weight:800;color:#123f7f;margin-top:22px;}
  .back{font-size:22px;color:#666;margin-top:30px;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">🖨️</div>
    <h1>인쇄하지 못했습니다</h1>
    <div class="why" id="why">프린터를 확인해 주세요.</div>
    <p>작성하신 내용은 <b>저장되지 않습니다.</b></p>
    <p>종이가 나오지 않았다면 처음부터 다시 작성해야 합니다.</p>
    <div class="staff">창구 직원에게 말씀해 주세요.</div>
    <div class="back"><span id="sec">6</span>초 뒤 첫 화면으로 돌아갑니다.</div>
  </div>
<script>
  // 사유는 프린터 상태 문구뿐이며 개인정보가 들어가지 않는다(main.js 가 넘긴다).
  var r = new URLSearchParams(location.search).get("reason");
  if (r) document.getElementById("why").textContent = r;
  var n = 6, el = document.getElementById("sec");
  setInterval(function(){ if (n > 0) { n -= 1; el.textContent = n; } }, 1000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>이용할 수 없습니다</title>
<!-- 보호 장치를 적용하지 못했을 때의 화면. 이 상태에서는 **작성을 아예 받지 않는다** —
     인쇄 보호가 걸리지 않은 채로 쓰게 두면 인쇄 대화상자에서 'PDF로 저장'을 고를 수 있어
     개인정보가 파일로 남는다. 안전한 쪽으로 멈추는 것이 맞다(2026.08 보안성 검토). -->
<style>
  html,body{margin:0;height:100%;font-family:"맑은 고딕","Malgun Gothic",sans-serif;background:#f4f6f9;}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
        text-align:center;padding:40px;box-sizing:border-box;}
  .icon{font-size:72px;line-height:1;margin-bottom:24px;}
  h1{font-size:44px;color:#123f7f;margin:0 0 20px;font-weight:800;}
  .why{font-size:24px;color:#555;background:#fff;border:3px solid #d8dee8;border-radius:14px;
       padding:18px 28px;margin:0 0 28px;max-width:900px;}
  .staff{font-size:30px;font-weight:800;color:#c0392b;}
  .hint{font-size:20px;color:#888;margin-top:36px;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">🔧</div>
    <h1>지금은 이용할 수 없습니다</h1>
    <div class="why" id="why">점검이 필요합니다.</div>
    <div class="staff">창구 직원에게 말씀해 주세요.</div>
    <div class="hint">관리자 : Ctrl + Shift + Q 로 종료한 뒤 점검(`--selfcheck`)을 실행하십시오.</div>
  </div>
<script>
  var m = new URLSearchParams(location.search).get("message");
  if (m) document.getElementById("why").textContent = m;
</script>
</body>
</html>

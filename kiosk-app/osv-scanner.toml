# osv-scanner 예외 — 빌드 전용 의존성에 한정한다
#
# ⛔ 이 파일을 저장소 루트로 옮기지 마라. **아무 효력이 없어진다.**
#    osv-scanner 는 설정 파일을 「검사 대상 파일과 같은 디렉터리」에서만 찾고
#    상위 디렉터리로 올라가지 않는다(공식 문서: "place an osv-scanner.toml file in
#    the scanned file's directory. This does not propagate to child directories").
#    검사 대상은 `kiosk-app/package-lock.json` 이므로 이 파일은 그 옆에 있어야 한다.
#    루트에 둬도 스캐너는 조용히 무시하고 69건을 그대로 보고한다 — 처음에 실제로 그랬다.
#
# 이 저장소가 배포하는 것은 Electron 설치본 하나이고, 그 안에 들어가는 파일은
# kiosk-app/package.json 의 build.files 화이트리스트가 정한다 —
#   main.js · preload.js · print-options.js · stats.js · app/**/* · admin/*.html ·
#   admin/pin-preload.js · admin/settings-preload.js
# node_modules 는 거기에 없다. 즉 아래 항목들은 **설치본에 한 줄도 담기지 않는다.**
#
# package.json 에는 dependencies 항목 자체가 없고 devDependencies 에
# electron 과 electron-builder 둘만 있다. 확인:
#
#   npm audit --omit=dev   ->  found 0 vulnerabilities
#   npm audit              ->  18 vulnerabilities (전부 빌드 도구 갈래)
#
# 해당 패키지(18개): @electron/rebuild · @xmldom/xmldom · app-builder-lib ·
#   brace-expansion · builder-util · builder-util-runtime · cacache · dmg-builder ·
#   electron · electron-builder · electron-builder-squirrel-windows · electron-publish ·
#   extract-zip · ip-address · js-yaml · make-fetch-happen · node-gyp · tar
#
# ⚠️ 이것은 「무시해도 되는 취약점」이라는 뜻이 아니라 **배포물에 없는 것**이라는 뜻이다.
#    빌드 PC 는 여전히 이 패키지들을 설치한다.
# 📌 근본 해결은 electron-builder 를 올리는 것이다. npm audit fix 로는 해소되지 않고
#    (--dry-run 시 18건 그대로) --force 가 필요한 메이저 업그레이드라, 시범운영 중에
#    설치본을 다시 굽고 전 항목을 재검증할 수 있을 때 따로 처리한다.
#
# 생성: 2026.09.19 · 목록 근거는 `cd kiosk-app && npm audit --json`.
# 옮김: 2026.09.21 · 루트 → `kiosk-app/` (위 ⛔ 참조).

